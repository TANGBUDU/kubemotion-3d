schemaVersion: 1
id: kubernetes-foundations
title: { en: Kubernetes Foundations, ja: Kubernetes 基礎, zh-CN: Kubernetes 基础 }
summary:
  {
    en: Build an accurate mental model by watching the system move.,
    ja: 動きを見ながら正確なメンタルモデルを作ります。,
    zh-CN: 通过观察系统运动建立准确的心智模型。,
  }
lessonOrder:
  - cluster-overview
  - pod-and-placement
  - manifest-to-running-pod
  - service-and-endpoints
  - container-restart-vs-pod-replacement
  - probes
  - rolling-update
  - pod-network-and-cni
  - dns-and-service-discovery
  - service-types
  - gateway-api
  - ingress-and-gateway
  - full-external-request
  - configmap-and-secret
  - ephemeral-storage
  - pvc-pv-storageclass
  - statefulset
  - requests-and-limits
  - pending-and-scheduling
  - hpa
  - common-failure-states
  - final-503-challenge
lessons:
  - id: cluster-overview
    chapterId: foundations
    status: available
    prerequisites: []
    title:
      {
        en: What a Kubernetes cluster contains,
        ja: Kubernetes クラスターの構成,
        zh-CN: Kubernetes 集群包含什么,
      }
    learningOutcome:
      {
        en: Identify the control plane and worker nodes.,
        ja: コントロールプレーンと worker Node を区別する。,
        zh-CN: 区分控制面与工作 Node。,
      }
    estimatedMinutes: 5
  - id: pod-and-placement
    chapterId: foundations
    status: available
    prerequisites: [cluster-overview]
    title:
      { en: 'Pods, Namespaces, and Nodes', ja: Pod・Namespace・Node, zh-CN: Pod、Namespace 与 Node }
    learningOutcome:
      {
        en: Separate logical scope from physical placement.,
        ja: 論理スコープと物理配置を区別する。,
        zh-CN: 区分逻辑作用域与物理放置。,
      }
    estimatedMinutes: 6
  - id: manifest-to-running-pod
    chapterId: foundations
    status: available
    prerequisites: [pod-and-placement]
    title:
      {
        en: From manifest to running Pod,
        ja: マニフェストから実行中 Pod へ,
        zh-CN: 从清单到运行中的 Pod,
      }
    learningOutcome:
      {
        en: Explain each component's responsibility.,
        ja: 各コンポーネントの責務を説明する。,
        zh-CN: 说明各组件的职责。,
      }
    estimatedMinutes: 7
  - id: service-and-endpoints
    chapterId: networking-resilience
    status: available
    prerequisites: [manifest-to-running-pod]
    title:
      {
        en: How a Service reaches changing Pods,
        ja: Service が変化する Pod に届く仕組み,
        zh-CN: Service 如何访问变化的 Pod,
      }
    learningOutcome:
      {
        en: 'Explain selectors, EndpointSlices, and stable access.',
        ja: selector・EndpointSlice・安定した入口を説明する。,
        zh-CN: 解释 Selector、EndpointSlice 与稳定入口。,
      }
    estimatedMinutes: 7
  - id: container-restart-vs-pod-replacement
    chapterId: networking-resilience
    status: available
    prerequisites: [service-and-endpoints]
    title:
      {
        en: Container restart is not Pod replacement,
        ja: コンテナ再起動と Pod 置換の違い,
        zh-CN: 容器重启不等于 Pod 替换,
      }
    learningOutcome:
      {
        en: Distinguish a restart inside a Pod from a replacement Pod.,
        ja: Pod 内の再起動と Pod 置換を区別する。,
        zh-CN: 区分 Pod 内重启与替换 Pod。,
      }
    estimatedMinutes: 6
  - {
      id: probes,
      chapterId: networking-resilience,
      status: planned,
      prerequisites: [container-restart-vs-pod-replacement],
      title: { en: Probes, ja: Probe, zh-CN: 探针 },
      learningOutcome: { en: Planned lesson, ja: 今後のレッスン, zh-CN: 规划课程 },
      estimatedMinutes: 6,
    }
  - {
      id: rolling-update,
      chapterId: networking-resilience,
      status: planned,
