schemaVersion: 1
id: kubernetes-foundations
title: { en: Kubernetes Foundations, ja: Kubernetes 基礎, zh-CN: Kubernetes 基础 }
summary:
  en: Build an accurate mental model by watching factual system state change.
  ja: 事実に基づくシステム状態の変化を観察し、正確なメンタルモデルを作ります。
  zh-CN: 通过观察事实性的系统状态变化，建立准确的心智模型。
lessonOrder:
  - why-kubernetes-exists
  - cluster-overview
  - pod-and-container
  - pod-and-placement
  - deployment-replicaset-and-pods
  - manifest-to-running-pod
  - pending-and-scheduling
  - container-restart-vs-pod-replacement
  - labels-and-selectors
  - service-routes-to-pods
  - dns-and-service-discovery
  - probes-and-rolling-update
  - pod-network-and-cni
  - service-types
  - ingress-and-gateway
  - full-external-request
  - configmap-and-secret
  - pvc-pv-storageclass
  - statefulset
  - requests-and-limits
  - hpa
  - final-503-challenge
lessons:
  - id: why-kubernetes-exists
    chapterId: foundations
    status: available
    prerequisites: []
    title:
      { en: Why Kubernetes exists, ja: Kubernetes が存在する理由, zh-CN: 为什么需要 Kubernetes }
    learningOutcome:
      en: Distinguish container packaging from orchestration, then explain desired-state recovery.
      ja: コンテナのパッケージ化とオーケストレーションを区別し、望ましい状態による復旧を説明する。
      zh-CN: 区分容器打包与编排，并解释基于期望状态的故障恢复。
    estimatedMinutes: 6
  - id: cluster-overview
    chapterId: foundations
    status: available
    prerequisites: [why-kubernetes-exists]
    title:
      {
        en: What a Kubernetes cluster contains,
        ja: Kubernetes クラスターの構成,
        zh-CN: Kubernetes 集群包含什么,
      }
    learningOutcome:
      {
        en: Identify the control plane and worker Nodes.,
        ja: コントロールプレーンと worker Node を区別する。,
        zh-CN: 区分控制面与工作 Node。,
      }
    estimatedMinutes: 5
  - id: pod-and-container
    chapterId: foundations
    status: available
    prerequisites: [cluster-overview]
    title: { en: Pod and Container, ja: Pod と Container, zh-CN: Pod 与容器 }
    learningOutcome:
      {
        en: Explain why containers run inside a Pod boundary.,
        ja: コンテナが Pod 境界内で動く理由を説明する。,
        zh-CN: 解释容器为何运行在 Pod 边界内。,
      }
    estimatedMinutes: 5
  - id: pod-and-placement
    chapterId: foundations
    status: available
    prerequisites: [pod-and-container]
    title:
      { en: 'Pods, Namespaces, and Nodes', ja: Pod・Namespace・Node, zh-CN: Pod、Namespace 与 Node }
    learningOutcome:
      {
        en: Separate logical scope from physical placement.,
        ja: 論理スコープと物理配置を区別する。,
        zh-CN: 区分逻辑作用域与物理放置。,
      }
    estimatedMinutes: 6
  - id: deployment-replicaset-and-pods
    chapterId: workloads-self-healing
    status: available
    prerequisites: [pod-and-placement]
    title:
      {
        en: 'Deployment, ReplicaSet, and Pods',
        ja: Deployment・ReplicaSet・Pod,
        zh-CN: Deployment、ReplicaSet 与 Pod,
      }
    learningOutcome:
      {
        en: Trace ownership from a Deployment blueprint to ReplicaSet-controlled Pod replicas.,
        ja: Deployment の設計図から ReplicaSet 管理の Pod レプリカまで所有関係を追う。,
        zh-CN: 从 Deployment 蓝图追踪到 ReplicaSet 管理的 Pod 副本。,
      }
    estimatedMinutes: 6
  - id: manifest-to-running-pod
    chapterId: workloads-self-healing
    status: available
    prerequisites: [deployment-replicaset-and-pods]
    title:
      {
        en: From a Deployment manifest to a Ready Pod,
        ja: Deployment manifest から Ready な Pod まで,
        zh-CN: 从 Deployment 清单到 Ready Pod,
      }
    learningOutcome:
      {
        en: Explain each component's responsibility from API submission through startup.,
        ja: API への送信から起動まで各コンポーネントの責務を説明する。,
        zh-CN: 说明从提交 API 到启动过程中各组件的职责。,
      }
    estimatedMinutes: 8
  - id: pending-and-scheduling
    chapterId: workloads-self-healing
    status: available
    prerequisites: [manifest-to-running-pod]
    title:
      { en: Pending Pod and scheduling, ja: Pending Pod と scheduling, zh-CN: Pending Pod 与调度 }
    learningOutcome:
      {
        en: 'Separate Pod creation, Node selection, binding, and container startup.',
        ja: Pod 作成、Node 選択、binding、コンテナ起動を区別する。,
        zh-CN: 区分 Pod 创建、Node 选择、绑定与容器启动。,
      }
    estimatedMinutes: 6
  - id: container-restart-vs-pod-replacement
    chapterId: workloads-self-healing
    status: available
    prerequisites: [pending-and-scheduling]
    title:
      {
        en: Container restart is not Pod replacement,
        ja: コンテナ再起動と Pod 置換の違い,
        zh-CN: 容器重启不等于 Pod 替换,
      }
    learningOutcome:
      {
        en: Distinguish a restart inside one Pod from a new replacement Pod.,
        ja: 同じ Pod 内の再起動と新しい置換 Pod を区別する。,
        zh-CN: 区分同一 Pod 内重启与新替换 Pod。,
      }
    estimatedMinutes: 8
  - id: labels-and-selectors
    chapterId: networking-resilience
    status: available
    prerequisites: [container-restart-vs-pod-replacement]
    title: { en: Labels and selectors, ja: Label と Selector, zh-CN: Label 与 Selector }
    learningOutcome:
      {
        en: Predict which objects match a selector after label changes.,
        ja: Label の変化後に selector と一致するオブジェクトを予測する。,
        zh-CN: 预测 Label 变化后哪些对象匹配 Selector。,
      }
    estimatedMinutes: 5
  - id: service-routes-to-pods
    chapterId: networking-resilience
    status: available
    prerequisites: [labels-and-selectors]
    title:
      {
        en: How a Service routes to ready Pods,
        ja: Service が ready な Pod へルーティングする仕組み,
        zh-CN: Service 如何将流量路由到 Ready Pod,
      }
    learningOutcome:
      {
        en: 'Distinguish stable Service access, endpoint readiness, and backend selection.',
        ja: 安定した Service 入口、endpoint readiness、backend 選択を区別する。,
        zh-CN: 区分稳定 Service 访问、Endpoint 就绪与后端选择。,
      }
    estimatedMinutes: 6
  - id: dns-and-service-discovery
    chapterId: networking-resilience
    status: available
    prerequisites: [service-routes-to-pods]
    title:
      { en: DNS and Service discovery, ja: DNS と Service discovery, zh-CN: DNS 与 Service 发现 }
    learningOutcome:
      {
        en: Separate Service-name resolution from the later application request route.,
        ja: Service 名の解決と、その後のアプリケーションリクエスト経路を区別する。,
        zh-CN: 区分 Service 名称解析与后续应用请求路线。,
      }
    estimatedMinutes: 6
  - id: probes-and-rolling-update
    chapterId: resources-scaling
    status: available
    prerequisites: [dns-and-service-discovery]
    title: { en: Probes and a rolling update, ja: Probe とローリング更新, zh-CN: 探针与滚动更新 }
    learningOutcome:
      {
        en: Distinguish probe effects and explain readiness-gated rollout progress.,
        ja: probe の効果を区別し、readiness によるロールアウト進行を説明する。,
        zh-CN: 区分探针作用并解释由就绪状态门控的滚动进度。,
      }
    estimatedMinutes: 8
  - id: pod-network-and-cni
    chapterId: networking-resilience
    status: planned
    prerequisites: [probes-and-rolling-update]
    title: { en: Pod network and CNI, ja: Pod ネットワークと CNI, zh-CN: Pod 网络与 CNI }
    learningOutcome: { en: Planned lesson, ja: 今後のレッスン, zh-CN: 规划课程 }
    estimatedMinutes: 8
  - id: service-types
    chapterId: external-traffic
    status: planned
    prerequisites: [pod-network-and-cni]
    title: { en: Service types, ja: Service タイプ, zh-CN: Service 类型 }
    learningOutcome: { en: Planned lesson, ja: 今後のレッスン, zh-CN: 规划课程 }
    estimatedMinutes: 6
  - id: ingress-and-gateway
    chapterId: external-traffic
    status: planned
    prerequisites: [service-types]
    title:
      { en: Ingress and Gateway API, ja: Ingress と Gateway API, zh-CN: Ingress 与 Gateway API }
    learningOutcome: { en: Planned lesson, ja: 今後のレッスン, zh-CN: 规划课程 }
    estimatedMinutes: 8
  - id: full-external-request
    chapterId: external-traffic
    status: planned
    prerequisites: [ingress-and-gateway]
    title: { en: Full external request, ja: 外部リクエスト全体, zh-CN: 完整外部请求 }
    learningOutcome: { en: Planned lesson, ja: 今後のレッスン, zh-CN: 规划课程 }
    estimatedMinutes: 8
  - id: configmap-and-secret
    chapterId: configuration-storage
    status: planned
    prerequisites: [full-external-request]
    title: { en: ConfigMap and Secret, ja: ConfigMap と Secret, zh-CN: ConfigMap 与 Secret }
    learningOutcome: { en: Planned lesson, ja: 今後のレッスン, zh-CN: 规划课程 }
    estimatedMinutes: 7
  - id: pvc-pv-storageclass
    chapterId: configuration-storage
    status: planned
    prerequisites: [configmap-and-secret]
    title:
      {
        en: 'PVC, PV, StorageClass, and ephemeral storage',
        ja: PVC、PV、StorageClass、一時ストレージ,
        zh-CN: PVC、PV、StorageClass 与临时存储,
      }
    learningOutcome: { en: Planned lesson, ja: 今後のレッスン, zh-CN: 规划课程 }
    estimatedMinutes: 9
  - id: statefulset
    chapterId: configuration-storage
    status: planned
    prerequisites: [pvc-pv-storageclass]
    title: { en: StatefulSet, ja: StatefulSet, zh-CN: StatefulSet }
    learningOutcome: { en: Planned lesson, ja: 今後のレッスン, zh-CN: 规划课程 }
    estimatedMinutes: 8
  - id: requests-and-limits
    chapterId: resources-scaling
    status: planned
    prerequisites: [statefulset]
    title: { en: Requests and limits, ja: request と limit, zh-CN: Requests 与 Limits }
    learningOutcome: { en: Planned lesson, ja: 今後のレッスン, zh-CN: 规划课程 }
    estimatedMinutes: 8
  - id: hpa
    chapterId: resources-scaling
    status: planned
    prerequisites: [requests-and-limits]
    title:
      { en: Horizontal Pod Autoscaling, ja: Horizontal Pod Autoscaling, zh-CN: 水平 Pod 自动扩缩 }
    learningOutcome: { en: Planned lesson, ja: 今後のレッスン, zh-CN: 规划课程 }
    estimatedMinutes: 8
  - id: final-503-challenge
    chapterId: resources-scaling
    status: planned
    prerequisites: [hpa]
    title:
      {
        en: Common failures and the final 503 challenge,
        ja: よくある障害と最終 503 チャレンジ,
        zh-CN: 常见故障与最终 503 挑战,
      }
    learningOutcome: { en: Planned lesson, ja: 今後のレッスン, zh-CN: 规划课程 }
    estimatedMinutes: 10
