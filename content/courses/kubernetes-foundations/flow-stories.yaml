  - schemaVersion: 1
    id: readiness-failure-and-traffic-shift
    priority: P1
    lessonId: service-routes-to-pods
    scenarioId: service-routes-to-pods
    title:
      en: Readiness failure and traffic shift
      ja: Readiness 失敗とトラフィック移行
      zh-CN: 就绪失败与流量迁移
    summary:
      en: Keep the Service stable while one running Pod becomes ineligible and the next request selects another ready endpoint.
      ja: Service を安定させたまま、実行中 Pod が対象外となり、次の要求が別の Ready endpoint を選ぶ流れを追います。
      zh-CN: 在 Service 保持稳定时，观察一个运行中 Pod 失去资格，下一次请求转向另一个 Ready Endpoint。
    outcome:
      en: Explain why readiness changes endpoint eligibility without changing the Service address or terminating the Pod.
      ja: Readiness が Service アドレスや Pod の実行状態を変えずに endpoint の適格性だけを変える理由を説明できます。
      zh-CN: 解释 readiness 为何只改变 Endpoint 流量资格，而不改变 Service 地址或终止 Pod。
    sourceIds: [k8s-probes, k8s-services, k8s-endpoint-slices, k8s-pod-conditions]
    verifiedAt: '2026-08-08'
    beats:
      - id: initial-request
        stepId: request-ready-backend
        routeIds: [client-service-api-a]
        selectedRouteId: client-service-api-a
      - id: readiness-fails
        stepId: endpoint-becomes-not-ready
        routeIds: []
      - id: shifted-request
        stepId: later-request-ready-backend
        routeIds: [client-service-api-c]
        selectedRouteId: client-service-api-c

  - schemaVersion: 1
    id: rolling-update-traffic-shift
    priority: P1
    lessonId: probes-and-rolling-update
    scenarioId: probes-and-rolling-update
    title:
      en: Rolling update with traffic shift
      ja: トラフィック移行を伴うローリング更新
      zh-CN: 带流量迁移的滚动更新
    summary:
      en: Follow a new ReplicaSet and Pod from startup gating to readiness, endpoint membership, traffic, and old-replica removal.
      ja: 新しい ReplicaSet と Pod を、起動ゲートから Readiness、endpoint 参加、通信、旧 replica の削除まで追います。
      zh-CN: 跟踪新 ReplicaSet 和 Pod 从启动门控、就绪、加入 Endpoint、承接流量到旧副本移除。
    outcome:
      en: Explain why a rolling update waits for a new ready backend before removing the old replica.
      ja: ローリング更新が新しい Ready バックエンドを待ってから旧 replica を削除する理由を説明できます。
      zh-CN: 解释滚动更新为何等待新后端 Ready 后才移除旧副本。
    sourceIds: [k8s-deployments, k8s-probes, k8s-services, k8s-endpoint-slices, k8s-pods]
