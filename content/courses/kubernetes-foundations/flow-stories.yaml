    priority: P0
    lessonId: service-routes-to-pods
    scenarioId: service-routes-to-pods
    title:
      en: Internal Service request
      ja: クラスタ内部の Service リクエスト
      zh-CN: 集群内部 Service 请求
    summary:
      en: Trace a client request through one stable Service entry to the ready backend selected from EndpointSlice evidence.
      ja: クライアント要求が安定した Service 入口を通り、EndpointSlice の根拠から選ばれた Ready バックエンドへ届く流れを追います。
      zh-CN: 跟踪客户端请求通过稳定的 Service 入口，到达 EndpointSlice 证据所选的 Ready 后端。
    outcome:
      en: Distinguish the persistent application route from selector and EndpointSlice configuration evidence.
      ja: 永続的なアプリケーション経路と、selector／EndpointSlice の構成根拠を区別できます。
      zh-CN: 区分持久应用流量路线与 selector、EndpointSlice 配置证据。
    sourceIds: [k8s-services, k8s-endpoint-slices, k8s-endpoint-slice-api, k8s-networking-overview]
    verifiedAt: '2026-08-08'
