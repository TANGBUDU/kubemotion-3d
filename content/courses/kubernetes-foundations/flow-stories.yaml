  - schemaVersion: 1
    id: manifest-to-running-pod
    priority: P0
    lessonId: manifest-to-running-pod
    scenarioId: container-restart-golden
    title:
      en: Manifest to running Pod
      ja: マニフェストから実行中の Pod まで
      zh-CN: 从清单到运行中的 Pod
    summary:
      en: Follow desired state through the API, reconciliation, scheduling, Node observation, and runtime startup.
      ja: 期待状態が API、調整、スケジューリング、Node の監視、ランタイム起動を通る流れを追います。
      zh-CN: 跟随期望状态依次经过 API、协调、调度、Node 观察和运行时启动。
    outcome:
      en: Explain why object creation, scheduling, and Container startup are distinct API-mediated events.
      ja: オブジェクト作成、スケジューリング、Container 起動が API を介した別々の事象である理由を説明できます。
      zh-CN: 解释对象创建、调度和容器启动为何是由 API 串联的不同事件。
    sourceIds: [k8s-objects, k8s-api, k8s-components, k8s-deployments, k8s-pods, k8s-nodes, k8s-cri]
    verifiedAt: '2026-08-08'
