      ja: メトリクス上昇から、期待 replica 数の変更、Pod 作成、配置、起動、Readiness、通信容量の拡大まで追います。
      zh-CN: 跟踪指标升高后，期望副本数变化、Pod 创建、调度、运行时启动、就绪和流量容量扩展。
    outcome:
      en: Explain that HPA changes desired replicas while controllers, Scheduler, kubelet, and runtime perform the actual scale-out.
      ja: HPA は期待 replica 数を変え、実際の拡張は controller、Scheduler、kubelet、runtime が担うと説明できます。
      zh-CN: 解释 HPA 只改变期望副本数，实际扩容由控制器、Scheduler、kubelet 和运行时完成。
