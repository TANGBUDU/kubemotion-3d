        stepId: persist-api-state
        routeIds: [route-api-storage]
        selectedRouteId: route-api-storage
      - id: reconcile-pod
        stepId: controller-creates-pending-pod
        routeIds: [route-controller-create-pod]
        selectedRouteId: route-controller-create-pod
      - id: pending-before-scheduling
        stepId: pending-before-scheduling
        routeIds: []
      - id: record-binding
        stepId: scheduler-records-worker-c
        routeIds: [route-scheduler-bind-manifest-pod]
        selectedRouteId: route-scheduler-bind-manifest-pod
      - id: observe-assignment
        stepId: kubelet-observes-assignment
        routeIds: [route-kubelet-observe-assignment]
        selectedRouteId: route-kubelet-observe-assignment
