      ja: CoreDNS で Service 名を解決し、その後の別個のアプリケーション要求を Ready バックエンドまで追います。
      zh-CN: 先通过 CoreDNS 解析 Service 名称，再跟踪独立的应用请求到 Ready 后端。
    outcome:
      en: Explain DNS resolution and application traffic as two routes with different semantics and visual styles.
      ja: DNS 解決とアプリケーション通信を、意味と表示形式が異なる二つの経路として説明できます。
      zh-CN: 将 DNS 解析和应用流量解释为语义与视觉样式不同的两条路线。
