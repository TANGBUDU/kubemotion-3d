  - schemaVersion: 1
    id: container-restart-vs-pod-replacement
    priority: P0
    lessonId: container-restart-vs-pod-replacement
    scenarioId: container-restart-golden
    title:
      en: Container restart versus Pod replacement
      ja: Container 再起動と Pod 置換
      zh-CN: 容器重启与 Pod 替换
    summary:
      en: Compare kubelet's local same-Pod restart with an API-mediated Pod deletion and replacement sequence.
      ja: kubelet による同一 Pod 内のローカル再起動と、API を介した Pod の削除・置換を比較します。
      zh-CN: 对比 kubelet 在同一 Pod 内的本地重启，与经 API 完成的 Pod 删除和替换流程。
    outcome:
      en: Use UID, Node assignment, Container ID, and restart count to prove that a Container crash does not replace its Pod.
      ja: UID、Node 割り当て、Container ID、再起動回数を使い、Container 障害が Pod 置換ではないことを証明できます。
      zh-CN: 使用 UID、Node 分配、容器 ID 和重启次数证明容器崩溃不会替换 Pod。
    sourceIds:
      [
        k8s-pods,
        k8s-pod-lifecycle,
        k8s-container-status-api,
        k8s-replicasets,
        k8s-components,
        k8s-api,
      ]
