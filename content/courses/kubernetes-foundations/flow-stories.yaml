    summary:
      en: Separate public DNS from the Browser-to-Gateway-to-Service data path while keeping Gateway API configuration beside the route.
      ja: Public DNS と Browser→Gateway→Service のデータ経路を分け、Gateway API 構成は経路の横に根拠として表示します。
