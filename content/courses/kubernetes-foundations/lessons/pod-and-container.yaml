schemaVersion: 2
id: pod-and-container
scenarioId: container-restart-golden
chapterId: foundations
title:
  en: Pod and Container
  ja: Pod と Container
  zh-CN: Pod 与容器
summary:
  en: Open one Pod shell, inspect its application Container, then reveal a second cooperating Container inside the same scheduling boundary.
  ja: 一つの Pod シェルを開き、アプリケーション Container を確認してから、同じスケジューリング境界内の二つ目の協働 Container を表示します。
  zh-CN: 打开一个 Pod 外壳，查看应用容器，再揭示同一调度边界内协作的第二个容器。
learningOutcome:
  en: Explain that Kubernetes schedules a Pod to a Node and that one Pod can contain one or more runtime Containers created from container images.
  ja: Kubernetes が Pod を Node に配置し、一つの Pod が container image から作られた一つ以上のランタイム Container を含めることを説明する。
  zh-CN: 解释 Kubernetes 将 Pod 调度到 Node，而一个 Pod 可以包含由容器镜像创建的一个或多个运行时容器。
prerequisites: [cluster-overview]
sourceIds:
  - k8s-pods
  - k8s-pod-lifecycle
  - k8s-nodes
  - k8s-container-images
  - k8s-components
verifiedAt: '2026-08-08'
baseView:
  view: placement
  cameraPresetId: placement
  resetEntities: true
  entityRules: []
  relationRules: []
  activeRoutes: []

steps:
  - id: pod-is-the-boundary
    title:
      en: Start with the Pod boundary
      ja: Pod 境界から始める
      zh-CN: 先看 Pod 边界
    learningOutcome:
      en: Locate one assigned Pod as a unit inside a worker Node chassis.
      ja: worker Node シャーシ内に配置された一つの Pod を単位として見つける。
      zh-CN: 在工作 Node 底盘中找到作为一个整体被放置的 Pod。
    narration:
      en: api-7f8d9-a is one Pod assigned to worker-a. This lesson snapshot specifies two Containers in that Pod, but the first view isolates the translucent Pod shell so its scheduling boundary is unmistakable.
      ja: api-7f8d9-a は worker-a に割り当てられた一つの Pod です。この学習スナップショットでは Pod 内に二つの Container が定義されていますが、最初のビューでは半透明の Pod シェルだけを分離し、スケジューリング境界を明確にします。
      zh-CN: api-7f8d9-a 是分配到 worker-a 的一个 Pod。本教学快照为该 Pod 定义了两个容器，但第一幅视图先单独展示半透明 Pod 外壳，让调度边界清晰可辨。
    teaching:
      whatChanged:
        en: The lesson snapshot establishes an application Container and a helper Container inside api-7f8d9-a; the view currently exposes only their shared Pod shell and worker-a.
        ja: 学習スナップショットに api-7f8d9-a 内のアプリケーション Container と補助 Container を用意し、現在のビューでは共有する Pod シェルと worker-a だけを表示しました。
        zh-CN: 教学快照在 api-7f8d9-a 内建立应用容器与辅助容器；当前视图只展示它们共享的 Pod 外壳和 worker-a。
      whyItHappened:
        en: The scheduling boundary must be visible before the runtime pieces inside it are introduced.
        ja: 内部のランタイム要素を紹介する前に、スケジューリング境界を見えるようにするためです。
        zh-CN: 这是为了在介绍内部运行时组件前，先让调度边界可见。
      takeaway:
        en: Kubernetes places the Pod as a unit on a Node.
        ja: Kubernetes は Pod を一つの単位として Node に配置します。
        zh-CN: Kubernetes 以 Pod 为单位将其放置到 Node。
    evidence:
      mode: snapshot
      entityIds:
        - infrastructure:cluster:global:Node:worker-a
        - api-object:namespaced:shop:Pod:api-a-old
    introducesTerms: [pod, node]
    usesTerms: [pod, node]
    sourceIds: [k8s-pods, k8s-nodes]
    worldPatch:
      operations:
        - op: add-entity
          entity:
            id: container-status:shop:Pod:api-a-old:Container:metrics
            category: runtime-status
            kind: Container
            name: metrics
            namespace: shop
            status: running
            data:
              podId: api-object:namespaced:shop:Pod:api-a-old
              name: metrics
              image: registry.example.invalid/shop/metrics:v1
              containerID: containerd://synthetic-metrics-a-old-01
              restartCount: 0
              ready: true
              started: true
              state:
                kind: running
                startedAt: 2026-08-08T00:00:00Z
            title:
              en: metrics Container · api-7f8d9-a
              ja: metrics Container · api-7f8d9-a
              zh-CN: metrics 容器 · api-7f8d9-a
            summary:
              en: A cooperating helper Container declared in the same Pod as the api Container.
              ja: api Container と同じ Pod に定義された協働用の補助 Container です。
              zh-CN: 与 api 容器声明在同一 Pod 中的协作辅助容器。
            sourceIds: [k8s-pods, k8s-container-images]
            visual: { archetype: container, size: sm, group: api-a-old }
        - op: add-relation
          relation:
            id: contains-api-a-old-container-metrics
            type: contains-runtime
            from: api-object:namespaced:shop:Pod:api-a-old
            to: container-status:shop:Pod:api-a-old:Container:metrics
            directed: true
            semantic: composition
            title:
              en: contains helper Container status
              ja: 補助 Container 状態を含む
              zh-CN: 包含辅助容器状态
            sourceIds: [k8s-pods]
    viewPatch:
      view: placement
      cameraPresetId: placement
      resetEntities: true
      entityRules:
        - selector: { byIds: [infrastructure:cluster:global:Node:worker-a] }
          visible: true
          emphasis: normal
          labelMode: full
        - selector: { byIds: [api-object:namespaced:shop:Pod:api-a-old] }
          visible: true
          emphasis: focused
          labelMode: full
          inspectorMode: expanded
      relationRules:
        - byIds: [scheduled-api-a-old]
          visible: true
          emphasis: normal
      activeRoutes: []
    transition:
      cues:
        - type: focus-camera
          entityId: api-object:namespaced:shop:Pod:api-a-old
          durationMs: 600

  - id: application-container
    title:
      en: A Container runs inside the Pod
      ja: Container は Pod の内側で動く
      zh-CN: 容器运行在 Pod 内部
    learningOutcome:
      en: Distinguish a runtime Container from the Pod that contains it.
      ja: ランタイム Container と、それを含む Pod を区別する。
      zh-CN: 区分运行时容器与包含它的 Pod。
    narration:
      en: The api Container is a running instance created from the image registry.example.invalid/shop/api:v1. It has its own Container ID and restart count, while the enclosing Pod has a separate Pod identity.
      ja: api Container は image registry.example.invalid/shop/api:v1 から作成された実行中インスタンスです。固有の Container ID と再起動回数を持ち、外側の Pod は別の Pod ID を持ちます。
      zh-CN: api 容器是由镜像 registry.example.invalid/shop/api:v1 创建的运行实例。它拥有自己的 Container ID 与重启次数，而外层 Pod 则具有独立的 Pod 身份。
    teaching:
      whatChanged:
        en: No Kubernetes state changed; the view opened the Pod shell and revealed only its api runtime Container.
        ja: Kubernetes の状態は変化せず、Pod シェルを開いて api ランタイム Container だけを表示しました。
        zh-CN: Kubernetes 状态没有变化；视图打开 Pod 外壳，只显示其中的 api 运行时容器。
      whyItHappened:
        en: Pod and Container are different lifecycle records even though the Container executes inside the Pod boundary.
        ja: Container は Pod 境界内で実行されますが、Pod と Container は異なるライフサイクル記録だからです。
        zh-CN: 因为容器虽然在 Pod 边界内运行，但 Pod 与容器是不同的生命周期记录。
      takeaway:
        en: An image is the template; a Container is a runtime instance inside a Pod.
        ja: image はテンプレート、Container は Pod 内のランタイムインスタンスです。
        zh-CN: 镜像是模板，容器是 Pod 内部的运行时实例。
    evidence:
      mode: snapshot
      entityIds:
        - api-object:namespaced:shop:Pod:api-a-old
        - container-status:shop:Pod:api-a-old:Container:api
    introducesTerms: [container-image, container]
    usesTerms: [pod, container-image, container]
    sourceIds: [k8s-pods, k8s-pod-lifecycle, k8s-container-images]
    worldPatch: { operations: [] }
    viewPatch:
      view: placement
      cameraPresetId: placement
      resetEntities: true
