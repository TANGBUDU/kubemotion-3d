          emphasis: focused
          labelMode: full
          inspectorMode: expanded
      relationRules:
        - byIds: [contains-api-a-old-container-api]
          visible: true
          emphasis: focused
      activeRoutes: []
    transition:
      cues:
        - type: focus-camera
          entityId: container-status:shop:Pod:api-a-old:Container:api
          durationMs: 600

  - id: two-containers-one-pod
    title:
      en: One Pod can contain multiple Containers
      ja: 一つの Pod は複数の Container を含める
      zh-CN: 一个 Pod 可以包含多个容器
    learningOutcome:
      en: Verify that api and metrics are two Containers inside one Pod identity.
      ja: api と metrics が一つの Pod ID 内にある二つの Container であることを確認する。
      zh-CN: 验证 api 与 metrics 是同一 Pod 身份内部的两个容器。
    narration:
      en: The view now reveals the already-specified metrics helper beside api. Both Container status records point to api-7f8d9-a, and both models remain visibly inside the same Pod shell.
      ja: ビューは、すでに定義済みの metrics 補助 Container を api の隣に表示します。二つの Container 状態はどちらも api-7f8d9-a を参照し、モデルも同じ Pod シェル内にあります。
      zh-CN: 视图现在揭示早已声明的 metrics 辅助容器。两个容器状态都指向 api-7f8d9-a，模型也都清楚位于同一个 Pod 外壳内。
    teaching:
      whatChanged:
        en: No API or runtime fact changed; the second Container became visible beside the first.
        ja: API やランタイムの事実は変化せず、二つ目の Container を一つ目の隣に表示しました。
        zh-CN: API 与运行时事实没有变化；第二个容器现在显示在第一个容器旁边。
      whyItHappened:
        en: The staged reveal makes the one-Pod-to-many-Containers composition readable without implying a live Container injection.
        ja: 段階的な表示により、実行中の Container 追加を示唆せず、一つの Pod と複数 Container の構成を読み取れるためです。
        zh-CN: 分步揭示能清楚表达“一个 Pod 包含多个容器”，同时避免暗示向运行中 Pod 动态注入容器。
      takeaway:
        en: Multiple Containers can cooperate inside one Pod; they are not multiple Pods.
        ja: 複数の Container は一つの Pod 内で協働でき、複数の Pod になるわけではありません。
        zh-CN: 多个容器可以在同一个 Pod 内协作，它们并不是多个 Pod。
    evidence:
      mode: snapshot
      entityIds:
        - api-object:namespaced:shop:Pod:api-a-old
        - container-status:shop:Pod:api-a-old:Container:api
        - container-status:shop:Pod:api-a-old:Container:metrics
    introducesTerms: []
    usesTerms: [pod, container]
    sourceIds: [k8s-pods, k8s-pod-lifecycle]
    worldPatch: { operations: [] }
    viewPatch:
      view: placement
      cameraPresetId: placement
      resetEntities: true
      entityRules:
        - selector: { byIds: [infrastructure:cluster:global:Node:worker-a] }
          visible: true
