  - id: identities-remain-distinct
    title:
      en: One Pod identity, two Container identities
      ja: 一つの Pod ID と二つの Container ID
      zh-CN: 一个 Pod 身份，两个容器身份
    learningOutcome:
      en: Separate the Pod UID from each runtime Container ID.
      ja: Pod UID と各ランタイム Container ID を区別する。
      zh-CN: 区分 Pod UID 与各自的运行时 Container ID。
    narration:
      en: api-7f8d9-a has Pod UID synthetic-uid-old-a1. Inside it, api and metrics have separate Container IDs and status records. Restarting one Container can change its runtime identity without turning the sibling Container into another Pod.
      ja: api-7f8d9-a の Pod UID は synthetic-uid-old-a1 です。その内部で api と metrics は別々の Container ID と状態記録を持ちます。一方の Container が再起動してランタイム ID が変わっても、もう一方が別の Pod になるわけではありません。
      zh-CN: api-7f8d9-a 的 Pod UID 是 synthetic-uid-old-a1。内部的 api 与 metrics 拥有各自的 Container ID 和状态记录。即使某个容器重启并改变运行时身份，也不会让另一个容器变成新的 Pod。
    teaching:
      whatChanged:
        en: No identity changed; the Pod inspector and both Container records were shown together for comparison.
        ja: ID は変化せず、比較のため Pod inspector と二つの Container 記録を同時に表示しました。
        zh-CN: 身份没有变化；视图同时展示 Pod 检查信息与两个容器记录以便比较。
      whyItHappened:
        en: Pod lifecycle and Container runtime lifecycle are related but separately observable facts.
        ja: Pod のライフサイクルと Container のランタイムライフサイクルは関連しますが、別々に観測できる事実だからです。
        zh-CN: 因为 Pod 生命周期与容器运行时生命周期相互关联，但属于可分别观察的事实。
      takeaway:
        en: The Pod is the shared scheduling boundary; each Container still has its own runtime status and identity.
        ja: Pod は共有スケジューリング境界であり、各 Container は固有のランタイム状態と ID を持ちます。
        zh-CN: Pod 是共享的调度边界，而每个容器仍有自己的运行时状态与身份。
    evidence:
      mode: snapshot
      entityIds:
        - api-object:namespaced:shop:Pod:api-a-old
        - container-status:shop:Pod:api-a-old:Container:api
        - container-status:shop:Pod:api-a-old:Container:metrics
