          visible: true
          emphasis: normal
          labelMode: short
        - selector: { byIds: [container-status:shop:Pod:api-a-old:Container:metrics] }
          visible: true
          emphasis: focused
          labelMode: full
          inspectorMode: expanded
      relationRules:
