  - id: containers-share-placement
    title:
      en: The Node receives one Pod, not two Container assignments
      ja: Node が受け取るのは二つの Container 割り当てではなく一つの Pod
      zh-CN: Node 接收的是一个 Pod，而不是两次容器分配
    learningOutcome:
      en: Trace physical placement from worker-a to one Pod and then to both contained Containers.
      ja: worker-a から一つの Pod、さらに内部の二つの Container へ物理配置をたどる。
      zh-CN: 沿物理放置关系从 worker-a 追踪到一个 Pod，再到其内部两个容器。
    narration:
      en: The Scheduler assigned api-7f8d9-a to worker-a. The api and metrics Containers follow that one Pod placement; Kubernetes did not schedule each Container independently to a different Node.
      ja: Scheduler は api-7f8d9-a を worker-a に割り当てました。api と metrics の Container はその一つの Pod 配置に従い、それぞれ別の Node へ独立にスケジュールされたのではありません。
      zh-CN: Scheduler 将 api-7f8d9-a 分配到 worker-a。api 与 metrics 容器共同遵循这一次 Pod 放置；Kubernetes 并没有把每个容器独立调度到不同 Node。
    teaching:
      whatChanged:
        en: No placement changed; worker-a and the scheduled-on relationship became visible around the same two-Container Pod.
        ja: 配置は変化せず、同じ二 Container Pod の周囲に worker-a と scheduled-on 関係を表示しました。
        zh-CN: 放置事实没有变化；视图在同一个双容器 Pod 周围显示 worker-a 与 scheduled-on 关系。
      whyItHappened:
        en: Scheduling operates on Pods, so all regular Containers in a Pod share its Node assignment.
        ja: スケジューリングは Pod を単位とするため、Pod 内の通常 Container はその Node 割り当てを共有します。
        zh-CN: 因为调度以 Pod 为单位，所以 Pod 中的常规容器共享该 Pod 的 Node 分配。
      takeaway:
        en: Node placement belongs to the Pod; contained Containers inherit that execution location.
        ja: Node 配置は Pod に属し、内部 Container はその実行場所を共有します。
        zh-CN: Node 放置属于 Pod，内部容器共同继承该执行位置。
    evidence:
      mode: snapshot
      entityIds:
        - infrastructure:cluster:global:Node:worker-a
        - api-object:namespaced:shop:Pod:api-a-old
        - container-status:shop:Pod:api-a-old:Container:api
        - container-status:shop:Pod:api-a-old:Container:metrics
    introducesTerms: []
    usesTerms: [node, pod, container]
    sourceIds: [k8s-pods, k8s-nodes]
    worldPatch: { operations: [] }
