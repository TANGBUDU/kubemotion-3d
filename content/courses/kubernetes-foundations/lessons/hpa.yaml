  - id: kubelet-starts-container
    title:
      en: kubelet and the runtime start the container
      ja: kubelet と runtime がコンテナを起動する
      zh-CN: kubelet 与运行时启动容器
    learningOutcome:
      en: Locate container startup on the selected Node rather than in the HPA control loop.
      ja: コンテナ起動が HPA control loop ではなく選択された Node 上で行われることを確認する。
      zh-CN: 确认容器启动发生在选定 Node 上，而非 HPA 控制循环中。
    narration:
      en: kubelet observes the assignment through the API and asks the local container runtime to start api-c's container. A new container ID appears, but readiness is still false.
      ja: kubelet は API 経由で割り当てを確認し、local container runtime に api-c のコンテナ起動を依頼します。新しい container ID が現れますが、readiness はまだ false です。
      zh-CN: kubelet 通过 API 观察到分配，并要求本地容器运行时启动 api-c 的容器。新的容器 ID 出现，但就绪仍为 false。
    teaching:
      whatChanged:
        en: The container moved from waiting to running with a first container ID; the Pod phase became Running but Ready stayed false.
        ja: コンテナは waiting から running になり最初の container ID を得ました。Pod phase は Running ですが Ready は false のままです。
        zh-CN: 容器由 waiting 变为 running 并获得首个容器 ID；Pod 阶段变为 Running，但 Ready 仍为 false。
      whyItHappened:
        en: kubelet owns Node-local Pod execution and uses the CRI-backed runtime after the binding is visible.
        ja: kubelet は Node-local な Pod 実行を担当し、binding を確認した後に CRI 対応 runtime を使います。
        zh-CN: kubelet 负责节点本地的 Pod 执行，并在绑定可见后调用支持 CRI 的运行时。
      takeaway:
        en: The node-runtime route is separate from the earlier HPA, controller, and scheduling routes.
        ja: node-runtime route は、それ以前の HPA、controller、scheduling route とは別です。
        zh-CN: 节点运行时路线独立于此前的 HPA、控制器和调度路线。
    evidence:
      entityIds:
        - runtime-component:cluster:global:KubeAPIServer:kube-apiserver
        - runtime-component:node:worker-scale:Kubelet:kubelet
        - runtime-component:node:worker-scale:ContainerRuntime:containerd
        - api-object:namespaced:shop:Pod:api-c
        - container-status:shop:Pod:api-c:Container:api
      mode: diff-with-context
    introducesTerms: [container, cri]
    usesTerms: [pod, binding]
    sourceIds: [k8s-components, k8s-cri, k8s-pod-lifecycle, k8s-container-status-api]
    worldPatch:
      operations:
        - op: patch-entity
          entityId: api-object:namespaced:shop:Pod:api-c
          patch:
            status: not-ready
            data:
              phase: Running
              podIP: 192.0.2.43
              syntheticAddress: true
              conditions:
                { podScheduled: true, initialized: true, containersReady: false, ready: false }
        - op: patch-entity
          entityId: container-status:shop:Pod:api-c:Container:api
          patch:
            status: running
            data:
              containerID: containerd://synthetic-api-scale-c-01
              ready: false
              started: true
              state: { kind: running, startedAt: '2026-08-08T00:04:00Z' }
    viewPatch:
      view: control-flow
      cameraPresetId: control-flow
      resetEntities: true
      entityRules:
        - selector:
            byIds:
              - runtime-component:cluster:global:KubeAPIServer:kube-apiserver
              - infrastructure:cluster:global:Node:worker-scale
              - runtime-component:node:worker-scale:Kubelet:kubelet
              - runtime-component:node:worker-scale:ContainerRuntime:containerd
              - api-object:namespaced:shop:Pod:api-c
              - container-status:shop:Pod:api-c:Container:api
          visible: true
          emphasis: normal
          labelMode: full
        - selector: { byIds: [container-status:shop:Pod:api-c:Container:api] }
          emphasis: focused
          inspectorMode: expanded
      relationRules:
        - byType: scheduled-on
          visible: true
          emphasis: dimmed
        - byType: contains-runtime
          visible: true
          emphasis: normal
        - byType: implemented-by
          visible: true
          emphasis: dimmed
      activeRoutes:
        - id: route-api-kubelet-watch
          semantic: control
          label: { en: observe assigned Pod, ja: assigned Pod を監視, zh-CN: 观察已分配 Pod }
          persistAfterAnimation: true
          numbered: true
          hops:
            - fromEntityId: runtime-component:cluster:global:KubeAPIServer:kube-apiserver
              fromAnchor: api-out
              toEntityId: runtime-component:node:worker-scale:Kubelet:kubelet
              toAnchor: api-in
        - id: route-kubelet-runtime-start
          semantic: node-runtime
          label:
            { en: start through local runtime, ja: local runtime で起動, zh-CN: 通过本地运行时启动 }
          persistAfterAnimation: true
          numbered: true
          hops:
            - fromEntityId: runtime-component:node:worker-scale:Kubelet:kubelet
              fromAnchor: local-runtime
              toEntityId: runtime-component:node:worker-scale:ContainerRuntime:containerd
              toAnchor: local-runtime
              label: { en: CRI request, ja: CRI request, zh-CN: CRI 请求 }
            - fromEntityId: runtime-component:node:worker-scale:ContainerRuntime:containerd
              fromAnchor: local-runtime
              toEntityId: container-status:shop:Pod:api-c:Container:api
              toAnchor: local-runtime
              label: { en: create runtime identity, ja: runtime ID を作成, zh-CN: 创建运行时身份 }
    transition:
      cues:
        - type: api-request
          routeId: route-api-kubelet-watch
          label: { en: watch assignment, ja: assignment を watch, zh-CN: 观察分配 }
          durationMs: 1000
        - type: container-start
          entityId: container-status:shop:Pod:api-c:Container:api
          durationMs: 1200

  - id: pod-becomes-ready
    title:
      { en: The new Pod becomes Ready, ja: 新しい Pod が Ready になる, zh-CN: 新 Pod 变为 Ready }
    learningOutcome:
      en: Use Pod conditions and controller counters to distinguish running from traffic readiness.
      ja: Pod condition と controller counter を使い、running と traffic readiness を区別する。
      zh-CN: 使用 Pod 条件和控制器计数区分运行中与可接收流量。
    narration:
      en: The container reports ready, the Pod Ready condition turns true, and kubelet reports status through the API Server. ReplicaSet and Deployment ready counts reach three, but EndpointSlice still lists only two backends until its controller reconciles.
      ja: コンテナが ready を報告し、Pod Ready condition が true になり、kubelet が API Server 経由で status を報告します。ReplicaSet と Deployment の ready 数は 3 になりますが、EndpointSlice controller の調整までは backend は 2 つのままです。
      zh-CN: 容器上报 ready，Pod Ready 条件变为 true，kubelet 通过 API Server 上报状态。ReplicaSet 与 Deployment 的 ready 数达到 3，但在 EndpointSlice 控制器协调前，后端列表仍只有两个。
    teaching:
      whatChanged:
        en: api-c and its container became Ready; ReplicaSet readyReplicas and Deployment ready/available replicas changed from 2 to 3.
        ja: api-c とそのコンテナが Ready になり、ReplicaSet readyReplicas と Deployment ready/available replicas が 2 から 3 に変わりました。
        zh-CN: api-c 及其容器变为 Ready；ReplicaSet readyReplicas 与 Deployment ready/available 副本由 2 变为 3。
      whyItHappened:
        en: Successful readiness evidence is reported as Pod status and then reflected by workload controller status.
        ja: 成功した readiness の証拠が Pod status として報告され、workload controller status に反映されるためです。
        zh-CN: 成功的就绪证据作为 Pod 状态上报，随后反映到工作负载控制器状态中。
      takeaway:
        en: A running container is not automatically a Ready Service backend; readiness and endpoint membership are distinct facts.
        ja: running コンテナが自動的に Ready Service backend になるわけではなく、readiness と endpoint membership は別の事実です。
        zh-CN: 运行中的容器不会自动成为 Ready Service 后端；就绪与 Endpoint 成员关系是不同事实。
    evidence:
      entityIds:
        - runtime-component:node:worker-scale:Kubelet:kubelet
        - runtime-component:cluster:global:KubeAPIServer:kube-apiserver
        - api-object:namespaced:shop:Pod:api-c
        - container-status:shop:Pod:api-c:Container:api
        - api-object:namespaced:shop:ReplicaSet:api-rs
        - api-object:namespaced:shop:Deployment:api
        - api-object:namespaced:shop:EndpointSlice:api-slice
      mode: diff-with-context
    introducesTerms: []
    usesTerms: [pod, container, replicaset, deployment]
    sourceIds: [k8s-pod-conditions, k8s-pods, k8s-replicasets, k8s-deployments]
    worldPatch:
      operations:
        - op: patch-entity
          entityId: container-status:shop:Pod:api-c:Container:api
          patch: { data: { ready: true } }
        - op: patch-entity
          entityId: api-object:namespaced:shop:Pod:api-c
          patch:
            status: ready
            data:
              conditions:
                { podScheduled: true, initialized: true, containersReady: true, ready: true }
        - op: patch-entity
          entityId: api-object:namespaced:shop:ReplicaSet:api-rs
          patch: { status: ready, data: { readyReplicas: 3 } }
        - op: patch-entity
          entityId: api-object:namespaced:shop:Deployment:api
          patch:
            { status: ready, data: { readyReplicas: 3, availableReplicas: 3, updatedReplicas: 3 } }
    viewPatch:
      view: control-flow
      cameraPresetId: control-flow
      resetEntities: true
      entityRules:
        - selector:
            byIds:
              - infrastructure:cluster:global:Node:worker-scale
              - runtime-component:node:worker-scale:Kubelet:kubelet
              - runtime-component:cluster:global:KubeAPIServer:kube-apiserver
              - api-object:namespaced:shop:Pod:api-c
              - container-status:shop:Pod:api-c:Container:api
              - api-object:namespaced:shop:ReplicaSet:api-rs
              - api-object:namespaced:shop:Deployment:api
              - api-object:namespaced:shop:EndpointSlice:api-slice
          visible: true
          emphasis: normal
          labelMode: short
        - selector: { byIds: [api-object:namespaced:shop:Pod:api-c] }
          emphasis: focused
          labelMode: full
          inspectorMode: expanded
      relationRules:
        - byType: owns
          visible: true
          emphasis: dimmed
        - byType: contains-runtime
          visible: true
          emphasis: dimmed
      activeRoutes:
        - id: route-kubelet-api-ready
          semantic: control
          label: { en: report Ready=true, ja: Ready=true を報告, zh-CN: 上报 Ready=true }
          persistAfterAnimation: true
          numbered: true
          hops:
            - fromEntityId: runtime-component:node:worker-scale:Kubelet:kubelet
              fromAnchor: api-out
              toEntityId: runtime-component:cluster:global:KubeAPIServer:kube-apiserver
              toAnchor: api-in
    transition:
      cues:
        - type: api-request
          routeId: route-kubelet-api-ready
          label: { en: Pod status update, ja: Pod status update, zh-CN: Pod 状态更新 }
          durationMs: 1100
        - type: counter-change
          entityId: api-object:namespaced:shop:ReplicaSet:api-rs
          field: data.readyReplicas
          from: 2
          to: 3
          durationMs: 550
        - type: counter-change
          entityId: api-object:namespaced:shop:Deployment:api
          field: data.readyReplicas
          from: 2
          to: 3
          durationMs: 550

  - id: endpointslice-adds-backend
    title:
      en: EndpointSlice gains the Ready backend
      ja: EndpointSlice に Ready backend が加わる
      zh-CN: EndpointSlice 加入 Ready 后端
    learningOutcome:
      en: Connect readiness to endpoint membership without treating EndpointSlice as a packet hop.
      ja: EndpointSlice を packet hop とせず、readiness と endpoint membership を結び付ける。
      zh-CN: 将就绪与 Endpoint 成员关系关联起来，同时不把 EndpointSlice 当作数据包 Hop。
    narration:
      en: The EndpointSlice controller observes api-c as Ready and adds address 192.0.2.43. The Service selector now matches three Ready Pods. This is control-plane configuration evidence; no application packet travels through the EndpointSlice object.
      ja: EndpointSlice controller が api-c の Ready を確認し、address 192.0.2.43 を追加します。Service selector は 3 つの Ready Pod に一致します。これは control-plane の設定証拠であり、application packet が EndpointSlice object を通過するわけではありません。
      zh-CN: EndpointSlice 控制器观察到 api-c Ready，并添加地址 192.0.2.43。Service Selector 现匹配三个 Ready Pod。这是控制面配置证据；应用数据包不会经过 EndpointSlice 对象。
    teaching:
      whatChanged:
        en: api-c was added to the Service selection relations and EndpointSlice endpoint rows with ready=true and serving=true.
        ja: api-c が Service selection relation と EndpointSlice endpoint row に ready=true、serving=true で追加されました。
        zh-CN: api-c 以 ready=true、serving=true 加入 Service 选择关系与 EndpointSlice Endpoint 行。
      whyItHappened:
        en: The EndpointSlice controller reconciles matching Ready Pods into the Service backend inventory.
        ja: EndpointSlice controller が selector に一致する Ready Pod を Service backend inventory に反映するためです。
        zh-CN: EndpointSlice 控制器把匹配且 Ready 的 Pod 协调进 Service 后端清单。
      takeaway:
        en: EndpointSlice records eligible backends; it supports route selection but is not on the physical application route.
        ja: EndpointSlice は利用可能 backend を記録し route 選択を支えますが、物理 application route 上にはありません。
        zh-CN: EndpointSlice 记录可用后端并支持路线选择，但不位于实际应用流量路径上。
    evidence:
      entityIds:
        - runtime-component:cluster:global:ControllerManager:kube-controller-manager
        - runtime-component:cluster:global:KubeAPIServer:kube-apiserver
        - api-object:namespaced:shop:Service:api
        - api-object:namespaced:shop:EndpointSlice:api-slice
        - api-object:namespaced:shop:Pod:api-c
      mode: diff-with-context
    introducesTerms: [service, endpoint-slice, endpoint]
    usesTerms: [pod]
    sourceIds: [k8s-services, k8s-endpoint-slices, k8s-labels, k8s-pod-conditions]
    worldPatch:
      operations:
        - op: patch-entity
          entityId: api-object:namespaced:shop:EndpointSlice:api-slice
          patch:
            data:
              endpoints:
                - address: 192.0.2.41
                  targetRef: api-object:namespaced:shop:Pod:api-a
                  conditions: { ready: true, serving: true, terminating: false }
                - address: 192.0.2.42
                  targetRef: api-object:namespaced:shop:Pod:api-b
                  conditions: { ready: true, serving: true, terminating: false }
                - address: 192.0.2.43
                  targetRef: api-object:namespaced:shop:Pod:api-c
                  conditions: { ready: true, serving: true, terminating: false }
        - op: add-relation
          relation:
            id: service-selects-api-c
            type: selects
            from: api-object:namespaced:shop:Service:api
            to: api-object:namespaced:shop:Pod:api-c
            directed: true
            semantic: selection
            title:
              {
                en: selector matches api-c,
                ja: selector が api-c に一致,
                zh-CN: Selector 匹配 api-c,
              }
            sourceIds: [k8s-services, k8s-labels]
        - op: add-relation
          relation:
            id: api-slice-references-api-c
            type: references
            from: api-object:namespaced:shop:EndpointSlice:api-slice
            to: api-object:namespaced:shop:Pod:api-c
            directed: true
            semantic: endpoint-membership
            title:
              { en: Ready api-c endpoint, ja: Ready api-c endpoint, zh-CN: Ready api-c Endpoint }
            sourceIds: [k8s-endpoint-slices]
            data: { address: 192.0.2.43, ready: true, serving: true, terminating: false }
    viewPatch:
      view: control-flow
      cameraPresetId: control-flow
      resetEntities: true
      entityRules:
        - selector:
            byIds:
              - runtime-component:cluster:global:ControllerManager:kube-controller-manager
              - runtime-component:cluster:global:KubeAPIServer:kube-apiserver
              - api-object:namespaced:shop:EndpointSlice:api-slice
              - infrastructure:cluster:global:Node:worker-scale
              - api-object:namespaced:shop:Pod:api-c
          visible: true
          emphasis: normal
          labelMode: short
        - selector: { byIds: [api-object:namespaced:shop:EndpointSlice:api-slice] }
          emphasis: focused
          labelMode: full
          inspectorMode: expanded
      relationRules:
        - byType: references
          visible: true
          emphasis: normal
      activeRoutes:
        - id: route-controller-api-endpoints
          semantic: control
          label:
            { en: publish Ready endpoint, ja: Ready endpoint を公開, zh-CN: 发布 Ready Endpoint }
          persistAfterAnimation: true
          numbered: true
          hops:
            - fromEntityId: runtime-component:cluster:global:ControllerManager:kube-controller-manager
              fromAnchor: api-out
              toEntityId: runtime-component:cluster:global:KubeAPIServer:kube-apiserver
              toAnchor: api-in
            - fromEntityId: runtime-component:cluster:global:KubeAPIServer:kube-apiserver
              fromAnchor: api-out
              toEntityId: api-object:namespaced:shop:EndpointSlice:api-slice
              toAnchor: api-in
              label: { en: add 192.0.2.43, ja: 192.0.2.43 を追加, zh-CN: 添加 192.0.2.43 }
    transition:
      cues:
        - type: reconcile-pulse
          fromEntityId: runtime-component:cluster:global:ControllerManager:kube-controller-manager
          toEntityId: api-object:namespaced:shop:EndpointSlice:api-slice
          routeId: route-controller-api-endpoints
          durationMs: 1200
        - type: relation-reveal
          relationId: api-slice-references-api-c
          durationMs: 650

  - id: traffic-fan-out-expands
    title:
      en: Capacity expands, one request chooses one backend
      ja: 容量は増えるが 1 request は 1 backend を選ぶ
      zh-CN: 容量扩展，但单个请求只选一个后端
    learningOutcome:
      en: Distinguish a larger eligible backend set from broadcasting one request to every Pod.
      ja: 利用可能 backend 集合の拡大と、1 request を全 Pod に broadcast することを区別する。
      zh-CN: 区分可用后端集合扩大与把单个请求广播给所有 Pod。
    narration:
      en: EndpointSlice now exposes three Ready candidates, so future requests can be distributed across more capacity. This synthetic request enters the stable Service and selects api-c only. The route remains visible after the token stops and never passes through the EndpointSlice object.
      ja: EndpointSlice は 3 つの Ready candidate を公開し、今後の request をより大きな容量へ分散できます。この合成 request は安定した Service に入り api-c だけを選びます。token 停止後も route は残り、EndpointSlice object を通過しません。
      zh-CN: EndpointSlice 现公开三个 Ready 候选，后续请求可分布到更大的容量。这个虚构请求进入稳定 Service 后仅选择 api-c。令牌停止后路线仍保留，且绝不经过 EndpointSlice 对象。
    teaching:
      whatChanged:
        en: No world fact changed; the traffic view exposes the three-entry backend inventory and one persistent client → Service → api-c request route.
        ja: world fact は変わりません。traffic view は 3 entry の backend inventory と、client → Service → api-c の 1 本の持続 request route を表示します。
        zh-CN: 世界事实未变化；流量视图展示三个后端条目的清单，以及一条持久的客户端 → Service → api-c 请求路线。
      whyItHappened:
        en: Adding a Ready endpoint increases the set from which each new request may select; it does not duplicate a single request to all endpoints.
        ja: Ready endpoint の追加は各新規 request が選べる集合を増やしますが、1 request を全 endpoint に複製しません。
        zh-CN: 新增 Ready Endpoint 扩大每个新请求可选择的集合，但不会把一个请求复制给全部 Endpoint。
      takeaway:
        en: HPA expands potential fan-out capacity through reconciliation; ordinary Service routing still selects one backend for this request.
        ja: HPA は reconciliation を通じて潜在的な fan-out 容量を増やしますが、通常の Service routing はこの request に 1 backend を選びます。
        zh-CN: HPA 通过协调扩展潜在分流容量；普通 Service 路由对本次请求仍只选择一个后端。
    evidence:
      entityIds:
        - api-object:namespaced:shop:Pod:load-client
        - api-object:namespaced:shop:Service:api
        - api-object:namespaced:shop:EndpointSlice:api-slice
        - api-object:namespaced:shop:Pod:api-a
        - api-object:namespaced:shop:Pod:api-b
        - api-object:namespaced:shop:Pod:api-c
      mode: snapshot
    introducesTerms: []
    usesTerms: [service, endpoint-slice, endpoint, pod]
    sourceIds: [k8s-hpa, k8s-services, k8s-endpoint-slices]
    viewPatch:
      view: traffic
      cameraPresetId: traffic
      resetEntities: true
      entityRules:
