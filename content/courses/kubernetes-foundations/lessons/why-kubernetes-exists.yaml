  - id: replacement-becomes-ready
    title:
      en: The replacement becomes Ready
      ja: 置換 Pod が Ready になる
      zh-CN: 替换 Pod 变为 Ready
    learningOutcome:
      en: Verify that observed and ready counts return to the declared target only after placement and startup.
      ja: 配置と起動の後に初めて observed 数と ready 数が宣言目標へ戻ることを確認する。
      zh-CN: 验证只有完成放置与启动后，observed 和 ready 计数才都恢复到声明目标。
    narration:
      en: api-7f8d9-d is assigned to worker-c, its api Container starts, and the Pod becomes Ready. ReplicaSet SPEC, OBSERVED, and READY now all read 3 again, using a new Pod identity to satisfy the original target.
      ja: api-7f8d9-d は worker-c に割り当てられ、api Container が起動して Pod は Ready になります。ReplicaSet の SPEC、OBSERVED、READY は再びすべて 3 となり、新しい Pod ID で元の目標を満たします。
      zh-CN: api-7f8d9-d 被分配到 worker-c，api 容器启动，Pod 变为 Ready。ReplicaSet 的 SPEC、OBSERVED 与 READY 再次全部为 3，并以新的 Pod 身份满足原始目标。
    teaching:
      whatChanged:
        en: The replacement gained nodeName worker-c, its Container entered running state, Pod readiness became true, and ReplicaSet READY rose from 2 to 3.
        ja: 置換 Pod に nodeName worker-c が設定され、Container が running、Pod が Ready となり、ReplicaSet READY は 2 から 3 に増えました。
        zh-CN: 替换 Pod 获得 nodeName worker-c，容器进入 running，Pod 变为 Ready，ReplicaSet READY 从 2 升至 3。
      whyItHappened:
        en: Scheduling selected a Node, and that Node's runtime started the Container successfully.
        ja: スケジューリングが Node を選び、その Node のランタイムが Container を正常に起動したためです。
        zh-CN: 因为调度选择了 Node，并由该 Node 的运行时成功启动容器。
      takeaway:
        en: Kubernetes preserved the declared service capacity by replacing identity, not by making failures impossible.
        ja: Kubernetes は障害を不可能にするのではなく、ID を置換して宣言された処理能力を保ちます。
        zh-CN: Kubernetes 不是让故障永不发生，而是通过替换身份来维持声明的服务能力。
