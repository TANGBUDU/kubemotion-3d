  - id: scheduler-records-worker-c
    title:
      en: Scheduler records worker-c as the chosen Node
      ja: Scheduler が worker-c を選び、Pod に記録する
      zh-CN: Scheduler 选择 worker-c，并把结果写入 Pod
    learningOutcome:
      en: Separate the Scheduler decision from the later act of starting the application.
      ja: Scheduler の判断と、その後のアプリ起動を分けて理解する。
      zh-CN: 区分 Scheduler 的放置决定与后续真正启动应用。
    narration:
      en: The replacement Pod exists but has no machine. Scheduler evaluates the available Nodes, chooses worker-c, and records that choice through the API Server. This changes the Pod object; it still does not start a Container.
      ja: 置換 Pod は存在しますが、まだ実行先がありません。Scheduler は利用可能な Node を評価し、worker-c を選び、その結果を API Server 経由で Pod に記録します。Pod オブジェクトは変わりますが、Container はまだ起動しません。
      zh-CN: 替换 Pod 已经存在，但还没有运行机器。Scheduler 会评估可用 Node，选择 worker-c，再通过 API Server 把结果写进 Pod 对象。这一步只改变放置信息，还没有启动 Container。
    teaching:
      whatChanged:
        en: The Pod now records nodeName=worker-c; its Container is still waiting and Ready is still false.
        ja: Pod に nodeName=worker-c が記録されますが、Container は waiting、Ready は false のままです。
        zh-CN: Pod 现在记录了 nodeName=worker-c，但 Container 仍在等待，Ready 仍然是 false。
      whyItHappened:
        en: Scheduling is an API decision that records where the Pod should run.
        ja: scheduling は Pod の実行先を記録する API 上の判断だからです。
        zh-CN: 因为调度本质上是一个通过 API 记录“Pod 应该放在哪里”的决定。
      takeaway:
        en: Scheduler chooses and records the Node; it does not start the application.
        ja: Scheduler は Node を選んで記録しますが、アプリは起動しません。
        zh-CN: Scheduler 负责选择并记录 Node，不负责启动应用。
    evidence:
      mode: diff-with-context
      entityIds:
        - runtime-component:cluster:global:Scheduler:kube-scheduler
        - runtime-component:cluster:global:KubeAPIServer:kube-apiserver
        - api-object:namespaced:shop:Pod:api-d-new
    introducesTerms:
      - scheduler
      - node
    usesTerms:
      - scheduler
      - node
      - desired-state
      - pod
      - controller
      - pending
    sourceIds:
      - k8s-components
      - k8s-nodes
      - k8s-pods
      - k8s-api
    worldPatch:
      operations:
        - op: patch-entity
          entityId: api-object:namespaced:shop:Pod:api-d-new
          patch:
            data:
              nodeName: worker-c
              phase: Pending
              conditions:
                podScheduled: true
                initialized: true
                containersReady: false
                ready: false
        - op: add-relation
          relation:
            id: scheduled-api-d-new
            type: scheduled-on
            from: api-object:namespaced:shop:Pod:api-d-new
            to: infrastructure:cluster:global:Node:worker-c
            directed: true
            semantic: placement
            title:
              en: scheduled on
              ja: 配置先
              zh-CN: 调度到
            sourceIds:
              - k8s-nodes
              - k8s-pods
    viewPatch:
      view: control-flow
      cameraPresetId: control-flow
      resetEntities: true
      entityRules:
        - selector:
            byIds:
              - runtime-component:cluster:global:Scheduler:kube-scheduler
          visible: true
          emphasis: focused
          labelMode: full
          inspectorMode: expanded
        - selector:
            byIds:
              - runtime-component:cluster:global:KubeAPIServer:kube-apiserver
              - api-object:namespaced:shop:Pod:api-d-new
          visible: true
          emphasis: normal
          labelMode: full
      relationRules: []
      activeRoutes:
        - id: route-scheduler-records-worker-c
          semantic: control
          label:
            en: record worker-c on the Pending Pod
            ja: Pending Pod に worker-c を記録
            zh-CN: 把 worker-c 记录到 Pending Pod
          persistAfterAnimation: true
          numbered: true
          hops:
            - fromEntityId: runtime-component:cluster:global:Scheduler:kube-scheduler
              fromAnchor: api-out
              toEntityId: runtime-component:cluster:global:KubeAPIServer:kube-apiserver
              toAnchor: api-in
              label:
                en: submit the selected Node
                ja: 選択した Node を送信
                zh-CN: 提交所选 Node
            - fromEntityId: runtime-component:cluster:global:KubeAPIServer:kube-apiserver
              fromAnchor: api-out
              toEntityId: api-object:namespaced:shop:Pod:api-d-new
              toAnchor: api-in
              label:
                en: write nodeName=worker-c
                ja: nodeName=worker-c を記録
                zh-CN: 写入 nodeName=worker-c
    transition:
      cues:
        - type: api-request
          routeId: route-scheduler-records-worker-c
          label:
            en: record the selected Node
            ja: 選択した Node を記録
            zh-CN: 记录所选 Node
          durationMs: 760

  - id: binding-places-pod-on-worker-c
    title:
      en: The binding places the Pod on worker-c
      ja: binding により Pod が worker-c に置かれる
      zh-CN: 绑定结果让 Pod 落到 worker-c 上
    learningOutcome:
      en: Read Node placement separately from Container startup.
      ja: Node 配置と Container 起動を分けて読み取る。
      zh-CN: 把 Node 放置与 Container 启动作为两个不同事实来理解。
    narration:
      en: nodeName=worker-c means this Pod now belongs in worker-c's Pod bay. The Container is still waiting and has no runtime identity. Placement is complete; startup is not.
      ja: nodeName=worker-c は、この Pod が worker-c の Pod bay に属することを意味します。Container はまだ waiting で runtime identity もありません。配置は完了しましたが、起動はまだです。
      zh-CN: nodeName=worker-c 表示这个 Pod 已被放进 worker-c 的 Pod 槽位。Container 仍在等待，也还没有运行时身份。放置已经完成，启动还没有。
    teaching:
      whatChanged:
        en: The view now shows the already-recorded Pod-to-Node placement; no Container has started.
        ja: 記録済みの Pod-to-Node 配置を表示しますが、Container はまだ起動していません。
        zh-CN: 这一幕把已记录的 Pod 到 Node 放置关系画出来；Container 仍未启动。
      whyItHappened:
        en: A binding tells kubelet which Node owns the next execution step.
        ja: binding によって、次の実行を担当する Node の kubelet が決まります。
        zh-CN: 绑定结果明确了下一步由哪台 Node 上的 kubelet 负责执行。
      takeaway:
        en: nodeName proves placement; a running Container is a later fact.
        ja: nodeName は配置を示し、running Container はその後の別の事実です。
        zh-CN: nodeName 证明放置完成；Container 是否运行是后面的另一件事。
    evidence:
      mode: snapshot
      entityIds:
        - infrastructure:cluster:global:Node:worker-c
        - api-object:namespaced:shop:Pod:api-d-new
        - container-status:shop:Pod:api-d-new:Container:api
    introducesTerms:
