  - id: replacement-becomes-ready
    title:
      en: Recovery finishes only when the new copy is Ready
      ja: 新しいコピーが Ready になって初めて復旧完了
      zh-CN: 新副本变成 Ready，恢复才算完成
    learningOutcome:
      en: Separate “a replacement object exists” from “service capacity is healthy
        again.”
      ja: 「置換オブジェクトが存在する」と「サービス能力が回復した」を区別する。
      zh-CN: 区分“替换对象已经创建”和“服务能力已经恢复”两件事。
    narration:
      en: Creating the replacement Pod is only the beginning. It must be assigned to a
        Node, its container must start, and the Pod must become Ready. Only then
        do all three counts return to 3. Kubernetes did not prevent failure; it
        detected the gap and repaired it.
      ja: 置換 Pod を作るだけでは終わりません。Node に割り当てられ、コンテナが起動し、Pod が Ready
        になる必要があります。そこで初めて3つの数がすべて3へ戻ります。Kubernetes は障害を防いだのではなく、差を検出して修復しました。
      zh-CN:
        创建替换 Pod 只是开始。它还要被分配到某个 Node，容器要真正启动，Pod 还要变成 Ready。直到这时，三个计数才重新全部回到
        3。Kubernetes 不是让故障永远不发生，而是发现缺口并把它修回来。
    teaching:
      whatChanged:
        en: The replacement is placed, its container starts, and Ready replicas rise
          from 2 back to 3.
        ja: 置換 Pod が配置され、コンテナが起動し、Ready replicas が 2→3 に戻ります。
        zh-CN: 替换 Pod 被放置、容器启动，Ready 副本从 2 回到 3。
      whyItHappened:
        en: A replacement counts as healthy capacity only after scheduling and startup
          succeed.
        ja: 置換は scheduling と起動が成功して初めて正常な処理能力として数えられるからです。
        zh-CN: 因为替换副本只有在调度和启动成功之后，才能真正算作健康的服务能力。
      takeaway:
        en: Why Kubernetes? You declare the result; Kubernetes keeps working until
          reality matches it again.
        ja: なぜ Kubernetes？ 結果を宣言すると、現実が再び一致するまで Kubernetes が働き続けるからです。
        zh-CN: 为什么需要 Kubernetes？你声明想要的结果，它会持续工作，直到现实再次与目标一致。
