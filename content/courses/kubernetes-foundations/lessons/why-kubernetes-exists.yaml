    usesTerms:
      - binding
      - scheduler
      - node
      - pod
      - container
      - pending
    sourceIds:
      - k8s-components
      - k8s-nodes
      - k8s-pods
      - k8s-pod-lifecycle
    worldPatch:
      operations: []
    viewPatch:
      view: placement
      cameraPresetId: placement
      resetEntities: true
      entityRules:
        - selector:
            byIds:
              - infrastructure:cluster:global:Node:worker-c
          visible: true
          emphasis: normal
          labelMode: full
        - selector:
            byIds:
              - api-object:namespaced:shop:Pod:api-d-new
          visible: true
          emphasis: focused
          labelMode: full
          inspectorMode: expanded
        - selector:
            byIds:
              - container-status:shop:Pod:api-d-new:Container:api
          visible: true
          emphasis: normal
          labelMode: full
      relationRules: []
      activeRoutes:
        - id: route-pod-placed-on-worker-c
          semantic: scheduling
          label:
            en: this Pod is assigned to worker-c
            ja: この Pod は worker-c に配置される
            zh-CN: 这个 Pod 已分配到 worker-c
          persistAfterAnimation: true
          numbered: false
          hops:
            - fromEntityId: api-object:namespaced:shop:Pod:api-d-new
              fromAnchor: placement
              toEntityId: infrastructure:cluster:global:Node:worker-c
              toAnchor: placement
              label:
                en: placed on worker-c
                ja: worker-c に配置
                zh-CN: 放置到 worker-c
    transition:
      cues:
        - type: layout-transition
          entityIds:
            - api-object:namespaced:shop:Pod:api-d-new
          durationMs: 680

  - id: kubelet-starts-replacement
    title:
      en: kubelet and the runtime start the Container
      ja: kubelet と runtime が Container を起動する
      zh-CN: kubelet 与容器运行时启动 Container
    learningOutcome:
      en: Identify the Node-local components that turn an assigned Pod into a running process.
      ja: 割り当て済み Pod を実行中 process に変える Node 内コンポーネントを識別する。
      zh-CN: 识别把已分配 Pod 变成实际进程的 Node 本地组件。
    narration:
      en: worker-c's kubelet notices the assigned Pod. It asks the container runtime to create the Container from the image. The process is now running, but readiness has not passed yet.
      ja: worker-c の kubelet が割り当て済み Pod を確認し、container runtime に image から Container を作るよう依頼します。process は起動しましたが、readiness はまだ通っていません。
      zh-CN: worker-c 上的 kubelet 发现这个已分配 Pod，并要求容器运行时根据镜像创建 Container。进程已经启动，但就绪检查还没有通过。
    teaching:
      whatChanged:
        en: A real Container instance now exists and is running inside the Pod; Ready remains false.
        ja: Pod 内に実際の Container instance が作られて running になりますが、Ready は false のままです。
        zh-CN: Pod 内已经出现真正的 Container 实例并开始运行，但 Ready 仍然是 false。
      whyItHappened:
        en: kubelet and the container runtime execute the placement decision on the selected Node.
        ja: kubelet と container runtime が、選択された Node 上で配置決定を実行するためです。
        zh-CN: 因为 kubelet 与容器运行时会在选中的 Node 上真正执行调度结果。
      takeaway:
        en: Scheduler decides; kubelet and the runtime execute.
        ja: Scheduler が判断し、kubelet と runtime が実行します。
        zh-CN: Scheduler 负责决定，kubelet 与容器运行时负责执行。
    evidence:
      mode: diff-with-context
      entityIds:
        - runtime-component:node:worker-c:Kubelet:kubelet
        - runtime-component:node:worker-c:ContainerRuntime:runtime
        - container-status:shop:Pod:api-d-new:Container:api
        - api-object:namespaced:shop:Pod:api-d-new
    introducesTerms: []
    usesTerms:
