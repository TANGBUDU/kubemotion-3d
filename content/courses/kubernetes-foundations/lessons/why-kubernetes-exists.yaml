        - op: patch-entity
          entityId: api-object:namespaced:shop:Pod:api-d-new
          patch:
            status: ready
            data:
              nodeName: worker-c
              phase: Running
              conditions:
                podScheduled: true
                initialized: true
                containersReady: true
                ready: true
        - op: patch-entity
          entityId: container-status:shop:Pod:api-d-new:Container:api
          patch:
            status: running
            data:
              containerID: containerd://synthetic-api-d-01
              restartCount: 0
              ready: true
              started: true
              state:
                kind: running
                startedAt: 2026-08-08T00:01:00Z
        - op: patch-entity
          entityId: api-object:namespaced:shop:ReplicaSet:api-rs
          patch:
            data:
              specReplicas: 3
              statusReplicas: 3
              readyReplicas: 3
    viewPatch:
      view: logical
      cameraPresetId: logical
      resetEntities: true
      entityRules:
        - selector:
            byIds:
              - api-object:namespaced:shop:ReplicaSet:api-rs
          visible: true
          emphasis: focused
          labelMode: full
          inspectorMode: expanded
        - selector:
            byIds:
              - api-object:namespaced:shop:Pod:api-b
              - api-object:namespaced:shop:Pod:api-c
              - api-object:namespaced:shop:Pod:api-d-new
          visible: true
          emphasis: normal
          labelMode: short
      relationRules:
        - byIds:
            - owns-api-d-new
          visible: true
          emphasis: focused
      activeRoutes: []
    transition:
      cues:
        - type: counter-change
          entityId: api-object:namespaced:shop:ReplicaSet:api-rs
          field: data.readyReplicas
          from: 2
          to: 3
          durationMs: 520
        - type: focus-camera
          entityId: api-object:namespaced:shop:ReplicaSet:api-rs
          delayMs: 160
          durationMs: 620
