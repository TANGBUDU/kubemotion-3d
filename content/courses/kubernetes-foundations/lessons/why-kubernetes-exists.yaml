    worldPatch:
      operations:
        - op: patch-entity
          entityId: api-object:namespaced:shop:Pod:api-d-new
          patch:
            status: starting
            data:
              nodeName: worker-c
              phase: Running
              conditions:
                podScheduled: true
                initialized: true
                containersReady: false
                ready: false
        - op: patch-entity
          entityId: container-status:shop:Pod:api-d-new:Container:api
          patch:
            status: running
            data:
              containerID: containerd://synthetic-api-d-01
              restartCount: 0
              ready: false
              started: true
              state:
                kind: running
                startedAt: 2026-08-08T00:01:00Z
    viewPatch:
      view: placement
      cameraPresetId: placement
      resetEntities: true
      entityRules:
        - selector:
            byIds:
              - infrastructure:cluster:global:Node:worker-c
          visible: true
          emphasis: normal
          labelMode: full
        - selector:
            byIds:
              - runtime-component:node:worker-c:Kubelet:kubelet
          visible: true
          emphasis: focused
          labelMode: full
          inspectorMode: expanded
        - selector:
            byIds:
              - runtime-component:node:worker-c:ContainerRuntime:runtime
              - api-object:namespaced:shop:Pod:api-d-new
              - container-status:shop:Pod:api-d-new:Container:api
          visible: true
          emphasis: normal
          labelMode: full
      relationRules: []
      activeRoutes:
        - id: route-worker-c-starts-container
          semantic: node-runtime
          label:
            en: start the Container on worker-c
            ja: worker-c 上で Container を起動
            zh-CN: 在 worker-c 上启动 Container
          persistAfterAnimation: true
          numbered: true
          hops:
            - fromEntityId: runtime-component:node:worker-c:Kubelet:kubelet
              fromAnchor: local-runtime
              toEntityId: runtime-component:node:worker-c:ContainerRuntime:runtime
              toAnchor: local-runtime
              label:
