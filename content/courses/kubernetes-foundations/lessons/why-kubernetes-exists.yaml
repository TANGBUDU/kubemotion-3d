  - id: replacement-becomes-ready
    title:
      en: Readiness passes and service capacity returns to three
      ja: Readiness が通り、処理能力が3つへ戻る
      zh-CN: 就绪检查通过，服务能力恢复到三份
    learningOutcome:
      en: Separate a running process from a Pod that is Ready to receive traffic.
      ja: 実行中 process と、traffic を受けられる Ready Pod を区別する。
      zh-CN: 区分“进程已经运行”和“Pod 已能接收流量”。
    narration:
      en: The application is running, but Kubernetes counts it as healthy service capacity only after readiness succeeds. When the new Pod becomes Ready, the ReplicaSet returns to desired 3, current 3, ready 3.
      ja: アプリは実行中でも、readiness が成功するまで正常な処理能力として数えません。新しい Pod が Ready になると、ReplicaSet は期待3・現在3・Ready3へ戻ります。
      zh-CN: 应用进程已经运行，但只有就绪检查成功后，Kubernetes 才把它算作健康服务能力。新 Pod Ready 后，ReplicaSet 回到期望 3、当前 3、Ready 3。
    teaching:
      whatChanged:
        en: Pod Ready changes false → true and Ready replicas rise 2 → 3.
        ja: Pod Ready が false → true になり、Ready replicas が 2 → 3 へ戻ります。
        zh-CN: Pod Ready 从 false 变为 true，Ready 副本从 2 回到 3。
      whyItHappened:
        en: A running Container becomes traffic-ready only after its readiness condition succeeds.
        ja: 実行中 Container が traffic を受けられるのは readiness 条件が成功してからです。
        zh-CN: 运行中的 Container 只有在就绪条件成功后，才可以接收流量。
      takeaway:
        en: You declare the result; Kubernetes keeps working until reality matches it again.
        ja: 結果を宣言すると、現実が再び一致するまで Kubernetes が働き続けます。
        zh-CN: 你声明想要的结果，Kubernetes 会持续工作，直到现实再次与目标一致。
    evidence:
      mode: diff-with-context
      entityIds:
        - api-object:namespaced:shop:ReplicaSet:api-rs
        - api-object:namespaced:shop:Pod:api-d-new
        - container-status:shop:Pod:api-d-new:Container:api
    introducesTerms: []
    usesTerms:
