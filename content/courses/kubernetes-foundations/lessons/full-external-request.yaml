  - id: application-response-returns
    title:
      en: Return the application response
      ja: application response を返す
      zh-CN: 返回应用应答
    learningOutcome:
      en: Follow the response back over the same application route while keeping the configuration/support boundary visible.
      ja: configuration/support boundary を表示したまま、同じ application route を response が戻る様子を追跡します。
      zh-CN: 在持续显示配置/支撑边界的同时，跟踪应答沿同一应用路线返回。
    narration:
      en: The step briefly replays the established request, pauses, and then web-a returns the synthetic response in reverse. The route remains visible after animation, so the complete path can still be read statically.
      ja: この step は確立済み request を短く再生して pause し、その後 web-a が合成 response を逆向きに返します。animation 後も route が残るため、完全な path を静止状態で読み取れます。
      zh-CN: 本步骤先短暂重放已建立的请求，停顿后再由 web-a 反向返回合成应答；动画结束后路线继续保留，因此静态画面仍能读懂完整路径。
    teaching:
      whatChanged:
        en: After a short request replay and pause, a response token travels Pod → Service → GatewayDataPlane → Browser while the persistent arrows and selected Endpoint support remain visible.
        ja: 短い request replay と pause の後、response token が Pod → Service → GatewayDataPlane → Browser と移動し、persistent arrow と selected Endpoint support は表示されたままです。
        zh-CN: 短暂重放请求并停顿后，应答 Token 按 Pod → Service → GatewayDataPlane → 浏览器 返回；持久箭头与已选 Endpoint 支撑信息继续可见。
      whyItHappened:
        en: This teaching model reuses the established connection path in reverse for the response, without creating a second DNS lookup or treating API configuration as runtime infrastructure.
        ja: この教材 model は response のために確立済み connection path を逆向きに使い、2 回目の DNS lookup を作らず、API configuration を runtime infrastructure として扱いません。
        zh-CN: 本教学模型让应答沿已建立连接路径反向返回，不会再次执行 DNS 查询，也不会把 API 配置当作运行时基础设施。
      takeaway:
        en: Resolve first, then request and respond over the data plane; configuration and endpoint inventories explain the route without becoming route hops.
        ja: まず resolve し、その後 data plane 上で request/response を行います。configuration と endpoint inventory は route を説明しますが hop にはなりません。
        zh-CN: 先解析，再经数据面请求和应答；配置与 Endpoint 清单负责解释路线，但不会成为路线 Hop。
