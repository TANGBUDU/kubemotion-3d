  - id: node-runtime-starts-container
    title:
      en: The Node runtime starts the Container
      ja: Node runtime が Container を起動する
      zh-CN: Node 运行时启动容器
    learningOutcome:
      en: Separate Node-local Container creation from Scheduler's earlier placement decision.
      ja: Node-local Container 作成を、Scheduler の先の配置判断と区別する。
      zh-CN: 区分 Node 本地容器创建与 Scheduler 先前的放置决策。
    narration:
      en: worker-c's kubelet observes the assigned Pod and works through CRI with its local container runtime. The runtime creates containerd://synthetic-schedule-demo-01; the Pod phase becomes Running, while Ready remains false until later readiness succeeds.
      ja: worker-c の kubelet は割り当て済み Pod を監視し、CRI を通じて local container runtime と連携します。runtime が containerd://synthetic-schedule-demo-01 を作り、Pod phase は Running になりますが、後の readiness 成功までは Ready=false です。
      zh-CN: worker-c 上的 kubelet 观察已分配 Pod，并通过 CRI 与本机容器运行时协作。运行时创建 containerd://synthetic-schedule-demo-01；Pod 阶段变为 Running，但在稍后就绪检查成功前 Ready 仍为 false。
    teaching:
      whatChanged:
        en: The waiting Container gained its first containerID and became running; the Pod phase became Running while its Ready condition stayed false.
        ja: waiting Container に最初の containerID が入り running となり、Pod phase は Running になりましたが Ready condition は false のままです。
        zh-CN: waiting 容器获得首个 containerID 并变为 running；Pod 阶段变为 Running，但 Ready 条件仍为 false。
      whyItHappened:
        en: After binding, kubelet requested Node-local execution through CRI and the container runtime created the Container.
        ja: binding 後、kubelet が CRI 経由で Node-local execution を要求し、container runtime が Container を作ったためです。
        zh-CN: 因为绑定完成后，kubelet 通过 CRI 请求 Node 本地执行，容器运行时实际创建了容器。
      takeaway:
        en: Scheduler chooses placement; kubelet and the Node-local runtime perform Container startup afterward.
        ja: Scheduler が配置を選び、その後 kubelet と Node-local runtime が Container を起動します。
        zh-CN: Scheduler 选择放置位置；之后由 kubelet 与 Node 本地运行时完成容器启动。
    evidence:
      mode: diff-with-context
      entityIds:
        - runtime-component:node:worker-c:Kubelet:kubelet
        - runtime-component:node:worker-c:ContainerRuntime:runtime
        - api-object:namespaced:shop:Pod:schedule-demo
        - container-status:shop:Pod:schedule-demo:Container:demo
    introducesTerms: [cri]
    usesTerms: [pod, pending, scheduling, scheduler, node, binding, cri]
    sourceIds: [k8s-components, k8s-cri, k8s-pods, k8s-pod-lifecycle, k8s-nodes]
    worldPatch:
