  - id: scheduler-records-worker-c
    title:
      en: Scheduler records worker-c through the API
      ja: Scheduler が API 経由で worker-c を記録する
      zh-CN: Scheduler 通过 API 记录 worker-c
    learningOutcome:
      en: Separate Node selection and binding from Container startup.
      ja: Node の選択と binding を Container 起動から区別する。
      zh-CN: 区分 Node 选择与绑定，以及后续的容器启动。
    narration:
      en: Scheduler observes the unbound Pod through the API, selects worker-c, and records the binding through the API Server. The Pod gains nodeName worker-c and a placement relation, but phase remains Pending and its Container remains waiting.
      ja: Scheduler は API 経由で未 bind の Pod を観測し、worker-c を選び、API Server 経由で binding を記録します。Pod は nodeName worker-c と配置関係を得ますが、phase は Pending、Container は waiting のままです。
      zh-CN: Scheduler 通过 API 观察未绑定的 Pod，选择 worker-c，并经 API Server 记录绑定。Pod 获得 nodeName worker-c 和放置关系，但阶段仍为 Pending，容器仍为 waiting。
    teaching:
      whatChanged:
        en: The Pod gained nodeName worker-c, PodScheduled became true, and a scheduled-on relation was added; the Container did not start.
        ja: Pod に nodeName worker-c が入り、PodScheduled は true になり、scheduled-on 関係が追加されましたが、Container は起動していません。
        zh-CN: Pod 获得 nodeName worker-c，PodScheduled 变为 true，并新增 scheduled-on 关系；容器尚未启动。
      whyItHappened:
        en: Scheduler selected a suitable Node and persisted the binding through the API Server; Scheduler is not a container runtime.
        ja: Scheduler が適切な Node を選び、API Server 経由で binding を保存したためです。Scheduler は container runtime ではありません。
        zh-CN: 因为 Scheduler 选择了合适的 Node，并通过 API Server 持久化绑定；Scheduler 不是容器运行时。
      takeaway:
        en: Scheduler decides placement; it does not download images or start Containers.
        ja: Scheduler は配置を決めますが、image の取得や Container の起動は行いません。
        zh-CN: Scheduler 决定放置位置，但不会下载镜像或启动容器。
    evidence:
