  - id: runtime-starts-container
    title:
      en: kubelet uses the local runtime to start the Container
      ja: kubelet が local runtime で Container を起動する
      zh-CN: kubelet 使用本机运行时启动容器
    learningOutcome:
      en: Separate kubelet's Node-agent responsibility from the container runtime that creates the runtime Container.
      ja: kubelet の Node agent と、runtime Container を作る container runtime の責務を区別する。
      zh-CN: 区分 kubelet 的 Node 代理职责与实际创建运行时容器的容器运行时职责。
    narration:
      en: On worker-c, kubelet works across the Container Runtime Interface boundary and the local container runtime creates Container ID containerd://synthetic-api-manifest-new-01. The Container is running and the Pod phase is Running, but readiness is still false.
      ja: worker-c 上で kubelet は Container Runtime Interface の境界を通じて動作し、local container runtime が Container ID containerd://synthetic-api-manifest-new-01 を作ります。Container と Pod phase は Running ですが、readiness はまだ false です。
      zh-CN: 在 worker-c 上，kubelet 通过容器运行时接口边界协作，本机容器运行时创建 Container ID containerd://synthetic-api-manifest-new-01。容器已运行，Pod 阶段也变为 Running，但就绪仍为 false。
    teaching:
      whatChanged:
        en: The waiting Container gained its first containerID and became running; the Pod phase became Running while Ready remained false.
        ja: waiting Container に最初の containerID が入り running になり、Pod phase は Running になりましたが Ready は false のままです。
        zh-CN: waiting 容器获得首个 containerID 并变为 running；Pod 阶段变为 Running，但 Ready 仍为 false。
      whyItHappened:
        en: kubelet requested Node-local execution through CRI, and the container runtime created and started the Container.
        ja: kubelet が CRI 経由で Node-local execution を要求し、container runtime が Container を作成・起動したためです。
        zh-CN: 因为 kubelet 通过 CRI 请求 Node 本地执行，容器运行时实际创建并启动了容器。
      takeaway:
        en: Scheduler chooses a Node, kubelet maintains the assigned Pod, and the runtime starts the Container.
        ja: Scheduler が Node を選び、kubelet が割り当て Pod を維持し、runtime が Container を起動します。
        zh-CN: Scheduler 选择 Node，kubelet 维护已分配 Pod，运行时负责启动容器。
    evidence:
      mode: diff-with-context
      entityIds:
        - runtime-component:node:worker-c:Kubelet:kubelet
        - runtime-component:node:worker-c:ContainerRuntime:runtime
        - api-object:namespaced:shop:Pod:api-manifest-new
        - container-status:shop:Pod:api-manifest-new:Container:api
    introducesTerms: [cri]
    usesTerms: [pod, node, scheduling]
    sourceIds: [k8s-components, k8s-cri, k8s-pods, k8s-pod-lifecycle]
    worldPatch:
      operations:
        - op: patch-entity
          entityId: container-status:shop:Pod:api-manifest-new:Container:api
          patch:
            status: running
            data:
              podId: api-object:namespaced:shop:Pod:api-manifest-new
              name: api
              image: registry.example.invalid/shop/api:v1
              containerID: containerd://synthetic-api-manifest-new-01
              restartCount: 0
              ready: false
              started: true
              state:
                kind: running
                startedAt: 2026-08-08T01:00:00Z
        - op: patch-entity
          entityId: api-object:namespaced:shop:Pod:api-manifest-new
          patch:
            status: not-ready
            data:
              nodeName: worker-c
              phase: Running
              restartPolicy: Always
              conditions:
                podScheduled: true
                initialized: true
                containersReady: false
                ready: false
    viewPatch:
      view: placement
      cameraPresetId: placement
      resetEntities: false
      entityRules:
        - selector: { byIds: [runtime-component:node:worker-c:ContainerRuntime:runtime] }
          visible: true
          emphasis: focused
          labelMode: full
        - selector: { byIds: [runtime-component:node:worker-c:Kubelet:kubelet] }
          visible: true
          emphasis: normal
          labelMode: full
        - selector:
            byIds:
              - infrastructure:cluster:global:Node:worker-c
              - api-object:namespaced:shop:Pod:api-manifest-new
              - container-status:shop:Pod:api-manifest-new:Container:api
          visible: true
          emphasis: normal
          labelMode: full
      relationRules:
        - byIds: [kubelet-c-uses-container-runtime, scheduled-api-manifest-new]
          visible: true
          emphasis: focused
      activeRoutes:
        - id: route-worker-c-container-start
          semantic: node-runtime
          label:
            en: Node-local Container startup
            ja: Node-local Container 起動
            zh-CN: Node 本地容器启动
          persistAfterAnimation: true
          numbered: true
          hops:
            - fromEntityId: runtime-component:node:worker-c:Kubelet:kubelet
              fromAnchor: local-runtime
              toEntityId: runtime-component:node:worker-c:ContainerRuntime:runtime
              toAnchor: local-runtime
              label: { en: request through CRI, ja: CRI 経由で要求, zh-CN: 通过 CRI 请求 }
            - fromEntityId: runtime-component:node:worker-c:ContainerRuntime:runtime
              fromAnchor: local-runtime
              toEntityId: container-status:shop:Pod:api-manifest-new:Container:api
              toAnchor: local-runtime
              label: { en: create and start, ja: 作成して起動, zh-CN: 创建并启动 }
