  - id: pod-becomes-ready
    title:
      en: Readiness completes the scale-up
      ja: readiness がスケールアップを完了する
      zh-CN: 就绪状态完成扩容
    learningOutcome:
      en: Distinguish a running Container and Running Pod phase from the later Ready condition.
      ja: running Container と Running Pod phase を、その後の Ready condition から区別する。
      zh-CN: 区分正在运行的容器、Running Pod 阶段，以及稍后才成立的 Ready 条件。
    narration:
      en: The Container now reports ready, the Pod's ContainersReady and Ready conditions become true, and ReplicaSet READY increases from 3 to 4. Kubernetes components continue watching and reconciling API state; the eight teaching steps are not one literal synchronous call stack.
      ja: Container が ready を報告し、Pod の ContainersReady と Ready condition が true になり、ReplicaSet READY は 3 から 4 になります。Kubernetes component は継続して API state を監視・reconcile しており、この 8 ステップは文字通りの同期 call stack ではありません。
      zh-CN: 容器现在报告 ready，Pod 的 ContainersReady 与 Ready 条件变为 true，ReplicaSet READY 从 3 增至 4。Kubernetes 组件会持续观察并协调 API 状态；这八个教学步骤并不是一次字面意义上的同步调用栈。
    teaching:
      whatChanged:
        en: Container ready became true, the Pod became Ready, and ReplicaSet READY increased from 3 to 4 while SPEC and OBSERVED remained 4.
        ja: Container ready は true、Pod は Ready、ReplicaSet READY は 3 から 4 になり、SPEC と OBSERVED は 4 のままです。
        zh-CN: 容器 ready 变为 true，Pod 变为 Ready，ReplicaSet READY 从 3 增至 4，而 SPEC 与 OBSERVED 保持为 4。
      whyItHappened:
        en: The running workload satisfied its readiness condition after Container startup.
        ja: Container 起動後、実行中 workload が readiness condition を満たしたためです。
        zh-CN: 因为运行中的工作负载在容器启动后满足了就绪条件。
      takeaway:
        en: Ready is the final observed condition in this story, not a synonym for Pod creation, scheduling, or Container startup.
        ja: Ready はこの物語で最後に観測される condition であり、Pod 作成・scheduling・Container 起動の同義語ではありません。
        zh-CN: Ready 是本故事最后观察到的条件，并不等同于 Pod 创建、调度或容器启动。
    evidence:
      mode: diff-with-context
      entityIds:
        - api-object:namespaced:shop:Deployment:api
        - api-object:namespaced:shop:ReplicaSet:api-rs
        - api-object:namespaced:shop:Pod:api-manifest-new
        - container-status:shop:Pod:api-manifest-new:Container:api
    introducesTerms: []
    usesTerms: [deployment, replicaset, pod, node, scheduling, cri, desired-state]
    sourceIds: [k8s-deployments, k8s-replicasets, k8s-pods, k8s-pod-lifecycle]
    worldPatch:
      operations:
        - op: patch-entity
          entityId: container-status:shop:Pod:api-manifest-new:Container:api
          patch:
            status: running
            data:
              podId: api-object:namespaced:shop:Pod:api-manifest-new
              name: api
              image: registry.example.invalid/shop/api:v1
              containerID: containerd://synthetic-api-manifest-new-01
              restartCount: 0
              ready: true
              started: true
              state:
                kind: running
                startedAt: 2026-08-08T01:00:00Z
        - op: patch-entity
          entityId: api-object:namespaced:shop:Pod:api-manifest-new
          patch:
            status: ready
            data:
              nodeName: worker-c
              phase: Running
              restartPolicy: Always
              conditions:
                podScheduled: true
                initialized: true
                containersReady: true
                ready: true
        - op: patch-entity
          entityId: api-object:namespaced:shop:ReplicaSet:api-rs
          patch:
            data: { specReplicas: 4, statusReplicas: 4, readyReplicas: 4 }
    viewPatch:
      view: placement
      cameraPresetId: placement
      resetEntities: false
      entityRules:
        - selector: { byIds: [api-object:namespaced:shop:Pod:api-manifest-new] }
          visible: true
          emphasis: focused
          labelMode: full
          inspectorMode: expanded
        - selector:
            byIds:
              - container-status:shop:Pod:api-manifest-new:Container:api
              - api-object:namespaced:shop:ReplicaSet:api-rs
              - infrastructure:cluster:global:Node:worker-c
          visible: true
          emphasis: normal
          labelMode: full
      relationRules:
        - byIds: [owns-api-manifest-new, scheduled-api-manifest-new]
          visible: true
          emphasis: focused
      activeRoutes: []
    transition:
      cues:
        - type: counter-change
          entityId: api-object:namespaced:shop:ReplicaSet:api-rs
          field: data.readyReplicas
          from: 3
          to: 4
          durationMs: 560
        - type: callout
          entityId: api-object:namespaced:shop:Pod:api-manifest-new
          label: { en: Ready, ja: Ready, zh-CN: Ready }
          delayMs: 180
          durationMs: 620
