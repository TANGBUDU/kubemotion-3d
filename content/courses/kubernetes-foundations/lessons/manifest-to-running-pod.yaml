schemaVersion: 2
id: manifest-to-running-pod
scenarioId: container-restart-golden
chapterId: workloads-self-healing
title:
  en: From a Deployment manifest to a Ready Pod
  ja: Deployment manifest から Ready な Pod まで
  zh-CN: 从 Deployment 清单到 Ready Pod
summary:
  en: Follow one scale-up request through the Kubernetes API, reconciliation, scheduling, Node observation, local Container startup, and readiness without inventing a synchronous pipeline.
  ja: 1 回のスケールアップ要求が Kubernetes API、reconciliation、scheduling、Node の監視、ローカルでの Container 起動、readiness を経る流れを、架空の同期パイプラインにせず追います。
  zh-CN: 跟随一次扩容请求经过 Kubernetes API、协调、调度、Node 观察、本机容器启动与就绪的全过程，同时避免虚构同步流水线。
learningOutcome:
  en: Explain the distinct responsibilities of kubectl, API Server, etcd, controllers, Scheduler, kubelet, and the container runtime when desired state becomes a Ready Pod.
  ja: desired state が Ready な Pod になるまでの kubectl、API Server、etcd、controller、Scheduler、kubelet、container runtime の責務を区別して説明する。
  zh-CN: 区分并解释期望状态变成 Ready Pod 时 kubectl、API Server、etcd、控制器、Scheduler、kubelet 和容器运行时各自的职责。
prerequisites: [deployment-replicaset-and-pods]
sourceIds:
  - k8s-objects
  - k8s-api
  - k8s-components
  - k8s-deployments
  - k8s-replicasets
  - k8s-pods
  - k8s-pod-lifecycle
  - k8s-nodes
  - k8s-cri
verifiedAt: '2026-08-08'
