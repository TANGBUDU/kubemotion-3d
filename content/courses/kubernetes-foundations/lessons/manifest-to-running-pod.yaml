steps:
  - id: submit-deployment-manifest
    title:
      en: kubectl submits desired state to the API Server
      ja: kubectl が desired state を API Server に送信する
      zh-CN: kubectl 向 API Server 提交期望状态
    learningOutcome:
      en: Place the client outside the control plane and identify the API Server as the only entry in this request.
      ja: client を control plane の外に置き、この要求の唯一の入口が API Server であることを確認する。
      zh-CN: 明确客户端位于控制面之外，并确认 API Server 是此请求的唯一入口。
    narration:
      en: A synthetic kubectl actor applies a Deployment manifest that changes api replicas from three to four. kubectl sends one API request to the API Server; it does not call etcd, a controller, or a Node directly.
      ja: 合成 kubectl 操作者が api の replica 数を 3 から 4 に変更する Deployment manifest を apply します。kubectl が送る要求先は API Server だけで、etcd、controller、Node を直接呼び出しません。
      zh-CN: 一个虚构的 kubectl 操作者应用 Deployment 清单，将 api 副本数从 3 改为 4。kubectl 只向 API Server 发出一次 API 请求，不会直接调用 etcd、控制器或 Node。
    teaching:
      whatChanged:
        en: The Deployment's declared desired replica count changed from 3 to 4, and the kubectl actor now records the apply command.
        ja: Deployment が宣言する desired replica 数は 3 から 4 に変わり、kubectl 操作者には apply コマンドが記録されました。
        zh-CN: Deployment 声明的期望副本数从 3 变为 4，kubectl 操作者也记录了 apply 命令。
      whyItHappened:
        en: The user submitted a declarative manifest through the Kubernetes API rather than starting a process on a worker Node.
        ja: ユーザーが worker Node 上でプロセスを起動したのではなく、Kubernetes API 経由で宣言的 manifest を送信したためです。
        zh-CN: 因为用户是通过 Kubernetes API 提交声明式清单，而不是在工作 Node 上直接启动进程。
      takeaway:
        en: A manifest changes desired API state; it is not an instruction sent straight to a Node.
        ja: manifest が変更するのは desired API state であり、Node へ直接送る起動命令ではありません。
        zh-CN: 清单改变的是 API 中的期望状态，并不是直接发给 Node 的启动命令。
    evidence:
      mode: diff-with-context
      entityIds:
        - external:external:global:Kubectl:kubectl
        - api-object:namespaced:shop:Deployment:api
        - runtime-component:cluster:global:KubeAPIServer:kube-apiserver
    introducesTerms: [manifest, kubernetes-api, desired-state]
    usesTerms: []
    sourceIds: [k8s-objects, k8s-api, k8s-deployments]
    worldPatch:
      operations:
        - op: patch-entity
          entityId: external:external:global:Kubectl:kubectl
          patch:
            data:
              actorType: synthetic-teaching-action
              command: kubectl apply -f api-deployment.yaml
            summary:
              en: Synthetic learner action that applies a Deployment manifest through the API Server.
              ja: API Server 経由で Deployment manifest を apply する合成学習操作です。
              zh-CN: 通过 API Server 应用 Deployment 清单的虚构教学操作。
        - op: patch-entity
          entityId: api-object:namespaced:shop:Deployment:api
          patch:
            data: { desiredReplicas: 4 }
    viewPatch:
      view: control-flow
      cameraPresetId: control-flow
      resetEntities: false
      entityRules:
        - selector: { byIds: [external:external:global:Kubectl:kubectl] }
          visible: true
          emphasis: focused
          labelMode: full
        - selector:
            byIds:
              - runtime-component:cluster:global:KubeAPIServer:kube-apiserver
              - api-object:namespaced:shop:Deployment:api
          visible: true
          emphasis: normal
          labelMode: full
      relationRules:
        - byIds: [kubectl-requests-api-server]
          visible: true
          emphasis: focused
      activeRoutes:
        - id: route-apply-manifest
          semantic: control
          label: { en: apply desired state, ja: desired state を apply, zh-CN: 应用期望状态 }
          persistAfterAnimation: true
          numbered: true
          hops:
            - fromEntityId: external:external:global:Kubectl:kubectl
              fromAnchor: api-out
              toEntityId: runtime-component:cluster:global:KubeAPIServer:kube-apiserver
              toAnchor: api-in
              label: { en: submit manifest, ja: manifest を送信, zh-CN: 提交清单 }
    transition:
      cues:
        - type: api-request
          routeId: route-apply-manifest
          label: { en: kubectl apply, ja: kubectl apply, zh-CN: kubectl apply }
          durationMs: 760

  - id: persist-api-state
    title:
      en: API Server persists API data in etcd
      ja: API Server が API data を etcd に保存する
      zh-CN: API Server 将 API 数据持久化到 etcd
    learningOutcome:
      en: Identify etcd as the Kubernetes API data store without drawing a client-to-etcd shortcut.
      ja: client から etcd への近道を描かず、etcd を Kubernetes API data store として説明する。
      zh-CN: 将 etcd 识别为 Kubernetes API 数据存储，同时避免画出客户端直连 etcd 的捷径。
    narration:
      en: The API Server validates and persists Kubernetes API data in etcd. This step separates storage responsibility for teaching, but it does not claim that kubectl opens a second connection to etcd.
      ja: API Server は Kubernetes API data を検証して etcd に保存します。このステップでは保存の責務を説明のために分けていますが、kubectl が etcd へ別の接続を開くという意味ではありません。
      zh-CN: API Server 验证 Kubernetes API 数据并将其持久化到 etcd。本步骤为了教学而单独展示存储职责，但并不表示 kubectl 会另外直连 etcd。
    teaching:
      whatChanged:
        en: No additional workload object changed; the view now exposes the persistent API Server-to-etcd storage relationship.
        ja: workload object に追加変更はなく、API Server から etcd への永続的な保存関係が表示されました。
        zh-CN: 工作负载对象没有发生额外变化；视图现在展示 API Server 到 etcd 的持久存储关系。
      whyItHappened:
        en: etcd is the backing store for Kubernetes API data, while the API Server remains the component clients and controllers use.
        ja: etcd は Kubernetes API data の backing store であり、client と controller が利用する窓口は API Server だからです。
        zh-CN: 因为 etcd 是 Kubernetes API 数据的后端存储，而客户端和控制器使用的入口仍是 API Server。
      takeaway:
        en: API Server fronts the API; etcd stores its data.
        ja: API Server が API の窓口となり、etcd がその data を保存します。
        zh-CN: API Server 对外提供 API，etcd 负责存储其数据。
    evidence:
      mode: snapshot
      entityIds:
        - runtime-component:cluster:global:KubeAPIServer:kube-apiserver
        - runtime-component:cluster:global:Etcd:etcd
        - api-object:namespaced:shop:Deployment:api
    introducesTerms: [api-object, deployment, control-plane]
    usesTerms: [kubernetes-api, desired-state]
    sourceIds: [k8s-api, k8s-components, k8s-objects]
    worldPatch: { operations: [] }
    viewPatch:
      view: control-flow
      cameraPresetId: control-flow
      resetEntities: false
      entityRules:
        - selector: { byIds: [runtime-component:cluster:global:Etcd:etcd] }
          visible: true
          emphasis: focused
          labelMode: full
        - selector: { byIds: [runtime-component:cluster:global:KubeAPIServer:kube-apiserver] }
          visible: true
          emphasis: normal
          labelMode: full
        - selector: { byIds: [api-object:namespaced:shop:Deployment:api] }
          visible: true
          emphasis: normal
          labelMode: short
      relationRules:
        - byIds: [api-stores-etcd]
          visible: true
          emphasis: focused
      activeRoutes:
        - id: route-api-storage
          semantic: control
          label: { en: persist API data, ja: API data を保存, zh-CN: 持久化 API 数据 }
          persistAfterAnimation: true
          numbered: true
          hops:
            - fromEntityId: runtime-component:cluster:global:KubeAPIServer:kube-apiserver
              fromAnchor: storage
              toEntityId: runtime-component:cluster:global:Etcd:etcd
              toAnchor: storage
              label: { en: store API data, ja: API data を格納, zh-CN: 存储 API 数据 }
    transition:
      cues:
        - type: api-request
          routeId: route-api-storage
          label: { en: persist API data, ja: API data を保存, zh-CN: 持久化 API 数据 }
          durationMs: 700

  - id: controller-creates-pending-pod
    title:
      en: A controller reconciles the replica deficit
      ja: controller が replica の不足を reconcile する
      zh-CN: 控制器协调副本缺口
    learningOutcome:
      en: Explain how a controller creates a new Pod API object without treating Deployment or ReplicaSet as traffic hops.
      ja: Deployment や ReplicaSet を通信の hop にせず、controller が新しい Pod API object を作る仕組みを説明する。
      zh-CN: 解释控制器如何创建新的 Pod API 对象，同时不把 Deployment 或 ReplicaSet 当作流量跳点。
    narration:
      en: The Deployment and ReplicaSet are control objects, not running packet forwarders. A reconciliation loop observes desired replicas 4 versus current replicas 3 through the API and creates api-manifest-new as a real Pending Pod with no nodeName and a waiting Container status slot.
      ja: Deployment と ReplicaSet は control object であり、packet を転送する実行プロセスではありません。reconciliation loop は API 経由で desired 4 と current 3 の差を観測し、nodeName を持たない実在の Pending Pod api-manifest-new と waiting の Container 状態スロットを作ります。
      zh-CN: Deployment 和 ReplicaSet 是控制对象，并不是转发数据包的运行进程。协调循环通过 API 观察到期望副本 4 与当前副本 3 的差距，创建真实的 Pending Pod api-manifest-new；它没有 nodeName，并带有 waiting 容器状态槽。
    teaching:
      whatChanged:
        en: ReplicaSet SPEC and OBSERVED increased from 3 to 4; a new Pending, unscheduled Pod and waiting Container status slot were added while READY stayed 3.
        ja: ReplicaSet の SPEC と OBSERVED は 3 から 4 になり、新しい Pending・未スケジュール Pod と waiting の Container 状態スロットが追加され、READY は 3 のままです。
        zh-CN: ReplicaSet 的 SPEC 与 OBSERVED 从 3 增至 4；新增一个 Pending、未调度 Pod 及 waiting 容器状态槽，而 READY 保持为 3。
      whyItHappened:
        en: The controller observed a one-replica gap in API state and created another Pod identity to converge toward desired state.
        ja: controller が API state に 1 replica の差を観測し、desired state へ収束するため別の Pod ID を作ったためです。
        zh-CN: 因为控制器在 API 状态中观察到一个副本缺口，于是创建新的 Pod 身份以趋近期望状态。
      takeaway:
        en: Controllers reconcile API objects; Deployment and ReplicaSet are ownership context, not a data-plane path.
        ja: controller は API object を reconcile し、Deployment と ReplicaSet は ownership の文脈であって data-plane path ではありません。
        zh-CN: 控制器协调 API 对象；Deployment 与 ReplicaSet 提供所有权上下文，不是数据平面路径。
    evidence:
      mode: diff-with-context
      entityIds:
        - api-object:namespaced:shop:Deployment:api
        - api-object:namespaced:shop:ReplicaSet:api-rs
        - api-object:namespaced:shop:Pod:api-manifest-new
        - container-status:shop:Pod:api-manifest-new:Container:api
    introducesTerms: [controller, replicaset, pod]
    usesTerms: [deployment, desired-state, kubernetes-api, api-object]
    sourceIds: [k8s-api, k8s-components, k8s-deployments, k8s-replicasets, k8s-pods]
    worldPatch:
      operations:
        - op: add-entity
          entity:
            id: api-object:namespaced:shop:Pod:api-manifest-new
            category: api-object
            kind: Pod
            name: api-manifest-new
            namespace: shop
            labels: { app.kubernetes.io/name: api }
            status: pending
            data:
              uid: synthetic-uid-manifest-new-01
              phase: Pending
              restartPolicy: Always
              conditions:
                podScheduled: false
                initialized: true
                containersReady: false
                ready: false
            title:
              { en: api-manifest-new Pod, ja: api-manifest-new Pod, zh-CN: api-manifest-new Pod }
            summary:
              en: New Pod API object waiting in the unscheduled area for a Node assignment.
              ja: Node への割り当てを未スケジュール領域で待つ、新しい Pod API object です。
              zh-CN: 在未调度区域等待 Node 分配的新 Pod API 对象。
            sourceIds: [k8s-pods, k8s-pod-lifecycle, k8s-replicasets]
            visual: { archetype: pod, size: md, group: api-manifest-new }
        - op: add-entity
          entity:
            id: container-status:shop:Pod:api-manifest-new:Container:api
            category: runtime-status
            kind: Container
            name: api
            namespace: shop
            status: waiting
            data:
              podId: api-object:namespaced:shop:Pod:api-manifest-new
              name: api
              image: registry.example.invalid/shop/api:v1
              restartCount: 0
              ready: false
              started: false
              state:
                kind: waiting
                reason: Pending
            title:
              en: api Container · api-manifest-new
              ja: api Container · api-manifest-new
              zh-CN: api 容器 · api-manifest-new
            summary:
              en: Container status slot waiting for kubelet to create a runtime Container.
              ja: kubelet が runtime Container を作るのを待つ Container 状態スロットです。
              zh-CN: 等待 kubelet 创建运行时容器的容器状态槽。
            sourceIds: [k8s-pods, k8s-pod-lifecycle]
            visual: { archetype: container, size: sm, group: api-manifest-new }
        - op: add-relation
          relation:
            id: owns-api-manifest-new
            type: owns
            from: api-object:namespaced:shop:ReplicaSet:api-rs
            to: api-object:namespaced:shop:Pod:api-manifest-new
            directed: true
            semantic: ownership
            title: { en: owns, ja: 所有, zh-CN: 拥有 }
            sourceIds: [k8s-replicasets]
        - op: add-relation
          relation:
            id: contains-api-manifest-new-container-api
            type: contains-runtime
            from: api-object:namespaced:shop:Pod:api-manifest-new
            to: container-status:shop:Pod:api-manifest-new:Container:api
            directed: true
            semantic: composition
            title: { en: contains Container status, ja: Container 状態を含む, zh-CN: 包含容器状态 }
            sourceIds: [k8s-pods]
        - op: add-relation
          relation:
            id: api-exposes-api-manifest-new
            type: references
            from: runtime-component:cluster:global:KubeAPIServer:kube-apiserver
            to: api-object:namespaced:shop:Pod:api-manifest-new
            directed: true
            semantic: control-observation
            title:
              en: exposes Pod API object
              ja: Pod API object を公開
              zh-CN: 提供 Pod API 对象
            sourceIds: [k8s-api, k8s-pods]
        - op: patch-entity
          entityId: api-object:namespaced:shop:ReplicaSet:api-rs
          patch:
            data: { specReplicas: 4, statusReplicas: 4, readyReplicas: 3 }
    viewPatch:
      view: control-flow
      cameraPresetId: control-flow
      resetEntities: false
      entityRules:
        - selector:
            { byIds: [runtime-component:cluster:global:ControllerManager:kube-controller-manager] }
          visible: true
          emphasis: focused
          labelMode: full
        - selector:
            byIds:
              - runtime-component:cluster:global:KubeAPIServer:kube-apiserver
              - api-object:namespaced:shop:Deployment:api
              - api-object:namespaced:shop:ReplicaSet:api-rs
              - api-object:namespaced:shop:Pod:api-manifest-new
              - container-status:shop:Pod:api-manifest-new:Container:api
          visible: true
          emphasis: normal
          labelMode: full
      relationRules:
        - byIds:
            - controller-watches-api-server
            - api-deployment-owns-api-replicaset
            - owns-api-manifest-new
            - api-exposes-api-manifest-new
          visible: true
          emphasis: focused
      activeRoutes:
        - id: route-controller-create-pod
          semantic: control
          label:
            en: observe deficit and create Pod
            ja: 不足を観測して Pod を作成
            zh-CN: 观察缺口并创建 Pod
          persistAfterAnimation: true
          numbered: true
          hops:
            - fromEntityId: runtime-component:cluster:global:ControllerManager:kube-controller-manager
              fromAnchor: api-out
              toEntityId: runtime-component:cluster:global:KubeAPIServer:kube-apiserver
              toAnchor: api-in
              label: { en: observe API state, ja: API state を監視, zh-CN: 观察 API 状态 }
            - fromEntityId: runtime-component:cluster:global:KubeAPIServer:kube-apiserver
              fromAnchor: api-out
              toEntityId: api-object:namespaced:shop:Pod:api-manifest-new
              toAnchor: api-in
              label: { en: create Pod object, ja: Pod object を作成, zh-CN: 创建 Pod 对象 }
    transition:
      cues:
        - type: reconcile-pulse
          fromEntityId: runtime-component:cluster:global:ControllerManager:kube-controller-manager
          toEntityId: api-object:namespaced:shop:Pod:api-manifest-new
          routeId: route-controller-create-pod
          durationMs: 780
        - type: entity-enter
          entityId: api-object:namespaced:shop:Pod:api-manifest-new
          delayMs: 560
          durationMs: 720
        - type: counter-change
          entityId: api-object:namespaced:shop:ReplicaSet:api-rs
          field: data.specReplicas
          from: 3
          to: 4
          delayMs: 620
          durationMs: 500
        - type: counter-change
          entityId: api-object:namespaced:shop:ReplicaSet:api-rs
          field: data.statusReplicas
          from: 3
          to: 4
          delayMs: 760
          durationMs: 500
        - type: relation-reveal
          relationId: owns-api-manifest-new
          delayMs: 560
          durationMs: 700

  - id: pending-before-scheduling
    title:
      en: The new Pod exists before it has a Node
      ja: 新しい Pod は Node が決まる前に存在する
      zh-CN: 新 Pod 在获得 Node 之前已经存在
    learningOutcome:
      en: Verify an actual Pending Pod with no nodeName in the unscheduled area.
      ja: nodeName を持たず未スケジュール領域にいる実在の Pending Pod を確認する。
      zh-CN: 验证一个没有 nodeName、位于未调度区域的真实 Pending Pod。
    narration:
      en: api-manifest-new already has UID synthetic-uid-manifest-new-01 and phase Pending, but it has no nodeName and no scheduled-on relation. Its Container status is waiting, so the Pod must remain in the unscheduled area rather than appearing inside a Node bay.
      ja: api-manifest-new には UID synthetic-uid-manifest-new-01 と Pending phase がありますが、nodeName も scheduled-on 関係もありません。Container 状態は waiting のため、Pod は Node bay 内ではなく未スケジュール領域に置かれます。
      zh-CN: api-manifest-new 已有 UID synthetic-uid-manifest-new-01，阶段为 Pending，但没有 nodeName，也没有 scheduled-on 关系。其容器状态为 waiting，因此 Pod 必须留在未调度区域，不能提前出现在 Node bay 中。
    teaching:
      whatChanged:
        en: No new fact changed after creation; this step isolates the Pending Pod's UID, absent nodeName, false PodScheduled condition, and waiting Container.
        ja: 作成後に新しい事実変更はなく、このステップでは Pending Pod の UID、存在しない nodeName、false の PodScheduled condition、waiting Container を分離して示します。
        zh-CN: 创建后没有新的事实变化；本步骤单独展示 Pending Pod 的 UID、缺失的 nodeName、为 false 的 PodScheduled 条件及 waiting 容器。
      whyItHappened:
        en: Pod creation and Node assignment are separate API events performed by different control loops.
        ja: Pod 作成と Node 割り当ては、異なる control loop が行う別々の API event だからです。
        zh-CN: 因为 Pod 创建与 Node 分配是由不同控制循环完成的两个独立 API 事件。
      takeaway:
        en: A Pending Pod is a real API object even when no Node has been selected.
        ja: Pending Pod は Node が未選択でも実在する API object です。
        zh-CN: 即使尚未选择 Node，Pending Pod 也是真实存在的 API 对象。
    evidence:
      mode: snapshot
      entityIds:
        - api-object:namespaced:shop:Pod:api-manifest-new
        - container-status:shop:Pod:api-manifest-new:Container:api
    introducesTerms: [pod-uid]
