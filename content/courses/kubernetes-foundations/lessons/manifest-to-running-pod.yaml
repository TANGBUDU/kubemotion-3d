            - fromEntityId: runtime-component:cluster:global:KubeAPIServer:kube-apiserver
              fromAnchor: api-out
              toEntityId: runtime-component:node:worker-c:Kubelet:kubelet
              toAnchor: api-in
              label: { en: watch assignment, ja: 割り当てを監視, zh-CN: 观察分配 }
