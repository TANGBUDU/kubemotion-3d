  - id: kubelet-observes-assignment
    title:
      en: kubelet observes the assigned Pod through the API
      ja: kubelet が API 経由で割り当て済み Pod を監視する
      zh-CN: kubelet 通过 API 观察已分配 Pod
    learningOutcome:
      en: Attribute Node-local execution to kubelet only after the Node assignment exists.
      ja: Node 割り当ての後にだけ Node-local execution が kubelet の責務になることを説明する。
      zh-CN: 说明只有在 Node 分配存在之后，才由 kubelet 承担 Node 本地执行职责。
    narration:
      en: kubelet on worker-c watches API state for Pods assigned to its Node. It now observes api-manifest-new with nodeName worker-c; this observation is distinct from Scheduler's placement decision and from the runtime's later Container creation.
      ja: worker-c の kubelet は、自分の Node に割り当てられた Pod の API state を監視します。nodeName worker-c の api-manifest-new を観測しますが、この監視は Scheduler の配置判断とも、その後の runtime による Container 作成とも別です。
      zh-CN: worker-c 上的 kubelet 监视 API 状态中分配给本 Node 的 Pod。它现在观察到 nodeName 为 worker-c 的 api-manifest-new；这一观察既不同于 Scheduler 的放置决策，也不同于运行时稍后创建容器。
    teaching:
      whatChanged:
        en: No workload fact changed; the control route now shows API Server-to-kubelet observation for the already bound Pod.
        ja: workload の事実変更はなく、すでに bind 済みの Pod を API Server から kubelet が監視する control route が表示されました。
        zh-CN: 工作负载事实没有变化；控制路线现在展示 kubelet 通过 API Server 观察已绑定 Pod。
      whyItHappened:
        en: kubelet is the Node agent responsible for Pods assigned to that Node and learns the assignment through API state.
        ja: kubelet はその Node に割り当てられた Pod を担当する Node agent であり、API state から割り当てを知るためです。
        zh-CN: 因为 kubelet 是负责本 Node 已分配 Pod 的 Node 代理，并通过 API 状态获知分配结果。
      takeaway:
        en: Scheduler records placement; the selected Node's kubelet observes it through the API.
        ja: Scheduler が配置を記録し、選ばれた Node の kubelet が API 経由でそれを監視します。
        zh-CN: Scheduler 记录放置结果，被选 Node 上的 kubelet 再通过 API 观察它。
    evidence:
      mode: snapshot
      entityIds:
        - runtime-component:cluster:global:KubeAPIServer:kube-apiserver
        - runtime-component:node:worker-c:Kubelet:kubelet
        - api-object:namespaced:shop:Pod:api-manifest-new
    introducesTerms: [node]
    usesTerms: [pod, node, binding, kubernetes-api]
