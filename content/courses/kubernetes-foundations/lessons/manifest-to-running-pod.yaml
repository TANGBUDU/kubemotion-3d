  view: control-flow
  cameraPresetId: control-flow
  resetEntities: true
  entityRules:
    - selector: { byCategory: infrastructure }
      visible: false
      emphasis: hidden
      labelMode: none
    - selector: { byCategory: api-object }
      visible: false
      emphasis: hidden
      labelMode: none
    - selector: { byCategory: runtime-status }
      visible: false
      emphasis: hidden
      labelMode: none
    - selector: { byCategory: runtime-component }
      visible: false
      emphasis: hidden
      labelMode: none
    - selector: { byCategory: external }
      visible: false
      emphasis: hidden
      labelMode: none
    - selector:
        byIds:
          - external:external:global:Kubectl:kubectl
          - runtime-component:cluster:global:KubeAPIServer:kube-apiserver
          - runtime-component:cluster:global:Etcd:etcd
