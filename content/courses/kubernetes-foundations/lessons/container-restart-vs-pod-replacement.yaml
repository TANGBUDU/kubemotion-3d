  - id: kubelet-starts-container
    title:
      en: kubelet starts the Container and readiness returns
      ja: kubelet が Container を起動し readiness が戻る
      zh-CN: kubelet 启动容器并恢复就绪
    learningOutcome:
      en: Attribute Container startup to kubelet after scheduling has completed.
      ja: スケジューリング完了後の Container 起動を kubelet の責務として説明する。
      zh-CN: 将调度完成后的容器启动归因于 kubelet。
    narration:
      en: kubelet on worker-c observes the assigned Pod through API state and starts its Container locally. The Container becomes running, the Pod becomes Running and ready, and ReplicaSet ready returns from 2 to 3.
      ja: worker-c の kubelet は API 状態から割り当て済み Pod を観測し、Container をローカルで起動します。Container は running、Pod は Running・ready になり、ReplicaSet ready は 2 から 3 に戻ります。
      zh-CN: worker-c 上的 kubelet 通过 API 状态观察到已分配的 Pod，并在本机启动其容器。容器变为 running，Pod 变为 Running 且 ready，ReplicaSet 就绪数从 2 恢复到 3。
    teaching:
      whatChanged:
        en: The waiting Container became running, the Pod became Running and ready, and ReplicaSet ready increased from 2 to 3.
        ja: waiting Container が running になり、Pod は Running・ready、ReplicaSet ready は 2 から 3 になりました。
        zh-CN: waiting 容器变为 running，Pod 变为 Running 且 ready，ReplicaSet 就绪数从 2 增加到 3。
      whyItHappened:
        en: kubelet on worker-c observed the assigned Pod through the API Server and started the Container on its Node.
        ja: worker-c の kubelet が API Server 経由で割り当て済み Pod を観測し、その Node 上で Container を起動したためです。
        zh-CN: worker-c 上的 kubelet 通过 API Server 观察到已分配的 Pod，并在本 Node 上启动了容器。
      takeaway:
        en: Scheduler assigns the Node; kubelet starts and maintains the assigned Pod's Containers.
        ja: Scheduler が Node を割り当て、kubelet が割り当て済み Pod の Container を起動・維持します。
        zh-CN: Scheduler 负责分配 Node，kubelet 负责启动并维护已分配 Pod 的容器。
    evidence:
