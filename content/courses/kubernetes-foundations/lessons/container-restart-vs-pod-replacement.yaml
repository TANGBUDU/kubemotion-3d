    title:
      en: ReplicaSet controller restores the missing replica
      ja: ReplicaSet controller が不足レプリカを復元する
      zh-CN: ReplicaSet 控制器恢复缺少的副本
    learningOutcome:
      en: Follow the controller's API-mediated observation and creation of a new Pod identity.
      ja: controller が API を介して不足を観測し、新しい Pod ID を作る流れを追う。
      zh-CN: 沿着 API 中介路径，观察控制器发现缺口并创建新 Pod 身份。
    narration:
      en: The ReplicaSet controller observes SPEC 3 versus OBSERVED 2 through API state and creates api-d-new. The new Pod has UID synthetic-uid-new-d1, phase Pending, no nodeName, and a waiting Container status; OBSERVED returns to 3 while READY remains 2.
      ja: Controller Manager 内の ReplicaSet controller は API 状態から SPEC 3 と OBSERVED 2 の差を観測し、api-d-new を作成します。新しい Pod は UID synthetic-uid-new-d1、phase Pending、nodeName なし、Container 状態は waiting で、OBSERVED は 3 に戻り READY は 2 のままです。
      zh-CN: Controller Manager 中的 ReplicaSet 控制器通过 API 状态观察到 SPEC 3 与 OBSERVED 2 的缺口，并创建 api-d-new。新 Pod 的 UID 为 synthetic-uid-new-d1，阶段为 Pending，没有 nodeName，容器状态为 waiting；OBSERVED 恢复到 3，READY 仍为 2。
    teaching:
      whatChanged:
        en: A new Pending, unscheduled, NotReady Pod and waiting Container status were created; ReplicaSet OBSERVED returned from 2 to 3.
        ja: 新しい Pending・未スケジュール・NotReady Pod と waiting Container 状態が作られ、ReplicaSet OBSERVED は 2 から 3 に戻りました。
        zh-CN: 新的 Pending、未调度、NotReady Pod 与 waiting 容器状态被创建，ReplicaSet OBSERVED 从 2 恢复到 3。
      whyItHappened:
        en: The ReplicaSet controller observed a replica deficit through the API Server and created a new Pod API object to restore desired count.
        ja: ReplicaSet controller が API Server 経由でレプリカ不足を観測し、desired 数を戻すため新しい Pod API オブジェクトを作成したためです。
        zh-CN: ReplicaSet 控制器通过 API Server 观察到副本缺口，并创建新的 Pod API 对象以恢复期望数量。
      takeaway:
        en: A controller restores desired state by creating a new Pod identity through the API.
        ja: controller は API を通じて新しい Pod ID を作り、desired state を復元します。
        zh-CN: 控制器通过 API 创建新的 Pod 身份来恢复期望状态。
