  - id: scheduler-binds-worker-c
    title:
      en: Scheduler binds the Pod to worker-c
      ja: Scheduler が Pod を worker-c に bind する
      zh-CN: Scheduler 将 Pod 绑定到 worker-c
    learningOutcome:
      en: Separate the scheduling decision from Container startup and readiness.
      ja: スケジューリング判断を Container 起動と readiness から区別する。
      zh-CN: 区分调度决策与容器启动、就绪。
    narration:
      en: Scheduler finds the unbound Pod and records worker-c through the API Server. The Pod now has nodeName worker-c and a placement relation, but phase remains Pending, its Container remains waiting, and ReplicaSet ready remains 2.
      ja: Scheduler は未 bind の Pod を見つけ、API Server 経由で worker-c を記録します。Pod は nodeName worker-c と配置関係を持ちますが、phase は Pending、Container は waiting、ReplicaSet ready は 2 のままです。
      zh-CN: Scheduler 找到尚未绑定的 Pod，并通过 API Server 记录 worker-c。Pod 现在有 nodeName worker-c 和放置关系，但阶段仍为 Pending，容器仍是 waiting，ReplicaSet 就绪数仍为 2。
    teaching:
      whatChanged:
        en: The Pending Pod gained nodeName worker-c and a scheduled-on relation, while its Container stayed waiting.
        ja: Pending Pod に nodeName worker-c と scheduled-on 関係が追加されましたが、Container は waiting のままです。
        zh-CN: Pending Pod 获得了 nodeName worker-c 和 scheduled-on 关系，但容器仍处于 waiting。
      whyItHappened:
        en: Scheduler selected a suitable Node and recorded the binding through the API Server; Scheduler did not start the Container.
        ja: Scheduler が適切な Node を選び API Server 経由で binding を記録したためで、Container を起動したのは Scheduler ではありません。
        zh-CN: Scheduler 选择了合适的 Node，并通过 API Server 记录绑定；Scheduler 并没有启动容器。
      takeaway:
        en: Node assignment is complete before Container startup and readiness.
        ja: Node 割り当ては Container 起動や readiness より先に完了します。
        zh-CN: Node 分配先于容器启动与就绪完成。
    evidence:
      mode: diff-with-context
      entityIds:
        - api-object:namespaced:shop:Pod:api-d-new
        - container-status:shop:Pod:api-d-new:Container:api
        - api-object:namespaced:shop:ReplicaSet:api-rs
    introducesTerms: [scheduling, binding]
    usesTerms: [scheduler, pod, node, kubernetes-api, replicaset]
    sourceIds: [k8s-components, k8s-api, k8s-pods, k8s-nodes, k8s-pod-lifecycle]
    worldPatch:
      operations:
        - op: patch-entity
          entityId: api-object:namespaced:shop:Pod:api-d-new
          patch:
            data:
              nodeName: worker-c
              conditions:
                podScheduled: true
                initialized: true
                containersReady: false
                ready: false
        - op: add-relation
          relation:
            id: scheduled-api-d-new
            type: scheduled-on
            from: api-object:namespaced:shop:Pod:api-d-new
            to: infrastructure:cluster:global:Node:worker-c
            directed: true
            semantic: placement
            title: { en: scheduled on, ja: 配置先, zh-CN: 调度到 }
            sourceIds: [k8s-nodes, k8s-components]
    viewPatch:
      view: control-flow
      cameraPresetId: control-flow
      resetEntities: false
      entityRules:
        - selector: { byIds: [runtime-component:cluster:global:Scheduler:kube-scheduler] }
          visible: true
          emphasis: focused
          labelMode: full
        - selector:
            byIds:
              - runtime-component:cluster:global:KubeAPIServer:kube-apiserver
              - api-object:namespaced:shop:Pod:api-d-new
              - infrastructure:cluster:global:Node:worker-c
          visible: true
          emphasis: normal
          labelMode: full
        - selector: { byIds: [container-status:shop:Pod:api-d-new:Container:api] }
          visible: true
          emphasis: normal
          labelMode: short
      relationRules:
        - byIds: [scheduler-watches-api-server, api-exposes-api-d-new, scheduled-api-d-new]
          visible: true
          emphasis: focused
      activeRoutes:
        - id: route-scheduler-bind-worker-c
          semantic: scheduling
          label: { en: bind to worker-c, ja: worker-c に bind, zh-CN: 绑定到 worker-c }
          persistAfterAnimation: true
          numbered: true
          hops:
            - fromEntityId: runtime-component:cluster:global:Scheduler:kube-scheduler
              fromAnchor: control
              toEntityId: runtime-component:cluster:global:KubeAPIServer:kube-apiserver
              toAnchor: control
              label: { en: choose Node, ja: Node を選択, zh-CN: 选择 Node }
            - fromEntityId: runtime-component:cluster:global:KubeAPIServer:kube-apiserver
              fromAnchor: control
              toEntityId: api-object:namespaced:shop:Pod:api-d-new
              toAnchor: control
              label: { en: record binding, ja: binding を記録, zh-CN: 记录绑定 }
            - fromEntityId: api-object:namespaced:shop:Pod:api-d-new
              fromAnchor: placement
