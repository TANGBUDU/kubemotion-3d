schemaVersion: 2
id: container-restart-vs-pod-replacement
scenarioId: container-restart-golden
chapterId: networking-resilience
title:
  {
    en: Container restart is not Pod replacement,
    ja: コンテナ再起動と Pod 置換の違い,
    zh-CN: 容器重启不等于 Pod 替换,
  }
summary:
  {
    en: Follow one Pod through an in-place container restart and then a real Pod replacement.,
    ja: 一つの Pod でコンテナの内部再起動と実際の Pod 置換を順に追います。,
    zh-CN: 依次观察同一 Pod 内的容器重启与真正的 Pod 替换。,
  }
learningOutcome:
  {
    en: 'Prove the difference using Pod identity, placement, container generation, and ReplicaSet counts.',
    ja: Pod の ID・配置・コンテナ世代・ReplicaSet 数を使って違いを説明する。,
    zh-CN: 使用 Pod 身份、放置位置、容器代次和 ReplicaSet 计数证明二者差异。,
  }
prerequisites: []
sourceIds: [k8s-pods, k8s-pod-lifecycle, k8s-replicasets, k8s-components, k8s-nodes]
verifiedAt: '2026-08-07'
baseView:
  view: placement
  cameraPresetId: placement
  resetEntities: true
  entityRules:
    - selector: { byKind: Node }
      visible: true
      emphasis: normal
      labelMode: full
    - selector: { byKind: Pod }
      visible: true
      emphasis: normal
      labelMode: short
    - selector: { byKind: Container }
      visible: true
      emphasis: normal
      labelMode: short
    - selector: { byKind: Kubelet }
      visible: true
      emphasis: dimmed
      labelMode: short
    - selector: { byKind: ReplicaSet }
      visible: true
      emphasis: normal
      labelMode: full
    - selector:
        byIds:
          - runtime-component:cluster:global:ControllerManager:kube-controller-manager
          - runtime-component:cluster:global:Scheduler:kube-scheduler
      visible: true
      emphasis: dimmed
      labelMode: full
  relationRules:
    - byType: owns
      visible: true
      emphasis: dimmed
    - byType: scheduled-on
      visible: true
      emphasis: normal
    - byType: contains-runtime
      visible: true
      emphasis: normal
steps:
  - id: healthy-pod
    title:
      {
        en: Establish the healthy identity,
        ja: healthy な ID を確認する,
        zh-CN: 确认健康状态下的身份,
      }
    learningOutcome:
      {
        en: 'Record the original Pod UID, Node, phase, container state, and replica counts.',
        ja: 元の Pod UID・Node・phase・コンテナ状態・レプリカ数を確認する。,
        zh-CN: 记录原始 Pod UID、Node、阶段、容器状态和副本计数。,
      }
    narration:
      {
        en: 'api-7f8d9-a is a Running Pod on worker-a. Its UID is synthetic-uid-old-a1; its api container is running with restart count 0. The ReplicaSet is at 3 desired, 3 current, and 3 ready.',
        ja: api-7f8d9-a は worker-a 上で Running の Pod です。UID は synthetic-uid-old-a1、api コンテナは再起動回数 0 で実行中です。ReplicaSet は desired 3・current 3・ready 3 です。,
        zh-CN: api-7f8d9-a 是 worker-a 上处于 Running 的 Pod，UID 为 synthetic-uid-old-a1；其 api 容器正在运行，重启次数为 0。ReplicaSet 为期望 3、当前 3、就绪 3。,
      }
    introducesTerms: [pod, node, replicaset, pod-uid, restart-count]
    usesTerms: []
    sourceIds: [k8s-pods, k8s-pod-lifecycle, k8s-replicasets, k8s-nodes]
    worldPatch:
      operations: []
    viewPatch:
      view: placement
      cameraPresetId: placement
      resetEntities: false
      entityRules:
        - selector: { byIds: [api-object:namespaced:shop:Pod:api-a-old] }
          visible: true
          emphasis: focused
          labelMode: full
          inspectorMode: expanded
        - selector: { byIds: [runtime-instance:shop:Pod:api-a-old:Container:api] }
          visible: true
          emphasis: focused
          labelMode: full
        - selector: { byIds: [api-object:namespaced:shop:ReplicaSet:api-rs] }
          visible: true
          emphasis: normal
          labelMode: full
    transition:
      cues:
        - type: focus-camera
          entityId: api-object:namespaced:shop:Pod:api-a-old
          durationMs: 700

  - id: container-exits
    title: { en: The container process exits, ja: コンテナプロセスが終了する, zh-CN: 容器进程退出 }
    learningOutcome:
      {
        en: Observe a failed child container without changing the Pod object.,
        ja: Pod オブジェクトを変えずに子コンテナの失敗を確認する。,
        zh-CN: 观察子容器失败，同时 Pod 对象保持不变。,
      }
    narration:
      {
        en: 'Only the api container terminates. The outer Pod remains api-a-old with the same UID on worker-a, and the ReplicaSet still reports 3/3/3.',
        ja: 終了するのは api コンテナだけです。外側の Pod は同じ UID の api-a-old として worker-a に残り、ReplicaSet も 3/3/3 のままです。,
        zh-CN: 只有 api 容器终止。外层 Pod 仍是 worker-a 上具有相同 UID 的 api-a-old，ReplicaSet 仍保持 3/3/3。,
      }
    introducesTerms: []
    usesTerms: [pod, pod-uid, restart-count]
    sourceIds: [k8s-pods, k8s-pod-lifecycle]
    worldPatch:
      operations:
        - op: patch-entity
          entityId: runtime-instance:shop:Pod:api-a-old:Container:api
          patch:
            status: terminated
    viewPatch:
      view: placement
      cameraPresetId: placement
      resetEntities: false
      entityRules:
        - selector: { byIds: [api-object:namespaced:shop:Pod:api-a-old] }
          visible: true
          emphasis: focused
          labelMode: full
          inspectorMode: expanded
        - selector: { byIds: [runtime-instance:shop:Pod:api-a-old:Container:api] }
          visible: true
          emphasis: focused
          labelMode: full
    transition:
      cues:
        - type: container-failure
          entityId: runtime-instance:shop:Pod:api-a-old:Container:api
          durationMs: 800

  - id: container-restarted
    title:
      {
        en: kubelet restarts the container in place,
        ja: kubelet が同じ Pod 内でコンテナを再起動する,
        zh-CN: kubelet 在同一 Pod 内重启容器,
      }
    learningOutcome:
      {
        en: Verify a new container generation inside the same Pod identity.,
        ja: 同じ Pod ID 内で新しいコンテナ世代が始まることを確認する。,
        zh-CN: 验证新一代容器在同一个 Pod 身份内启动。,
      }
    narration:
      {
        en: 'kubelet restarts the api container according to the Pod restart policy. The container returns to running, restart count changes from 0 to 1, and instance generation becomes 2. The Pod UID and worker-a placement do not change.',
        ja: kubelet は Pod の再起動ポリシーに従って api コンテナを再起動します。コンテナは running に戻り、再起動回数は 0 から 1、インスタンス世代は 2 になります。Pod UID と worker-a への配置は変わりません。,
        zh-CN: kubelet 根据 Pod 的重启策略重启 api 容器。容器恢复为 running，重启次数从 0 变为 1，实例代次变为 2；Pod UID 与 worker-a 放置位置都不变。,
      }
    introducesTerms: [restart-policy]
    usesTerms: [pod, pod-uid, restart-count, node]
    sourceIds: [k8s-pods, k8s-pod-lifecycle, k8s-components]
    worldPatch:
      operations:
        - op: patch-entity
          entityId: runtime-instance:shop:Pod:api-a-old:Container:api
          patch:
            status: running
            data:
              restartCount: 1
              instanceGeneration: 2
    viewPatch:
      view: placement
      cameraPresetId: placement
      resetEntities: false
      entityRules:
        - selector: { byIds: [runtime-component:node:worker-a:Kubelet:kubelet] }
          visible: true
          emphasis: focused
          labelMode: full
        - selector: { byIds: [api-object:namespaced:shop:Pod:api-a-old] }
          visible: true
          emphasis: focused
          labelMode: full
          inspectorMode: expanded
        - selector: { byIds: [runtime-instance:shop:Pod:api-a-old:Container:api] }
          visible: true
          emphasis: focused
          labelMode: full
      callouts:
        - id: same-pod-uid
          entityId: api-object:namespaced:shop:Pod:api-a-old
          text:
            {
              en: 'Same Pod UID: synthetic-uid-old-a1',
              ja: '同じ Pod UID: synthetic-uid-old-a1',
              zh-CN: '同一 Pod UID：synthetic-uid-old-a1',
            }
    transition:
      cues:
        - type: reconcile-pulse
          fromEntityId: runtime-component:node:worker-a:Kubelet:kubelet
          toEntityId: api-object:namespaced:shop:Pod:api-a-old
          durationMs: 650
        - type: container-restart
          entityId: runtime-instance:shop:Pod:api-a-old:Container:api
          durationMs: 900
        - type: counter-change
          entityId: runtime-instance:shop:Pod:api-a-old:Container:api
          field: data.restartCount
          from: 0
          to: 1
          durationMs: 700
        - type: callout
          entityId: api-object:namespaced:shop:Pod:api-a-old
          label: { en: Same Pod UID, ja: 同じ Pod UID, zh-CN: 同一 Pod UID }
          durationMs: 1000

  - id: pod-deleted
    title: { en: The whole Pod is deleted, ja: Pod 全体が削除される, zh-CN: 整个 Pod 被删除 }
    learningOutcome:
      {
        en: See the old Pod identity and all of its runtime composition leave the world.,
        ja: 古い Pod ID とそのランタイム構成全体が消えることを確認する。,
        zh-CN: 观察旧 Pod 身份及其整个运行时组成从世界中移除。,
      }
    narration:
      {
        en: 'This event removes the entire old Pod, its container, ownership edge, and worker-a scheduling edge. The ReplicaSet remains at desired 3 but drops to current 2 and ready 2.',
        ja: 今回は古い Pod 全体、そのコンテナ、所有関係、worker-a への配置関係が削除されます。ReplicaSet の desired は 3 のまま、current と ready は 2 に下がります。,
        zh-CN: 这次会移除整个旧 Pod、其容器、所有关系和到 worker-a 的调度关系。ReplicaSet 期望值仍为 3，当前与就绪都降为 2。,
      }
    introducesTerms: [desired-state]
    usesTerms: [pod, replicaset]
    sourceIds: [k8s-pods, k8s-pod-lifecycle, k8s-replicasets]
    worldPatch:
      operations:
        - op: remove-relation
          relationId: owns-api-a-old
        - op: remove-relation
          relationId: scheduled-api-a-old
        - op: remove-relation
          relationId: contains-api-a-old-container-api
        - op: remove-entity
          entityId: runtime-instance:shop:Pod:api-a-old:Container:api
        - op: remove-entity
          entityId: api-object:namespaced:shop:Pod:api-a-old
        - op: patch-entity
          entityId: api-object:namespaced:shop:ReplicaSet:api-rs
          patch:
            data:
              desiredReplicas: 3
              currentReplicas: 2
              readyReplicas: 2
    viewPatch:
      view: placement
      cameraPresetId: placement
      resetEntities: false
      entityRules:
        - selector: { byIds: [api-object:namespaced:shop:ReplicaSet:api-rs] }
          visible: true
          emphasis: focused
          labelMode: full
          inspectorMode: expanded
      callouts:
        - id: replica-deficit
          entityId: api-object:namespaced:shop:ReplicaSet:api-rs
          text: { en: Current 2 / Desired 3, ja: Current 2 / Desired 3, zh-CN: 当前 2 / 期望 3 }
    transition:
      cues:
        - type: entity-exit
          entityId: api-object:namespaced:shop:Pod:api-a-old
          durationMs: 850
        - type: counter-change
          entityId: api-object:namespaced:shop:ReplicaSet:api-rs
          field: data.currentReplicas
          from: 3
          to: 2
          durationMs: 650
        - type: counter-change
          entityId: api-object:namespaced:shop:ReplicaSet:api-rs
          field: data.readyReplicas
          from: 3
          to: 2
          durationMs: 650
        - type: callout
          entityId: api-object:namespaced:shop:ReplicaSet:api-rs
          label: { en: Current 2 / Desired 3, ja: Current 2 / Desired 3, zh-CN: 当前 2 / 期望 3 }
          durationMs: 1000

  - id: replacement-pending
    title:
      {
        en: The controller creates a new Pending Pod,
        ja: controller が新しい Pending Pod を作る,
        zh-CN: 控制器创建新的 Pending Pod,
      }
    learningOutcome:
      {
        en: Separate creation of a new Pod identity from scheduling it to a Node.,
        ja: 新しい Pod ID の作成と Node へのスケジューリングを区別する。,
        zh-CN: 区分创建新 Pod 身份与将其调度到 Node。,
      }
    narration:
      {
        en: Reconciliation creates api-d-new with UID synthetic-uid-new-d1. It is Pending and has no nodeName yet; its container is waiting. Current replicas return to 3 while ready remains 2. The old Pod does not return.,
        ja: 調整により UID synthetic-uid-new-d1 の api-d-new が作成されます。まだ nodeName のない Pending 状態で、コンテナは waiting です。current は 3 に戻りますが ready は 2 のままです。古い Pod は戻りません。,
        zh-CN: 协调过程创建 UID 为 synthetic-uid-new-d1 的 api-d-new。它仍是 Pending，尚无 nodeName，容器处于 waiting。当前副本恢复到 3，但就绪仍为 2；旧 Pod 不会回来。,
      }
    introducesTerms: [controller]
    usesTerms: [replicaset, pod, pod-uid, desired-state]
    sourceIds: [k8s-pods, k8s-pod-lifecycle, k8s-replicasets, k8s-components]
    worldPatch:
      operations:
        - op: add-entity
          entity:
            id: api-object:namespaced:shop:Pod:api-d-new
            category: api-object
            kind: Pod
            name: api-7f8d9-d
            namespace: shop
            labels: { app.kubernetes.io/name: api }
            status: pending
            data:
              uid: synthetic-uid-new-d1
              phase: Pending
              restartPolicy: Always
            title: { en: api-7f8d9-d Pod, ja: api-7f8d9-d Pod, zh-CN: api-7f8d9-d Pod }
            summary:
              {
                en: Newly created replacement Pod awaiting Node assignment.,
                ja: Node への割り当てを待つ、新しく作成された置換 Pod です。,
                zh-CN: 新创建、正在等待 Node 分配的替换 Pod。,
              }
            sourceIds: [k8s-pods, k8s-pod-lifecycle, k8s-replicasets]
            visual: { archetype: pod, size: md, group: api }
        - op: add-entity
          entity:
            id: runtime-instance:shop:Pod:api-d-new:Container:api
            category: runtime-instance
            kind: Container
            name: api
            namespace: shop
            status: waiting
            data:
              podId: api-object:namespaced:shop:Pod:api-d-new
              image: registry.example.invalid/shop/api:v1
              restartCount: 0
              instanceGeneration: 1
            title:
              {
                en: api container · api-7f8d9-d,
                ja: api コンテナ · api-7f8d9-d,
                zh-CN: api 容器 · api-7f8d9-d,
              }
            summary:
              {
                en: Waiting container instance inside the pending replacement Pod.,
                ja: Pending の置換 Pod 内で待機するコンテナインスタンスです。,
                zh-CN: Pending 替换 Pod 内等待中的容器实例。,
              }
            sourceIds: [k8s-pods, k8s-pod-lifecycle]
            visual: { archetype: container, size: sm, group: api-d-new }
        - op: add-relation
          relation:
            id: owns-api-d-new
            type: owns
            from: api-object:namespaced:shop:ReplicaSet:api-rs
            to: api-object:namespaced:shop:Pod:api-d-new
            directed: true
            semantic: ownership
            title: { en: owns, ja: 所有, zh-CN: 拥有 }
            sourceIds: [k8s-replicasets]
        - op: add-relation
          relation:
            id: contains-api-d-new-container-api
            type: contains-runtime
            from: api-object:namespaced:shop:Pod:api-d-new
            to: runtime-instance:shop:Pod:api-d-new:Container:api
            directed: true
            semantic: composition
            title: { en: contains runtime, ja: ランタイムを内包, zh-CN: 包含运行实例 }
            sourceIds: [k8s-pods]
        - op: patch-entity
          entityId: api-object:namespaced:shop:ReplicaSet:api-rs
          patch:
            data:
              desiredReplicas: 3
              currentReplicas: 3
              readyReplicas: 2
    viewPatch:
      view: placement
      cameraPresetId: placement
      resetEntities: false
      entityRules:
        - selector:
            byIds:
              - runtime-component:cluster:global:ControllerManager:kube-controller-manager
              - api-object:namespaced:shop:ReplicaSet:api-rs
              - api-object:namespaced:shop:Pod:api-d-new
              - runtime-instance:shop:Pod:api-d-new:Container:api
          visible: true
          emphasis: focused
          labelMode: full
        - selector: { byIds: [api-object:namespaced:shop:Pod:api-d-new] }
          visible: true
          emphasis: focused
          labelMode: full
          inspectorMode: expanded
      callouts:
        - id: new-pod-uid-pending
          entityId: api-object:namespaced:shop:Pod:api-d-new
          text:
            {
              en: 'New Pod UID: synthetic-uid-new-d1',
              ja: '新しい Pod UID: synthetic-uid-new-d1',
              zh-CN: '新 Pod UID：synthetic-uid-new-d1',
            }
    transition:
      cues:
        - type: reconcile-pulse
          fromEntityId: runtime-component:cluster:global:ControllerManager:kube-controller-manager
          toEntityId: api-object:namespaced:shop:ReplicaSet:api-rs
          durationMs: 800
        - type: entity-enter
          entityId: api-object:namespaced:shop:Pod:api-d-new
          durationMs: 850
        - type: counter-change
          entityId: api-object:namespaced:shop:ReplicaSet:api-rs
          field: data.currentReplicas
          from: 2
          to: 3
          durationMs: 650
        - type: relation-reveal
          relationId: owns-api-d-new
          durationMs: 600
        - type: relation-reveal
          relationId: contains-api-d-new-container-api
          durationMs: 600
        - type: callout
          entityId: api-object:namespaced:shop:Pod:api-d-new
          label: { en: New Pod UID, ja: 新しい Pod UID, zh-CN: 新 Pod UID }
          durationMs: 1000

  - id: replacement-running
    title:
      {
        en: Scheduler assigns worker-c and kubelet starts it,
        ja: scheduler が worker-c に割り当て kubelet が起動する,
        zh-CN: Scheduler 分配到 worker-c，kubelet 随后启动,
      }
    learningOutcome:
      {
        en: Verify that scheduling and startup happen after creation and can choose another Node.,
        ja: 作成後にスケジューリングと起動が行われ、別 Node を選べることを確認する。,
        zh-CN: 验证调度和启动发生在创建之后，并且可以选择另一 Node。,
      }
    narration:
      {
        en: 'The scheduler assigns api-d-new to worker-c. Its Pod phase becomes Running, its new container starts with restart count 0 and generation 1, and ready replicas return from 2 to 3. The removed old Pod stays absent.',
        ja: scheduler は api-d-new を worker-c に割り当てます。Pod phase は Running になり、新しいコンテナは再起動回数 0・世代 1 で起動し、ready は 2 から 3 に戻ります。削除された古い Pod は戻りません。,
        zh-CN: Scheduler 将 api-d-new 分配到 worker-c。Pod 阶段变为 Running，新容器以重启次数 0、实例代次 1 启动，就绪副本从 2 恢复到 3；已删除的旧 Pod 仍不存在。,
      }
    introducesTerms: [scheduler]
    usesTerms: [node, pod, pod-uid, restart-count, replicaset]
    sourceIds: [k8s-pods, k8s-pod-lifecycle, k8s-components, k8s-nodes, k8s-replicasets]
    worldPatch:
      operations:
        - op: patch-entity
          entityId: api-object:namespaced:shop:Pod:api-d-new
          patch:
            status: ready
            data:
              nodeName: worker-c
              phase: Running
        - op: patch-entity
          entityId: runtime-instance:shop:Pod:api-d-new:Container:api
          patch:
            status: running
        - op: add-relation
          relation:
            id: scheduled-api-d-new
            type: scheduled-on
            from: api-object:namespaced:shop:Pod:api-d-new
            to: infrastructure:cluster:global:Node:worker-c
            directed: true
            semantic: placement
            title: { en: scheduled on, ja: 配置先, zh-CN: 调度到 }
            sourceIds: [k8s-nodes, k8s-components]
        - op: patch-entity
          entityId: api-object:namespaced:shop:ReplicaSet:api-rs
          patch:
            data:
              desiredReplicas: 3
              currentReplicas: 3
              readyReplicas: 3
    viewPatch:
      view: placement
      cameraPresetId: placement
      resetEntities: false
      entityRules:
        - selector:
            byIds:
              - runtime-component:cluster:global:Scheduler:kube-scheduler
              - runtime-component:node:worker-c:Kubelet:kubelet
              - infrastructure:cluster:global:Node:worker-c
              - api-object:namespaced:shop:Pod:api-d-new
              - runtime-instance:shop:Pod:api-d-new:Container:api
          visible: true
          emphasis: focused
          labelMode: full
        - selector: { byIds: [api-object:namespaced:shop:Pod:api-d-new] }
          visible: true
          emphasis: focused
          labelMode: full
          inspectorMode: expanded
      relationRules:
        - byIds: [scheduled-api-d-new]
          visible: true
          emphasis: focused
      callouts:
        - id: new-pod-uid-running
          entityId: api-object:namespaced:shop:Pod:api-d-new
          text:
            {
              en: 'New Pod UID: synthetic-uid-new-d1',
              ja: '新しい Pod UID: synthetic-uid-new-d1',
              zh-CN: '新 Pod UID：synthetic-uid-new-d1',
            }
    transition:
      cues:
        - type: scheduler-assignment
          schedulerId: runtime-component:cluster:global:Scheduler:kube-scheduler
          podId: api-object:namespaced:shop:Pod:api-d-new
          nodeId: infrastructure:cluster:global:Node:worker-c
          durationMs: 1000
        - type: layout-transition
          durationMs: 900
        - type: relation-reveal
          relationId: scheduled-api-d-new
          durationMs: 650
        - type: counter-change
          entityId: api-object:namespaced:shop:ReplicaSet:api-rs
          field: data.readyReplicas
          from: 2
          to: 3
          durationMs: 650
        - type: callout
          entityId: api-object:namespaced:shop:Pod:api-d-new
          label: { en: New Pod UID, ja: 新しい Pod UID, zh-CN: 新 Pod UID }
          durationMs: 1000

  - id: compare-identities
    title:
      {
        en: Compare the two factual histories,
        ja: 二つの事実履歴を比較する,
        zh-CN: 比较两条事实历史,
      }
    learningOutcome:
      {
        en: Explain restart versus replacement from compiled world snapshots rather than narration alone.,
        ja: ナレーションだけでなくコンパイル済み world snapshot から再起動と置換を説明する。,
        zh-CN: 根据编译后的世界快照，而不是只靠旁白，解释重启与替换。,
      }
    narration:
