  - id: compare-identities
    title:
      en: Compare the two outcomes
      ja: 二つの結果を比較する
      zh-CN: 比较两种结果
    learningOutcome:
      en: Explain restart versus replacement from compiled snapshots and diffs.
      ja: コンパイル済み snapshot と diff から再起動と置換を説明する。
      zh-CN: 根据编译后的快照与差异解释重启和替换。
    narration:
      en: The Container restart kept api-a-old, synthetic-uid-old-a1, and worker-a while Container ID changed from ...-01 to ...-02 and restart count became 1. Pod replacement removed that Pod identity, created api-d-new with synthetic-uid-new-d1, scheduled it to worker-c, and started Container ID ...-d-new-01 at restart count 0.
      ja: Container 再起動では api-a-old・synthetic-uid-old-a1・worker-a を保ち、Container ID は ...-01 から ...-02、再起動回数は 1 になりました。Pod 置換ではその Pod ID を削除し synthetic-uid-new-d1 の api-d-new を作成、worker-c に配置し、Container ID ...-d-new-01 を再起動回数 0 で起動しました。
      zh-CN: 容器重启保留了 api-a-old、synthetic-uid-old-a1 和 worker-a，同时 Container ID 从 ...-01 变为 ...-02，重启次数变为 1。Pod 替换移除了原 Pod 身份，创建 UID 为 synthetic-uid-new-d1 的 api-d-new，将其调度到 worker-c，并以重启次数 0 启动 Container ID ...-d-new-01。
    teaching:
      whatChanged:
        en: No new fact changed; the comparison is derived from the restart and replacement snapshots.
        ja: 新しい事実変更はなく、再起動と置換の snapshot から比較を導出します。
        zh-CN: 没有新的事实变化；比较结果由重启与替换快照推导得出。
      whyItHappened:
        en: The two histories use different identity operations even though both end with a running Container.
        ja: どちらも最後は Container が running ですが、二つの履歴は異なる ID 操作を行ったためです。
        zh-CN: 虽然两条历史最终都有运行中的容器，但它们经历了不同的身份操作。
      takeaway:
        en: Restart preserves the Pod identity; replacement removes it and creates another Pod that may use a different Node.
        ja: 再起動は Pod ID を保ち、置換はそれを削除して別 Node になり得る新しい Pod を作ります。
        zh-CN: 重启保留 Pod 身份；替换会移除旧身份并创建可能位于另一 Node 的新 Pod。
    evidence:
      mode: snapshot
      entityIds:
        - api-object:namespaced:shop:Pod:api-d-new
        - container-status:shop:Pod:api-d-new:Container:api
        - api-object:namespaced:shop:ReplicaSet:api-rs
    introducesTerms: []
    usesTerms: [pod, pod-uid, restart-count, node, scheduling]
    sourceIds: [k8s-pods, k8s-pod-lifecycle, k8s-replicasets, k8s-nodes]
    worldPatch: { operations: [] }
    viewPatch:
      view: control-flow
      cameraPresetId: control-flow
      resetEntities: false
      entityRules:
        - selector: { byIds: [api-object:namespaced:shop:Pod:api-d-new] }
          visible: true
          emphasis: focused
          labelMode: full
          inspectorMode: expanded
        - selector: { byIds: [api-object:namespaced:shop:ReplicaSet:api-rs] }
          visible: true
          emphasis: normal
          labelMode: full
      activeRoutes: []
      comparison:
        type: container-restart-vs-pod-replacement
        restartStepId: container-restarted
        replacementStepId: kubelet-starts-container
    transition:
      cues:
        - type: focus-camera
          entityId: api-object:namespaced:shop:Pod:api-d-new
          durationMs: 600
