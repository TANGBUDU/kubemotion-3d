  - id: replacement-pending
    title:
      en: The new Pod is Pending and unscheduled
      ja: 新しい Pod は Pending で未スケジュール
      zh-CN: 新 Pod 处于 Pending 且尚未调度
    learningOutcome:
      en: Verify that Pod creation happens before Node assignment.
      ja: Pod 作成が Node 割り当てより先に起こることを確認する。
      zh-CN: 验证 Pod 创建发生在 Node 分配之前。
    narration:
      en: api-d-new now exists in the unscheduled tray with UID synthetic-uid-new-d1. It has phase Pending, no nodeName, and a waiting Container. The old Pod remains absent.
      ja: api-d-new は UID synthetic-uid-new-d1 で未スケジュールトレイに存在します。phase は Pending、nodeName はなく、Container は waiting です。古い Pod は存在しません。
      zh-CN: api-d-new 以 UID synthetic-uid-new-d1 出现在未调度托盘中。它的阶段是 Pending，没有 nodeName，容器处于 waiting；旧 Pod 仍不存在。
    teaching:
      whatChanged:
        en: No new fact changed after creation; this step isolates the new Pod's Pending and unscheduled state.
        ja: 作成後に新しい事実変更はなく、このステップでは新しい Pod の Pending・未スケジュール状態だけを示します。
        zh-CN: 创建后没有新的事实变化；本步骤单独强调新 Pod 的 Pending 与未调度状态。
      whyItHappened:
        en: Creating a Pod API object and assigning it to a Node are separate control-plane events.
        ja: Pod API オブジェクトの作成と Node への割り当ては別々のコントロールプレーンイベントだからです。
        zh-CN: 因为创建 Pod API 对象与将它分配到 Node 是两个独立的控制面事件。
      takeaway:
        en: Creation and scheduling are separate events.
        ja: 作成とスケジューリングは別々のイベントです。
        zh-CN: 创建与调度是两个独立事件。
    evidence:
      mode: snapshot
      entityIds:
        - api-object:namespaced:shop:Pod:api-d-new
        - container-status:shop:Pod:api-d-new:Container:api
        - api-object:namespaced:shop:ReplicaSet:api-rs
