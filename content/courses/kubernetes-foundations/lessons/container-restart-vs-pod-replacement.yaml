schemaVersion: 2
id: container-restart-vs-pod-replacement
scenarioId: container-restart-golden
chapterId: workloads-self-healing
title:
  en: Container restart is not Pod replacement
  ja: コンテナ再起動と Pod 置換の違い
  zh-CN: 容器重启不等于 Pod 替换
summary:
  en: Watch kubelet restart a runtime Container locally inside one Pod, then follow an intentional Pod deletion and API-mediated replacement.
  ja: kubelet が同じ Pod 内でランタイム Container をローカル再起動する流れと、その後に意図的な Pod 削除から API を介して置換される流れを追います。
  zh-CN: 先观察 kubelet 在同一 Pod 内本地重启运行时容器，再跟随一次主动 Pod 删除及其经由 API 完成的替换流程。
learningOutcome:
  en: Explain Container restart, Pod deletion, replacement creation, scheduling, and startup as separate factual events.
  ja: Container 再起動、Pod 削除、置換作成、スケジューリング、起動を別々の事実イベントとして説明する。
  zh-CN: 将容器重启、Pod 删除、替换创建、调度和启动解释为彼此独立的事实事件。
prerequisites: []
sourceIds:
  - k8s-pods
  - k8s-pod-lifecycle
  - k8s-pod-conditions
  - k8s-container-status-api
  - k8s-replicasets
  - k8s-replicaset-api
  - k8s-components
  - k8s-nodes
  - k8s-api
verifiedAt: '2026-08-08'
baseView:
  view: control-flow
  cameraPresetId: control-flow
  resetEntities: true
  entityRules:
    - selector: { byKind: Node }
      visible: true
      emphasis: normal
      labelMode: full
    - selector: { byKind: Pod }
      visible: true
      emphasis: dimmed
      labelMode: short
    - selector: { byKind: Container }
      visible: true
      emphasis: dimmed
      labelMode: none
    - selector: { byKind: Kubelet }
      visible: true
      emphasis: dimmed
      labelMode: none
    - selector: { byKind: ReplicaSet }
      visible: true
      emphasis: normal
      labelMode: full
    - selector:
        byIds:
          - runtime-component:cluster:global:KubeAPIServer:kube-apiserver
          - runtime-component:cluster:global:ControllerManager:kube-controller-manager
          - runtime-component:cluster:global:Scheduler:kube-scheduler
      visible: true
      emphasis: normal
      labelMode: full
  relationRules:
    - byType: owns
      visible: true
      emphasis: dimmed
    - byType: scheduled-on
      visible: true
      emphasis: dimmed

steps:
  - id: scene-orientation
    title:
      en: What you are looking at
      ja: このシーンで見るもの
      zh-CN: 先认识这个场景
    learningOutcome:
      en: Locate the control plane, workload state, worker Nodes, focused Pod, and contained Container.
      ja: コントロールプレーン、ワークロード状態、worker Node、注目 Pod、その Container を見つける。
      zh-CN: 找到控制面、工作负载状态、工作 Node、焦点 Pod 及其内部容器。
    narration:
      en: The control-plane components make decisions through the Kubernetes API. Worker Nodes run Pods, and this lesson follows the Container inside api-7f8d9-a while the surrounding objects preserve causal context.
      ja: コントロールプレーンのコンポーネントは Kubernetes API を通じて判断します。worker Node が Pod を実行し、このレッスンでは周囲の因果関係を残しながら api-7f8d9-a 内の Container を追います。
      zh-CN: 控制面组件通过 Kubernetes API 作出决策，工作 Node 运行 Pod；本课程在保留周围因果上下文的同时，追踪 api-7f8d9-a 内部的容器。
    teaching:
      whatChanged:
        en: Nothing has changed yet; the scene is organized into control-plane, workload-state, and worker-node zones.
        ja: まだ事実は変化しておらず、シーンをコントロールプレーン・ワークロード状態・worker Node の領域に整理しています。
        zh-CN: 事实尚未变化；场景被组织为控制面、工作负载状态和工作 Node 三个区域。
      whyItHappened:
        en: Orientation makes the API-mediated responsibilities visible before the lifecycle events begin.
        ja: ライフサイクルイベントの前に、API を介した各コンポーネントの責務を見えるようにするためです。
        zh-CN: 这是为了在生命周期事件开始前，先看清通过 API 协作的组件职责。
      takeaway:
        en: Control-plane components decide through the API, while worker Nodes run Pods and their Containers.
        ja: コントロールプレーンは API を通じて判断し、worker Node は Pod とその Container を実行します。
        zh-CN: 控制面组件通过 API 作出决策，工作 Node 运行 Pod 及其容器。
    evidence: { entityIds: [], mode: none }
    introducesTerms: [control-plane, kubernetes-api, node, pod, replicaset, controller, scheduler]
    usesTerms: []
    sourceIds: [k8s-components, k8s-api, k8s-pods, k8s-nodes, k8s-replicasets]
    worldPatch: { operations: [] }
    viewPatch:
      view: control-flow
      cameraPresetId: control-flow
      resetEntities: false
      entityRules:
        - selector: { byIds: [api-object:namespaced:shop:Pod:api-a-old] }
          visible: true
          emphasis: focused
          labelMode: short
        - selector: { byIds: [container-status:shop:Pod:api-a-old:Container:api] }
          visible: true
          emphasis: normal
          labelMode: short
      relationRules:
        - byIds:
            - controller-watches-api-server
            - scheduler-watches-api-server
            - kubelet-a-reports-api-server
            - api-exposes-api-rs
          visible: true
          emphasis: dimmed
      activeRoutes: []
    transition:
      cues:
        - type: focus-camera
          entityId: api-object:namespaced:shop:Pod:api-a-old
          durationMs: 600

  - id: healthy-baseline
    title:
      en: Establish the healthy baseline
      ja: healthy な基準状態を確認する
      zh-CN: 建立健康基线
    learningOutcome:
      en: Record the original Pod identity, placement, Container ID, restart count, and ReplicaSet counts.
      ja: 元の Pod ID・配置・Container ID・再起動回数・ReplicaSet 数を確認する。
      zh-CN: 记录原始 Pod 身份、放置位置、Container ID、重启次数和 ReplicaSet 计数。
    narration:
      en: api-7f8d9-a is Running and Ready on worker-a with UID synthetic-uid-old-a1. Its api Container has ID containerd://synthetic-api-a-old-01 and restart count 0, while the ReplicaSet is SPEC 3, OBSERVED 3, READY 3.
      ja: api-7f8d9-a は UID synthetic-uid-old-a1 で worker-a 上に Running・Ready です。api Container ID は containerd://synthetic-api-a-old-01、再起動回数は 0、ReplicaSet は SPEC 3・OBSERVED 3・READY 3 です。
      zh-CN: api-7f8d9-a 以 UID synthetic-uid-old-a1 在 worker-a 上处于 Running 且 Ready；api Container ID 为 containerd://synthetic-api-a-old-01，重启次数为 0，ReplicaSet 为 SPEC 3、OBSERVED 3、READY 3。
    teaching:
      whatChanged:
        en: Nothing has changed; this step records the factual baseline used by every later comparison.
        ja: 事実はまだ変化せず、後の比較に使う基準状態を記録します。
        zh-CN: 事实仍未变化；本步骤记录后续比较所需的事实基线。
      whyItHappened:
        en: Identity and counter values must be visible before a restart or replacement can be distinguished.
        ja: 再起動と置換を区別するには、その前の ID とカウンター値が必要です。
        zh-CN: 要区分重启与替换，必须先明确事件发生前的身份和计数值。
      takeaway:
        en: The baseline is one Pod UID on worker-a with Container ID ...-01 and zero restarts.
        ja: 基準は worker-a 上の一つの Pod UID、Container ID ...-01、再起動回数 0 です。
        zh-CN: 基线是 worker-a 上的一个 Pod UID、Container ID ...-01，以及零次重启。
    evidence:
      mode: snapshot
      entityIds:
        - container-status:shop:Pod:api-a-old:Container:api
        - api-object:namespaced:shop:Pod:api-a-old
        - api-object:namespaced:shop:ReplicaSet:api-rs
    introducesTerms: [pod-uid, restart-count]
    usesTerms: [pod, node, replicaset]
    sourceIds: [k8s-pods, k8s-pod-lifecycle, k8s-replicasets, k8s-nodes]
    worldPatch: { operations: [] }
    viewPatch:
      view: control-flow
      cameraPresetId: control-flow
      resetEntities: false
      entityRules:
        - selector: { byIds: [api-object:namespaced:shop:Pod:api-a-old] }
          visible: true
          emphasis: focused
          labelMode: full
          inspectorMode: expanded
        - selector: { byIds: [container-status:shop:Pod:api-a-old:Container:api] }
          visible: true
          emphasis: normal
          labelMode: short
        - selector: { byIds: [api-object:namespaced:shop:ReplicaSet:api-rs] }
          visible: true
          emphasis: normal
          labelMode: full
      activeRoutes: []
    transition:
      cues:
        - type: focus-camera
          entityId: api-object:namespaced:shop:Pod:api-a-old
          durationMs: 600

  - id: container-exits
    title:
      en: The Container process exits
      ja: Container プロセスが終了する
      zh-CN: 容器进程退出
    learningOutcome:
      en: Observe a terminated Container status while the Pod identity and phase stay unchanged but readiness drops.
      ja: Pod ID と phase を保ったまま Container が終了し、readiness と ReplicaSet READY が低下することを確認する。
      zh-CN: 观察容器终止，同时 Pod 身份和 phase 保持不变，而 readiness 与 ReplicaSet READY 下降。
    narration:
      en: The api runtime Container exits with Error. The Pod object stays Running with the same UID on worker-a, but ContainersReady and Ready become false; ReplicaSet READY drops from 3 to 2 while SPEC and OBSERVED remain 3.
      ja: api ランタイム Container は Error で終了します。Pod は同じ UID のまま worker-a 上で Running を保ちますが、ContainersReady と Ready は false になり、ReplicaSet は SPEC 3・OBSERVED 3 のまま READY が 3 から 2 に下がります。
      zh-CN: api 运行时容器因 Error 退出。Pod 仍以相同 UID 在 worker-a 上保持 Running，但 ContainersReady 与 Ready 变为 false；ReplicaSet 的 SPEC 3、OBSERVED 3 保持不变，READY 从 3 降为 2。
    teaching:
      whatChanged:
        en: Container state changed from running to terminated, the Pod became NotReady without changing phase, and ReplicaSet READY fell to 2.
        ja: Container state は running から terminated、Pod は phase を変えず NotReady、ReplicaSet READY は 2 になりました。
        zh-CN: Container state 从 running 变为 terminated；Pod phase 不变但成为 NotReady，ReplicaSet READY 降为 2。
      whyItHappened:
        en: The Container process exited, but no action deleted or replaced the Pod API object.
        ja: Container プロセスは終了しましたが、Pod API オブジェクトを削除・置換する操作はありません。
        zh-CN: 容器进程已经退出，但没有任何操作删除或替换 Pod API 对象。
      takeaway:
        en: A failed Container does not automatically mean a new Pod.
        ja: Container の失敗が自動的に新しい Pod を意味するわけではありません。
        zh-CN: 容器失败并不自动意味着产生了新的 Pod。
    evidence:
      mode: diff-with-context
      entityIds:
        - api-object:namespaced:shop:Pod:api-a-old
        - container-status:shop:Pod:api-a-old:Container:api
        - api-object:namespaced:shop:ReplicaSet:api-rs
    introducesTerms: []
    usesTerms: [pod, pod-uid, restart-count]
    sourceIds: [k8s-pods, k8s-pod-lifecycle]
    worldPatch:
      operations:
        - op: patch-entity
          entityId: container-status:shop:Pod:api-a-old:Container:api
          patch:
            status: terminated
            data:
              containerID: containerd://synthetic-api-a-old-01
              restartCount: 0
              ready: false
              started: false
              state:
                kind: terminated
                reason: Error
                exitCode: 1
                finishedAt: 2026-08-08T00:00:10Z
                containerID: containerd://synthetic-api-a-old-01
        - op: patch-entity
          entityId: api-object:namespaced:shop:Pod:api-a-old
          patch:
            status: not-ready
            data:
              conditions:
                podScheduled: true
                initialized: true
                containersReady: false
                ready: false
        - op: patch-entity
          entityId: api-object:namespaced:shop:ReplicaSet:api-rs
          patch:
            data: { specReplicas: 3, statusReplicas: 3, readyReplicas: 2 }
    viewPatch:
      view: control-flow
      cameraPresetId: control-flow
      resetEntities: false
      entityRules:
        - selector: { byIds: [api-object:namespaced:shop:Pod:api-a-old] }
          visible: true
          emphasis: focused
          labelMode: full
          inspectorMode: expanded
        - selector: { byIds: [container-status:shop:Pod:api-a-old:Container:api] }
          visible: true
          emphasis: normal
          labelMode: short
      activeRoutes: []
    transition:
      cues:
        - type: container-failure
          entityId: container-status:shop:Pod:api-a-old:Container:api
          durationMs: 800
        - type: counter-change
          entityId: api-object:namespaced:shop:ReplicaSet:api-rs
          field: data.readyReplicas
          from: 3
          to: 2
          delayMs: 520
          durationMs: 480

  - id: container-restarted
    title:
      en: kubelet restarts the Container in the same Pod
      ja: kubelet が同じ Pod 内で Container を再起動する
      zh-CN: kubelet 在同一 Pod 内重启容器
    learningOutcome:
      en: Verify a replacement runtime Container ID while Pod UID and Node placement stay unchanged.
      ja: Pod UID と Node 配置を保ったままランタイム Container ID が置き換わることを確認する。
      zh-CN: 验证运行时 Container ID 被替换，同时 Pod UID 和 Node 放置位置保持不变。
    narration:
      en: kubelet starts a replacement runtime Container inside the same Pod. Container ID changes from ...-01 to ...-02 and restartCount becomes 1 while the Pod stays on worker-a with the same UID; Pod readiness and ReplicaSet READY return to 3.
      ja: kubelet は同じ Pod 内で代替ランタイム Container を起動します。Container ID は ...-01 から ...-02、再起動回数は 0 から 1 に変わりますが、Pod は同じ UID のまま worker-a に残り、Ready に戻ります。
      zh-CN: kubelet 在同一 Pod 内启动替代运行时容器。Container ID 从 ...-01 变为 ...-02，重启次数从 0 变为 1；Pod 仍以相同 UID 留在 worker-a，并恢复 Ready。
    teaching:
      whatChanged:
        en: The stable Container status slot now reports a new running runtime Container ID, restartCount 1, and the previous Error in lastState.
        ja: 安定した Container 状態スロットは、新しい実行中 Container ID、restartCount 1、直前の Error を lastState に記録します。
        zh-CN: 稳定的容器状态槽现在记录新的运行中 Container ID、restartCount 1，并在 lastState 中保留先前的 Error。
      whyItHappened:
        en: kubelet on worker-a maintains the assigned Pod and restarts its Container according to the Pod restart policy.
        ja: worker-a の kubelet が割り当て済み Pod を維持し、Pod の再起動ポリシーに従って Container を再起動したためです。
        zh-CN: worker-a 上的 kubelet 负责维护已分配的 Pod，并依据 Pod 重启策略重启其容器。
      takeaway:
        en: A Container restart replaces the runtime Container ID inside the same Pod; it does not replace the Pod UID or Node assignment.
        ja: Container 再起動では同じ Pod 内のランタイム Container ID が置き換わり、Pod UID と Node 配置は変わりません。
        zh-CN: 容器重启会替换同一 Pod 内的运行时 Container ID，但不会替换 Pod UID 或 Node 分配。
    evidence:
      mode: diff-with-context
      entityIds:
        - api-object:namespaced:shop:Pod:api-a-old
        - container-status:shop:Pod:api-a-old:Container:api
        - api-object:namespaced:shop:ReplicaSet:api-rs
    introducesTerms: [restart-policy]
    usesTerms: [pod, pod-uid, restart-count, node, kubernetes-api]
    sourceIds: [k8s-pods, k8s-pod-lifecycle, k8s-components, k8s-api]
    worldPatch:
      operations:
        - op: patch-entity
          entityId: container-status:shop:Pod:api-a-old:Container:api
          patch:
            status: running
            data:
              containerID: containerd://synthetic-api-a-old-02
              restartCount: 1
              ready: true
              started: true
              state:
                kind: running
                startedAt: 2026-08-08T00:00:12Z
              lastState:
                kind: terminated
                reason: Error
                exitCode: 1
                finishedAt: 2026-08-08T00:00:10Z
                containerID: containerd://synthetic-api-a-old-01
        - op: patch-entity
          entityId: api-object:namespaced:shop:Pod:api-a-old
          patch:
            status: ready
            data:
              conditions:
                podScheduled: true
                initialized: true
                containersReady: true
                ready: true
        - op: patch-entity
          entityId: api-object:namespaced:shop:ReplicaSet:api-rs
          patch:
            data: { specReplicas: 3, statusReplicas: 3, readyReplicas: 3 }
    viewPatch:
      view: control-flow
      cameraPresetId: control-flow
      resetEntities: false
      entityRules:
        - selector: { byIds: [api-object:namespaced:shop:Pod:api-a-old] }
          visible: true
          emphasis: focused
          labelMode: full
          inspectorMode: expanded
        - selector: { byIds: [runtime-component:node:worker-a:Kubelet:kubelet] }
          visible: true
          emphasis: normal
          labelMode: full
        - selector: { byIds: [container-status:shop:Pod:api-a-old:Container:api] }
          visible: true
          emphasis: normal
          labelMode: short
      relationRules:
        - byIds: [kubelet-a-reports-api-server, api-exposes-api-a-old]
          visible: true
          emphasis: dimmed
      activeRoutes:
        - id: route-kubelet-a-restart
          semantic: node-runtime
          label: { en: Local kubelet restart, ja: ローカル kubelet 再起動, zh-CN: kubelet 本机重启 }
          persistAfterAnimation: true
          numbered: true
          hops:
            - fromEntityId: runtime-component:node:worker-a:Kubelet:kubelet
              fromAnchor: control
              toEntityId: container-status:shop:Pod:api-a-old:Container:api
              toAnchor: control
              label: { en: restart locally, ja: ローカルで再起動, zh-CN: 在本机重启 }
    transition:
      cues:
        - type: node-runtime-restart
          routeId: route-kubelet-a-restart
          entityId: container-status:shop:Pod:api-a-old:Container:api
          durationMs: 700
        - type: counter-change
          entityId: container-status:shop:Pod:api-a-old:Container:api
          field: data.restartCount
          from: 0
          to: 1
          delayMs: 760
          durationMs: 520
        - type: counter-change
          entityId: api-object:namespaced:shop:ReplicaSet:api-rs
          field: data.readyReplicas
          from: 2
          to: 3
          delayMs: 760
          durationMs: 520

  - id: kubectl-delete-pod
    title:
      en: Intentionally delete the Pod
      ja: 比較のため Pod を意図的に削除する
      zh-CN: 为对比而主动删除 Pod
    learningOutcome:
      en: Distinguish an explicit Pod-deletion request from the earlier Container process exit.
      ja: 明示的な Pod 削除要求を、先ほどの Container プロセス終了と区別する。
      zh-CN: 区分明确的 Pod 删除请求与之前的容器进程退出。
    narration:
      en: For comparison, a synthetic kubectl actor intentionally requests Pod deletion through the API Server. The old Pod, its Container status slot, and their relations are removed, leaving SPEC 3, OBSERVED 2, READY 2.
      ja: 比較のため、合成 kubectl 操作者が API Server 経由で意図的に Pod 削除を要求します。古い Pod・Container 状態スロット・関係が削除され、ReplicaSet は SPEC 3・OBSERVED 2・READY 2 になります。
      zh-CN: 为了对比，虚构的 kubectl 操作者通过 API Server 主动请求删除 Pod。旧 Pod、其容器状态槽及相关关系被移除，ReplicaSet 变为 SPEC 3、OBSERVED 2、READY 2。
    teaching:
      whatChanged:
        en: The old Pod object and Container status slot were removed; ReplicaSet OBSERVED and READY counts fell from 3 to 2.
        ja: 古い Pod オブジェクトと Container 状態スロットが削除され、ReplicaSet の OBSERVED と READY は 3 から 2 に下がりました。
        zh-CN: 旧 Pod 对象和容器状态槽被移除，ReplicaSet 的 OBSERVED 与 READY 计数从 3 降为 2。
      whyItHappened:
        en: A deliberate kubectl request reached the API Server; this deletion was not caused by the earlier Container exit.
        ja: 意図的な kubectl 要求が API Server に届いたためで、先ほどの Container 終了が削除を起こしたわけではありません。
        zh-CN: 这是因为主动的 kubectl 请求到达了 API Server，而不是之前的容器退出导致了删除。
      takeaway:
        en: Pod replacement begins with removal of the old Pod identity, not with every Container crash.
        ja: Pod 置換は古い Pod ID の削除から始まり、すべての Container 障害で起こるわけではありません。
        zh-CN: Pod 替换始于旧 Pod 身份被移除，并非每次容器崩溃都会触发替换。
    evidence:
      mode: diff-with-context
      entityIds:
        - api-object:namespaced:shop:Pod:api-a-old
        - container-status:shop:Pod:api-a-old:Container:api
        - api-object:namespaced:shop:ReplicaSet:api-rs
    introducesTerms: [desired-state]
    usesTerms: [pod, pod-uid, replicaset, kubernetes-api]
    sourceIds: [k8s-api, k8s-pods, k8s-pod-lifecycle, k8s-replicasets]
    worldPatch:
      operations:
        - { op: remove-relation, relationId: owns-api-a-old }
        - { op: remove-relation, relationId: scheduled-api-a-old }
        - { op: remove-relation, relationId: contains-api-a-old-container-api }
        - { op: remove-relation, relationId: api-exposes-api-a-old }
        - { op: remove-entity, entityId: container-status:shop:Pod:api-a-old:Container:api }
        - { op: remove-entity, entityId: api-object:namespaced:shop:Pod:api-a-old }
        - op: patch-entity
          entityId: api-object:namespaced:shop:ReplicaSet:api-rs
          patch:
            data: { specReplicas: 3, statusReplicas: 2, readyReplicas: 2 }
    viewPatch:
      view: control-flow
      cameraPresetId: control-flow
      resetEntities: false
      entityRules:
        - selector: { byIds: [external:external:global:Kubectl:kubectl] }
          visible: true
          emphasis: focused
          labelMode: full
        - selector: { byIds: [runtime-component:cluster:global:KubeAPIServer:kube-apiserver] }
          visible: true
          emphasis: normal
          labelMode: full
        - selector: { byIds: [api-object:namespaced:shop:ReplicaSet:api-rs] }
          visible: true
          emphasis: normal
          labelMode: full
          inspectorMode: expanded
      relationRules:
        - byIds: [kubectl-requests-api-server]
          visible: true
          emphasis: focused
      activeRoutes:
        - id: route-kubectl-delete
          semantic: control
          label: { en: delete request, ja: 削除要求, zh-CN: 删除请求 }
