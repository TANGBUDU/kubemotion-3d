  activeRoutes: []

steps:
  - id: cluster-foundation
    title:
      en: One cluster, two areas of responsibility
      ja: 一つのクラスター、二つの責務領域
      zh-CN: 一个集群，两类职责区域
    learningOutcome:
      en: Locate the cluster boundary, control-plane island, and worker-node island.
      ja: クラスター境界、コントロールプレーン領域、worker Node 領域を見つける。
      zh-CN: 找到集群边界、控制面区域与工作节点区域。
    narration:
      en: A Kubernetes cluster combines a control plane with one or more worker Nodes. The foundation marks one system boundary, while the two islands keep decision-making separate from workload execution.
      ja: Kubernetes クラスターは、コントロールプレーンと一つ以上の worker Node から成ります。基盤は一つのシステム境界を示し、二つの領域は判断とワークロード実行を分けて示します。
      zh-CN: Kubernetes 集群由控制面和一个或多个工作 Node 组成。底盘表示同一个系统边界，两个区域则把决策职责与工作负载执行清楚分开。
    teaching:
      whatChanged:
        en: No Kubernetes state changed; the scene now exposes one cluster foundation with distinct control-plane and worker-node islands.
        ja: Kubernetes の状態は変化せず、一つのクラスター基盤上にコントロールプレーンと worker Node の領域を分けて表示しました。
        zh-CN: Kubernetes 状态没有变化；场景现在以同一集群底盘展示彼此分开的控制面与工作节点区域。
      whyItHappened:
        en: The cluster is one distributed system, but control responsibilities and execution locations are not the same thing.
        ja: クラスターは一つの分散システムですが、制御の責務と実行場所は同じものではないためです。
        zh-CN: 因为集群是一个分布式系统，但控制职责与执行位置并不是同一概念。
      takeaway:
        en: A cluster is a system boundary, not a single giant machine.
        ja: クラスターはシステム境界であり、一台の巨大な機械ではありません。
        zh-CN: 集群是系统边界，不是一台巨型机器。
