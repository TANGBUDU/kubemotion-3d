  - id: decisions-and-reconciliation
    title:
      en: Scheduler selects; controllers reconcile
      ja: Scheduler は選択し、controller は調整する
      zh-CN: Scheduler 负责选择，Controller 负责协调
    learningOutcome:
      en: Separate placement decisions from continuous reconciliation.
      ja: 配置先の判断と継続的な調整を区別する。
      zh-CN: 区分放置决策与持续协调。
    narration:
      en: The Scheduler selects a Node for an unassigned workload. Controllers compare current API state with desired state and act to close differences. Neither component is an application-traffic hop.
      ja: Scheduler は未割り当てのワークロードに対して Node を選びます。controller は現在の API 状態と望ましい状態を比較し、差を縮めるよう動きます。どちらもアプリ通信の中継点ではありません。
      zh-CN: Scheduler 为尚未分配的工作负载选择 Node。Controller 比较当前 API 状态与期望状态，并持续缩小差异；两者都不是业务流量的转发节点。
    teaching:
      whatChanged:
        en: No cluster fact changed; focus moved from API storage to the Scheduler and Controller Manager decision roles.
        ja: クラスターの事実は変化せず、API 保存から Scheduler と Controller Manager の判断責務へ焦点を移しました。
        zh-CN: 集群事实没有变化；焦点从 API 存储转向 Scheduler 与 Controller Manager 的决策职责。
      whyItHappened:
        en: Kubernetes divides selection and reconciliation into distinct control loops with different responsibilities.
        ja: Kubernetes は選択と調整を、責務の異なる制御ループに分けているためです。
        zh-CN: 因为 Kubernetes 把节点选择和状态协调划分为职责不同的控制循环。
      takeaway:
        en: The Scheduler chooses placement; controllers work toward desired state.
        ja: Scheduler は配置先を選び、controller は望ましい状態へ近づけます。
        zh-CN: Scheduler 选择放置位置，Controller 推动系统趋近期望状态。
    evidence:
      mode: snapshot
      entityIds:
