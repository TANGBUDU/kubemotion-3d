schemaVersion: 2
id: cluster-overview
scenarioId: container-restart-golden
chapterId: foundations
title:
  en: What a Kubernetes cluster contains
  ja: Kubernetes クラスターの構成
  zh-CN: Kubernetes 集群包含什么
summary:
  en: Build the cluster from a clear foundation, separating control-plane responsibilities from worker execution.
  ja: 明確な基盤からクラスターを組み立て、コントロールプレーンの責務と worker での実行を区別します。
  zh-CN: 从清晰底盘开始理解集群，区分控制面的职责与工作节点上的执行。
learningOutcome:
  en: Identify the cluster boundary, four core control-plane components, and worker Nodes without treating them as one machine.
  ja: クラスター境界、主要な四つのコントロールプレーンコンポーネント、worker Node を、一台の機械と混同せず識別する。
  zh-CN: 识别集群边界、四个核心控制面组件与工作 Node，不把它们误认为一台机器。
prerequisites: []
sourceIds:
  - k8s-cluster-architecture
  - k8s-components
  - k8s-api
  - k8s-nodes
  - k8s-pods
  - k8s-cri
