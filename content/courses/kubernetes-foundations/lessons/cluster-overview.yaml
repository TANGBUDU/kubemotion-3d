  - id: api-and-state-store
    title:
      en: The API Server is the cluster's API hub
      ja: API Server はクラスター API のハブ
      zh-CN: API Server 是集群 API 枢纽
    learningOutcome:
      en: Distinguish the API Server interface from etcd storage.
      ja: API Server のインターフェース責務と etcd の保存責務を区別する。
      zh-CN: 区分 API Server 的接口职责与 etcd 的存储职责。
    narration:
      en: The API Server exposes the Kubernetes API. etcd stores Kubernetes API data for the control plane; ordinary clients and components use the API Server instead of treating etcd as a public cluster endpoint.
      ja: API Server は Kubernetes API を公開します。etcd はコントロールプレーンのために Kubernetes API データを保存し、通常のクライアントやコンポーネントは etcd を公開入口として扱わず API Server を使います。
      zh-CN: API Server 对外提供 Kubernetes API。etcd 为控制面保存 Kubernetes API 数据；普通客户端和组件使用 API Server，而不会把 etcd 当成公开入口。
    teaching:
      whatChanged:
        en: No API object changed; visual focus moved to the API Server and etcd while worker Nodes were dimmed.
        ja: API オブジェクトは変化せず、worker Node を弱めて API Server と etcd に焦点を移しました。
        zh-CN: API 对象没有变化；视觉焦点转向 API Server 与 etcd，工作 Node 被弱化。
      whyItHappened:
        en: Separating API access from state storage prevents the false idea that every component talks directly to etcd.
        ja: API アクセスと状態保存を分けることで、すべてのコンポーネントが etcd に直接接続するという誤解を防げるためです。
        zh-CN: 把 API 访问与状态存储分开，可以避免“所有组件都直接连接 etcd”的误解。
      takeaway:
        en: Use the API Server as the Kubernetes API entry; understand etcd as the backing API-data store.
        ja: Kubernetes API の入口は API Server、API データの保存先は etcd と理解します。
        zh-CN: Kubernetes API 的入口是 API Server，etcd 是其后端数据存储。
    evidence:
      mode: snapshot
      entityIds:
        - runtime-component:cluster:global:KubeAPIServer:kube-apiserver
        - runtime-component:cluster:global:Etcd:etcd
