  - id: cluster-summary
    title:
      en: Read the cluster from foundation to workload
      ja: 基盤からワークロードまでクラスターを読む
      zh-CN: 从底盘到工作负载阅读集群
    learningOutcome:
      en: Summarize where cluster decisions are made and where Pods run.
      ja: クラスターの判断がどこで行われ、Pod がどこで実行されるかをまとめる。
      zh-CN: 总结集群决策在哪里作出、Pod 在哪里运行。
    narration:
      en: The control-plane island contains the API Server, etcd, Scheduler, and Controller Manager. Worker Nodes provide execution locations. They cooperate as one cluster without collapsing their distinct responsibilities into one machine.
      ja: コントロールプレーン領域には API Server、etcd、Scheduler、Controller Manager があります。worker Node は実行場所を提供します。別々の責務を一台の機械にまとめず、一つのクラスターとして協調します。
      zh-CN: 控制面区域包含 API Server、etcd、Scheduler 与 Controller Manager，工作 Node 提供执行位置。它们作为同一集群协作，但职责并不会合并成一台机器。
    teaching:
      whatChanged:
        en: No Kubernetes fact changed; the camera returned to the complete foundation-first overview.
        ja: Kubernetes の事実は変化せず、カメラが基盤優先の全体図へ戻りました。
        zh-CN: Kubernetes 事实没有变化；镜头回到完整的底盘优先总览。
      whyItHappened:
        en: Reassembling the separated responsibilities checks that the learner can read the whole cluster without losing the boundaries.
        ja: 分けて学んだ責務を再び組み合わせ、境界を失わずクラスター全体を読めるか確認するためです。
        zh-CN: 这是为了重新组合前面拆开的职责，并确认学习者仍能看清整体边界。
      takeaway:
        en: One cluster contains distinct control-plane and worker responsibilities.
        ja: 一つのクラスターには、別々のコントロールプレーン責務と worker 責務があります。
        zh-CN: 一个集群中包含彼此不同的控制面职责与工作节点职责。
    evidence:
      mode: snapshot
      entityIds:
