  - id: worker-execution
    title:
      en: Worker Nodes provide the execution chassis
      ja: worker Node が実行用シャーシを提供する
      zh-CN: 工作 Node 提供执行底盘
    learningOutcome:
      en: Recognize a Node, its kubelet and runtime, and a representative assigned Pod as one execution context.
      ja: Node、その kubelet と runtime、代表的な割り当て済み Pod を一つの実行文脈として識別する。
      zh-CN: 把 Node、其 kubelet 与运行时，以及一个已分配 Pod 识别为同一执行上下文。
    narration:
      en: A worker Node hosts assigned Pods. Its kubelet observes the Node's assignments, and the container runtime starts and manages Containers through a standard runtime interface. The focused Pod is workload state on worker-a, not part of the control plane.
      ja: worker Node は割り当て済み Pod をホストします。kubelet はその Node への割り当てを監視し、コンテナランタイムは標準のランタイムインターフェースを通じて Container を起動・管理します。注目 Pod は worker-a 上のワークロードであり、コントロールプレーンの一部ではありません。
      zh-CN: 工作 Node 承载已分配的 Pod。kubelet 观察本 Node 的分配，容器运行时通过标准运行时接口启动和管理 Container。焦点 Pod 是 worker-a 上的工作负载，并不属于控制面。
    teaching:
      whatChanged:
        en: No workload state changed; worker-a expanded to expose its kubelet, container runtime, and one assigned Pod.
        ja: ワークロード状態は変化せず、worker-a を展開して kubelet、コンテナランタイム、割り当て済み Pod を表示しました。
        zh-CN: 工作负载状态没有变化；worker-a 被展开，显示其 kubelet、容器运行时与一个已分配 Pod。
      whyItHappened:
        en: 'A Node is more than a label: it is the execution chassis whose local agents maintain assigned Pods.'
        ja: Node は単なるラベルではなく、ローカルエージェントが割り当て済み Pod を維持する実行用シャーシだからです。
        zh-CN: 因为 Node 不只是一个标签，而是由本地组件维护已分配 Pod 的执行底盘。
      takeaway:
        en: Control-plane components decide through API state; Node-local components run assigned Pods.
        ja: コントロールプレーンは API 状態を通じて判断し、Node ローカルのコンポーネントが割り当て済み Pod を実行します。
        zh-CN: 控制面组件通过 API 状态作出决策，Node 本地组件运行已分配的 Pod。
