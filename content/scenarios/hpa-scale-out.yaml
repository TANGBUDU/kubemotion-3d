schemaVersion: 2
scenarioId: hpa-scale-out
revision: 0
entities:
  - id: infrastructure:cluster:global:Node:worker-scale
    category: infrastructure
    kind: Node
    name: worker-scale
    status: ready
    data: { rackOrder: 1, podSlotCount: 6, allocatableCpuMillicores: 4000 }
    title: { en: worker-scale, ja: worker-scale, zh-CN: worker-scale }
    summary:
      en: Synthetic worker Node with room for the scale-out Pod.
      ja: スケールアウトする Pod を配置できる合成 worker Node です。
      zh-CN: 为扩容 Pod 预留空间的虚构工作 Node。
    sourceIds: [k8s-nodes, k8s-resources]
    visual: { archetype: node, size: xl, group: scale-placement }

  - id: runtime-component:cluster:global:KubeAPIServer:kube-apiserver
    category: runtime-component
    kind: KubeAPIServer
    name: kube-apiserver
    status: healthy
    data: { role: api-gateway, synthetic: true }
    title: { en: API Server, ja: API Server, zh-CN: API Server }
    summary:
      en: Receives the HPA scale write, Scheduler binding, and kubelet status updates.
      ja: HPA の scale 書き込み、Scheduler の binding、kubelet の状態更新を受け取ります。
      zh-CN: 接收 HPA 扩缩写入、Scheduler 绑定以及 kubelet 状态更新。
    sourceIds: [k8s-components, k8s-api]
    visual: { archetype: control-plane, size: lg, group: scale-control }

  - id: runtime-component:cluster:global:ControllerManager:kube-controller-manager
    category: runtime-component
    kind: ControllerManager
    name: kube-controller-manager
    status: healthy
    data: { controllers: [deployment, replicaset, endpointslice], synthetic: true }
    title: { en: Controller Manager, ja: Controller Manager, zh-CN: Controller Manager }
    summary:
      en: Runs the controllers that reconcile the changed replica count and endpoint membership.
      ja: 変更されたレプリカ数と endpoint メンバーシップを調整する controller を実行します。
      zh-CN: 运行用于协调副本数变化与 Endpoint 成员关系的控制器。
    sourceIds: [k8s-components, k8s-deployments, k8s-endpoint-slices]
    visual: { archetype: control-plane, size: lg, group: scale-control }

  - id: runtime-component:cluster:global:Scheduler:kube-scheduler
    category: runtime-component
    kind: Scheduler
    name: kube-scheduler
    status: healthy
    data: { role: binding-decision, synthetic: true }
    title: { en: Scheduler, ja: Scheduler, zh-CN: Scheduler }
    summary:
      en: Selects worker-scale for the new Pending Pod and records the binding through the API.
      ja: 新しい Pending Pod に worker-scale を選び、API を通じて binding を記録します。
      zh-CN: 为新的 Pending Pod 选择 worker-scale，并通过 API 记录绑定。
    sourceIds: [k8s-components, k8s-pods]
    visual: { archetype: control-plane, size: lg, group: scale-control }

  - id: runtime-component:node:worker-scale:Kubelet:kubelet
    category: runtime-component
    kind: Kubelet
    name: kubelet
    status: healthy
    data: { nodeName: worker-scale, role: assigned-pod-agent }
    title: { en: kubelet · worker-scale, ja: kubelet · worker-scale, zh-CN: kubelet · worker-scale }
    summary:
      en: Observes the bound Pod, asks the runtime to start its container, and reports readiness.
      ja: binding 済み Pod を監視し、runtime にコンテナ起動を依頼して readiness を報告します。
      zh-CN: 观察已绑定 Pod，要求运行时启动容器，并上报就绪状态。
    sourceIds: [k8s-components, k8s-pod-lifecycle, k8s-cri]
    visual: { archetype: runtime, size: sm, group: scale-placement }

  - id: runtime-component:node:worker-scale:ContainerRuntime:containerd
    category: runtime-component
    kind: ContainerRuntime
    name: containerd
    status: healthy
    data: { nodeName: worker-scale, cri: true, implementation: containerd }
    title: { en: container runtime, ja: container runtime, zh-CN: 容器运行时 }
    summary:
      en: Starts the new container only after kubelet observes the assigned Pod.
      ja: kubelet が割り当て済み Pod を確認した後にだけ、新しいコンテナを起動します。
      zh-CN: 仅在 kubelet 观察到已分配 Pod 后启动新容器。
    sourceIds: [k8s-cri, k8s-components]
    visual: { archetype: runtime, size: sm, group: scale-placement }

  - id: runtime-component:cluster:global:MetricSource:resource-metrics
    category: runtime-component
    kind: MetricSource
    name: resource-metrics
    status: healthy
    data:
      metricType: Resource
      resource: cpu
      targetType: Utilization
      targetUtilization: 60
      observedUtilization: 45
      sampleWindowSeconds: 60
      synthetic: true
    title: { en: CPU metric source, ja: CPU metric source, zh-CN: CPU 指标源 }
    summary:
      en: Synthetic resource metric sample used by the HPA calculation.
      ja: HPA の計算に使う合成 resource metric サンプルです。
      zh-CN: 供 HPA 计算使用的虚构资源指标样本。
    sourceIds: [k8s-hpa, k8s-resources]
    visual: { archetype: config, size: md, group: scale-control }

  - id: api-object:namespaced:shop:HorizontalPodAutoscaler:api
    category: api-object
    kind: HorizontalPodAutoscaler
    name: api
    namespace: shop
    labels: { app.kubernetes.io/name: api }
    status: ready
    data:
      scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
      minReplicas: 2
      maxReplicas: 5
      currentReplicas: 2
      desiredReplicas: 2
      metric: { type: Resource, resource: cpu, targetType: Utilization, target: 60, current: 45 }
      conditions: { ableToScale: true, scalingActive: true, scalingLimited: false }
    title: { en: api HPA, ja: api HPA, zh-CN: api HPA }
    summary:
      en: Computes a desired replica count and writes the Deployment scale target; it never starts containers directly.
      ja: 必要なレプリカ数を計算して Deployment の scale target を更新しますが、コンテナを直接起動しません。
      zh-CN: 计算期望副本数并写入 Deployment 扩缩目标；它不会直接启动容器。
    sourceIds: [k8s-hpa, k8s-api]
    visual: { archetype: config, size: lg, group: scale-control }

  - id: api-object:namespaced:shop:Deployment:api
    category: api-object
    kind: Deployment
    name: api
    namespace: shop
    labels: { app.kubernetes.io/name: api }
    status: ready
    data:
      desiredReplicas: 2
      readyReplicas: 2
      availableReplicas: 2
      updatedReplicas: 2
      strategy: RollingUpdate
      revision: 1
      version: v1
    title: { en: api Deployment, ja: api Deployment, zh-CN: api Deployment }
    summary:
      en: Scale target whose desired replica count begins at two.
      ja: desired replica 数が 2 から始まる scale target です。
      zh-CN: 初始期望副本数为两个的扩缩目标。
    sourceIds: [k8s-deployments, k8s-hpa]
    visual: { archetype: deployment, size: lg, group: scale-workload }

  - id: api-object:namespaced:shop:ReplicaSet:api-rs
    category: api-object
    kind: ReplicaSet
    name: api-rs
    namespace: shop
    labels: { app.kubernetes.io/name: api, pod-template-hash: synthetic-v1 }
    status: ready
    data: { specReplicas: 2, statusReplicas: 2, readyReplicas: 2, version: v1 }
    title: { en: api ReplicaSet, ja: api ReplicaSet, zh-CN: api ReplicaSet }
    summary:
      en: Initially owns two Ready Pods and later reconciles a third replica.
      ja: 最初は 2 つの Ready Pod を所有し、後で 3 つ目のレプリカを調整します。
      zh-CN: 初始拥有两个 Ready Pod，之后协调第三个副本。
    sourceIds: [k8s-replicasets, k8s-deployments]
    visual: { archetype: replicaset, size: lg, group: scale-workload }

  - id: api-object:namespaced:shop:Pod:load-client
    category: api-object
    kind: Pod
    name: load-client
    namespace: shop
    labels: { app.kubernetes.io/name: load-client }
    status: ready
    data:
      uid: synthetic-load-client-01
      nodeName: worker-scale
      phase: Running
      restartPolicy: Always
      conditions: { podScheduled: true, initialized: true, containersReady: true, ready: true }
      trafficRole: client
      podIP: 192.0.2.40
    title: { en: Load client Pod, ja: 負荷クライアント Pod, zh-CN: 负载客户端 Pod }
    summary:
      en: Synthetic in-cluster client that sends one request after capacity expands.
      ja: 容量拡大後に 1 つのリクエストを送る合成クラスタ内 client です。
      zh-CN: 在容量扩展后发送单个请求的虚构集群内客户端。
    sourceIds: [k8s-pods, k8s-services]
    visual: { archetype: pod, size: md, group: scale-traffic }

  - id: api-object:namespaced:shop:Pod:api-a
    category: api-object
    kind: Pod
    name: api-a
    namespace: shop
    labels: { app.kubernetes.io/name: api, pod-template-hash: synthetic-v1 }
    status: ready
    data:
      uid: synthetic-api-scale-a-01
      nodeName: worker-scale
      phase: Running
      restartPolicy: Always
      conditions: { podScheduled: true, initialized: true, containersReady: true, ready: true }
      podIP: 192.0.2.41
    title: { en: api-a Pod, ja: api-a Pod, zh-CN: api-a Pod }
    summary:
      { en: First Ready backend., ja: 1 つ目の Ready backend です。, zh-CN: 第一个 Ready 后端。 }
    sourceIds: [k8s-pods]
    visual: { archetype: pod, size: md, group: scale-backends }

  - id: container-status:shop:Pod:api-a:Container:api
    category: runtime-status
    kind: Container
    name: api
    namespace: shop
    status: running
    data:
      podId: api-object:namespaced:shop:Pod:api-a
      name: api
      image: registry.example.invalid/shop/api:v1
      containerID: containerd://synthetic-api-scale-a-01
      restartCount: 0
      ready: true
      started: true
      state: { kind: running, startedAt: '2026-08-08T00:00:00Z' }
    title: { en: api container A, ja: api container A, zh-CN: api 容器 A }
    summary:
      {
        en: Running container in api-a.,
        ja: api-a 内で動作するコンテナです。,
        zh-CN: api-a 内运行的容器。,
      }
    sourceIds: [k8s-pods, k8s-container-images]
    visual: { archetype: container, size: sm, group: api-a }

  - id: api-object:namespaced:shop:Pod:api-b
    category: api-object
    kind: Pod
    name: api-b
    namespace: shop
    labels: { app.kubernetes.io/name: api, pod-template-hash: synthetic-v1 }
    status: ready
    data:
      uid: synthetic-api-scale-b-01
      nodeName: worker-scale
      phase: Running
      restartPolicy: Always
      conditions: { podScheduled: true, initialized: true, containersReady: true, ready: true }
      podIP: 192.0.2.42
    title: { en: api-b Pod, ja: api-b Pod, zh-CN: api-b Pod }
    summary:
      { en: Second Ready backend., ja: 2 つ目の Ready backend です。, zh-CN: 第二个 Ready 后端。 }
    sourceIds: [k8s-pods]
    visual: { archetype: pod, size: md, group: scale-backends }

  - id: container-status:shop:Pod:api-b:Container:api
    category: runtime-status
    kind: Container
    name: api
    namespace: shop
    status: running
    data:
      podId: api-object:namespaced:shop:Pod:api-b
      name: api
      image: registry.example.invalid/shop/api:v1
      containerID: containerd://synthetic-api-scale-b-01
      restartCount: 0
      ready: true
      started: true
      state: { kind: running, startedAt: '2026-08-08T00:00:00Z' }
    title: { en: api container B, ja: api container B, zh-CN: api 容器 B }
    summary:
      {
        en: Running container in api-b.,
        ja: api-b 内で動作するコンテナです。,
        zh-CN: api-b 内运行的容器。,
      }
    sourceIds: [k8s-pods, k8s-container-images]
    visual: { archetype: container, size: sm, group: api-b }

  - id: api-object:namespaced:shop:Service:api
    category: api-object
    kind: Service
    name: api
    namespace: shop
    labels: { app.kubernetes.io/name: api }
    status: ready
    data:
      serviceType: ClusterIP
      clusterIP: 198.51.100.60
      syntheticAddress: true
      selector: { app.kubernetes.io/name: api }
      ports: [{ name: http, port: 8080, targetPort: 8080, protocol: TCP }]
      publishNotReadyAddresses: false
    title: { en: api Service, ja: api Service, zh-CN: api Service }
    summary:
      en: Stable entry whose eligible backend set grows from two Pods to three.
      ja: 利用可能な backend 集合が 2 Pod から 3 Pod に増える安定した入口です。
      zh-CN: 可用后端集合从两个 Pod 增至三个的稳定入口。
    sourceIds: [k8s-services, k8s-labels]
    visual: { archetype: service, size: lg, group: scale-traffic }

  - id: api-object:namespaced:shop:EndpointSlice:api-slice
    category: api-object
    kind: EndpointSlice
    name: api-slice
    namespace: shop
    labels: { kubernetes.io/service-name: api }
    status: ready
    data:
      addressType: IPv4
      serviceName: api
      ports: [{ name: http, port: 8080, protocol: TCP }]
      endpoints:
        - address: 192.0.2.41
          targetRef: api-object:namespaced:shop:Pod:api-a
          conditions: { ready: true, serving: true, terminating: false }
        - address: 192.0.2.42
          targetRef: api-object:namespaced:shop:Pod:api-b
          conditions: { ready: true, serving: true, terminating: false }
    title: { en: api EndpointSlice, ja: api EndpointSlice, zh-CN: api EndpointSlice }
    summary:
      en: Initially records the two Ready backend Pods eligible for Service traffic.
      ja: 最初は Service トラフィック対象の 2 つの Ready backend Pod を記録します。
      zh-CN: 初始记录两个可接收 Service 流量的 Ready 后端 Pod。
    sourceIds: [k8s-endpoint-slices, k8s-services]
    visual: { archetype: endpointslice, size: lg, group: scale-traffic }

relations:
  - id: metrics-reports-to-hpa
    type: reports-to
    from: runtime-component:cluster:global:MetricSource:resource-metrics
    to: api-object:namespaced:shop:HorizontalPodAutoscaler:api
    directed: true
    semantic: control-observation
    title: { en: reports CPU sample, ja: CPU sample を報告, zh-CN: 报告 CPU 样本 }
    sourceIds: [k8s-hpa]
  - id: hpa-watches-api-deployment
    type: watches
    from: api-object:namespaced:shop:HorizontalPodAutoscaler:api
    to: api-object:namespaced:shop:Deployment:api
    directed: true
    semantic: control-observation
    title: { en: scale target, ja: scale target, zh-CN: 扩缩目标 }
    sourceIds: [k8s-hpa]
  - id: controller-watches-api-server
    type: watches
    from: runtime-component:cluster:global:ControllerManager:kube-controller-manager
    to: runtime-component:cluster:global:KubeAPIServer:kube-apiserver
    directed: true
    semantic: control-observation
    title: { en: watches desired state, ja: desired state を監視, zh-CN: 观察期望状态 }
    sourceIds: [k8s-components]
  - id: scheduler-watches-api-server
    type: watches
    from: runtime-component:cluster:global:Scheduler:kube-scheduler
    to: runtime-component:cluster:global:KubeAPIServer:kube-apiserver
    directed: true
    semantic: control-observation
    title: { en: watches Pending Pods, ja: Pending Pod を監視, zh-CN: 观察 Pending Pod }
    sourceIds: [k8s-components, k8s-pods]
  - id: kubelet-reports-api-server
    type: reports-to
    from: runtime-component:node:worker-scale:Kubelet:kubelet
    to: runtime-component:cluster:global:KubeAPIServer:kube-apiserver
    directed: true
    semantic: control-observation
    title: { en: reports Pod status, ja: Pod status を報告, zh-CN: 上报 Pod 状态 }
    sourceIds: [k8s-components, k8s-pod-lifecycle]
  - id: kubelet-uses-container-runtime
    type: implemented-by
    from: runtime-component:node:worker-scale:Kubelet:kubelet
    to: runtime-component:node:worker-scale:ContainerRuntime:containerd
    directed: true
    semantic: control-observation
    title: { en: starts through CRI, ja: CRI 経由で起動, zh-CN: 通过 CRI 启动 }
    sourceIds: [k8s-cri]
  - id: deployment-owns-api-rs
    type: owns
    from: api-object:namespaced:shop:Deployment:api
    to: api-object:namespaced:shop:ReplicaSet:api-rs
    directed: true
    semantic: ownership
    title: { en: owns ReplicaSet, ja: ReplicaSet を所有, zh-CN: 拥有 ReplicaSet }
    sourceIds: [k8s-deployments]
  - id: api-rs-owns-api-a
    type: owns
    from: api-object:namespaced:shop:ReplicaSet:api-rs
    to: api-object:namespaced:shop:Pod:api-a
    directed: true
    semantic: ownership
    title: { en: owns api-a, ja: api-a を所有, zh-CN: 拥有 api-a }
    sourceIds: [k8s-replicasets]
  - id: api-rs-owns-api-b
    type: owns
    from: api-object:namespaced:shop:ReplicaSet:api-rs
    to: api-object:namespaced:shop:Pod:api-b
    directed: true
    semantic: ownership
    title: { en: owns api-b, ja: api-b を所有, zh-CN: 拥有 api-b }
    sourceIds: [k8s-replicasets]
  - id: load-client-on-worker-scale
    type: scheduled-on
    from: api-object:namespaced:shop:Pod:load-client
    to: infrastructure:cluster:global:Node:worker-scale
    directed: true
    semantic: placement
    title:
      { en: client on worker-scale, ja: client は worker-scale 上, zh-CN: 客户端位于 worker-scale }
    sourceIds: [k8s-pods, k8s-nodes]
  - id: api-a-on-worker-scale
    type: scheduled-on
    from: api-object:namespaced:shop:Pod:api-a
    to: infrastructure:cluster:global:Node:worker-scale
    directed: true
    semantic: placement
    title:
      { en: api-a on worker-scale, ja: api-a は worker-scale 上, zh-CN: api-a 位于 worker-scale }
    sourceIds: [k8s-pods, k8s-nodes]
  - id: api-b-on-worker-scale
    type: scheduled-on
    from: api-object:namespaced:shop:Pod:api-b
    to: infrastructure:cluster:global:Node:worker-scale
    directed: true
    semantic: placement
    title:
      { en: api-b on worker-scale, ja: api-b は worker-scale 上, zh-CN: api-b 位于 worker-scale }
    sourceIds: [k8s-pods, k8s-nodes]
  - id: api-a-contains-container
    type: contains-runtime
    from: api-object:namespaced:shop:Pod:api-a
    to: container-status:shop:Pod:api-a:Container:api
    directed: true
    semantic: composition
    title: { en: contains api container, ja: api container を内包, zh-CN: 包含 api 容器 }
    sourceIds: [k8s-pods]
  - id: api-b-contains-container
    type: contains-runtime
    from: api-object:namespaced:shop:Pod:api-b
    to: container-status:shop:Pod:api-b:Container:api
    directed: true
    semantic: composition
    title: { en: contains api container, ja: api container を内包, zh-CN: 包含 api 容器 }
    sourceIds: [k8s-pods]
  - id: service-selects-api-a
    type: selects
    from: api-object:namespaced:shop:Service:api
    to: api-object:namespaced:shop:Pod:api-a
    directed: true
    semantic: selection
    title: { en: selector matches api-a, ja: selector が api-a に一致, zh-CN: Selector 匹配 api-a }
    sourceIds: [k8s-services, k8s-labels]
  - id: service-selects-api-b
    type: selects
    from: api-object:namespaced:shop:Service:api
    to: api-object:namespaced:shop:Pod:api-b
    directed: true
    semantic: selection
    title: { en: selector matches api-b, ja: selector が api-b に一致, zh-CN: Selector 匹配 api-b }
    sourceIds: [k8s-services, k8s-labels]
  - id: api-slice-for-service
    type: contains-endpoint-for
    from: api-object:namespaced:shop:EndpointSlice:api-slice
    to: api-object:namespaced:shop:Service:api
    directed: true
    semantic: configuration
    title: { en: endpoints for api, ja: api の endpoint, zh-CN: api 的 Endpoint }
    sourceIds: [k8s-endpoint-slices, k8s-services]
  - id: api-slice-references-api-a
    type: references
    from: api-object:namespaced:shop:EndpointSlice:api-slice
    to: api-object:namespaced:shop:Pod:api-a
    directed: true
    semantic: endpoint-membership
    title: { en: Ready api-a endpoint, ja: Ready api-a endpoint, zh-CN: Ready api-a Endpoint }
    sourceIds: [k8s-endpoint-slices]
    data: { address: 192.0.2.41, ready: true, serving: true, terminating: false }
  - id: api-slice-references-api-b
    type: references
    from: api-object:namespaced:shop:EndpointSlice:api-slice
    to: api-object:namespaced:shop:Pod:api-b
    directed: true
    semantic: endpoint-membership
    title: { en: Ready api-b endpoint, ja: Ready api-b endpoint, zh-CN: Ready api-b Endpoint }
    sourceIds: [k8s-endpoint-slices]
    data: { address: 192.0.2.42, ready: true, serving: true, terminating: false }
