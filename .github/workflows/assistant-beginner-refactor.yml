name: Apply beginner teaching refactor

on:
  push:
    branches: [rebuild/world-state-engine]
    paths:
      - '.github/assistant/beginner-code.patch.gz.b64'
      - '.github/assistant/beginner-content.mjs.gz.b64'
      - '.github/assistant/beginner-refactor.trigger'
      - '.github/workflows/assistant-beginner-refactor.yml'

permissions:
  contents: write

concurrency:
  group: beginner-teaching-refactor
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: rebuild/world-state-engine
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply beginner-first teaching changes
        run: |
          base64 -d .github/assistant/beginner-code.patch.gz.b64 | gzip -d > /tmp/beginner-code.patch
          base64 -d .github/assistant/beginner-content.mjs.gz.b64 | gzip -d > /tmp/beginner-content.mjs
          git apply --check /tmp/beginner-code.patch
          git apply /tmp/beginner-code.patch
          node /tmp/beginner-content.mjs
          rm -f .github/assistant/beginner-code.part-1
          rm -f .github/assistant/beginner-code.part-2
          rm -f .github/assistant/beginner-code.patch.gz.b64
          rm -f .github/assistant/beginner-content.mjs.gz.b64
          rm -f .github/assistant/beginner-refactor.trigger
          rm -f .github/workflows/assistant-beginner-refactor.yml

      - run: pnpm format
      - run: git diff --check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm content:validate
      - run: pnpm test:unit --run
      - run: pnpm build

      - name: Commit beginner-first teaching refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: rebuild the course around beginner comprehension"
          git push origin HEAD:rebuild/world-state-engine
