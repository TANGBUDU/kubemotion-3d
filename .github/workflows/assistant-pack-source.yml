name: Apply hierarchy teaching rebuild

on:
  push:
    branches: [assistant/hierarchy-teaching-rebuild]

permissions:
  contents: write

concurrency:
  group: hierarchy-teaching-apply
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'apply hierarchy bundle')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: assistant/hierarchy-teaching-rebuild
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Apply and validate the hierarchy rebuild
        id: apply
        shell: bash
        run: |
          set +e
          : > hierarchy-validation.txt
          failed=0
          record() {
            name="$1"
            shift
            echo "===== $name =====" | tee -a hierarchy-validation.txt
            "$@" >> hierarchy-validation.txt 2>&1
            code=$?
            echo "RESULT $name: $code" | tee -a hierarchy-validation.txt
            if [ $code -ne 0 ]; then failed=1; fi
          }

          cat \
            .assistant/hierarchy-v2.patch.part00 \
            .assistant/hierarchy-v2.patch.part01 \
            .assistant/hierarchy-v2.patch.part02 \
            .assistant/hierarchy-v2.patch.part03 \
            .assistant/hierarchy-v2.patch.part04 \
            .assistant/hierarchy-v2.patch.part05 \
            .assistant/hierarchy-v2.patch.part06 \
            .assistant/hierarchy-v2.patch.part07 \
            > /tmp/hierarchy.patch.gz.b64
          echo 'dd6b05d5bf9821b121cb903619222016a696996ef3ea13d1fdb61777754d5348  /tmp/hierarchy.patch.gz.b64' | sha256sum -c - >> hierarchy-validation.txt 2>&1
          if [ $? -ne 0 ]; then failed=1; fi
          if [ $failed -eq 0 ]; then base64 -d /tmp/hierarchy.patch.gz.b64 > /tmp/hierarchy.patch.gz; fi
          if [ $failed -eq 0 ]; then
            echo 'b4342308b6ea27c01f4f425b6b42bfc614aab39635c936adc4dcd3ada781a7e8  /tmp/hierarchy.patch.gz' | sha256sum -c - >> hierarchy-validation.txt 2>&1
            if [ $? -ne 0 ]; then failed=1; fi
          fi
          if [ $failed -eq 0 ]; then gzip -dc /tmp/hierarchy.patch.gz > /tmp/hierarchy.patch; fi
          if [ $failed -eq 0 ]; then
            echo 'a4e306a0d9dcadc79b20d783ed37f3296c3df3988b350442ca4ea8d58da00a67  /tmp/hierarchy.patch' | sha256sum -c - >> hierarchy-validation.txt 2>&1
            if [ $? -ne 0 ]; then failed=1; fi
          fi

          if [ $failed -eq 0 ]; then record patch-check git apply --check /tmp/hierarchy.patch; fi
          if [ $failed -eq 0 ]; then record patch-apply git apply /tmp/hierarchy.patch; fi
          if [ $failed -eq 0 ]; then record install pnpm install --frozen-lockfile; fi
          if [ $failed -eq 0 ]; then
            record format-write pnpm format
            record diff-check git diff --check
            record format-check pnpm format:check
            record lint pnpm lint
            record typecheck pnpm typecheck
            record content pnpm content:validate
            record accuracy pnpm content:accuracy
            record unit pnpm test:unit --run tests/course/hpa-scale-out-raw.test.ts tests/renderer/hpa-hierarchy-layout.test.ts tests/renderer/layout-contracts.test.ts tests/components/serviceLearnPage.test.tsx
            record build pnpm build
            record playwright-install pnpm exec playwright install --with-deps chromium
            record hierarchy-e2e pnpm exec playwright test tests/e2e/hierarchy-teaching.spec.ts --project=desktop-1280-chromium
          fi

          mkdir -p review-artifacts
          if [ -d docs/review/evidence/hierarchy-teaching ]; then
            cp -R docs/review/evidence/hierarchy-teaching review-artifacts/
            rm -rf docs/review/evidence/hierarchy-teaching
          fi
          tar -czf review-artifacts/hierarchy-source.tar.gz \
            src content tests .github package.json pnpm-lock.yaml \
            tsconfig.json vite.config.ts playwright.config.ts \
            2>> hierarchy-validation.txt

          if [ $failed -eq 0 ]; then
            rm -rf .assistant
            rm -f .github/workflows/assistant-pack-source.yml
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git diff --cached --check >> hierarchy-validation.txt 2>&1
            if [ $? -ne 0 ]; then
              failed=1
              echo 'RESULT staged-diff-check: 1' | tee -a hierarchy-validation.txt
            else
              echo 'RESULT staged-diff-check: 0' | tee -a hierarchy-validation.txt
            fi
          fi
          if [ $failed -eq 0 ]; then
            git commit -m 'feat: make 3D hierarchy explicit for beginners' >> hierarchy-validation.txt 2>&1
            if [ $? -ne 0 ]; then failed=1; fi
          fi
          if [ $failed -eq 0 ]; then
            git push origin HEAD:assistant/hierarchy-teaching-rebuild >> hierarchy-validation.txt 2>&1
            if [ $? -ne 0 ]; then failed=1; fi
          fi

          cp hierarchy-validation.txt review-artifacts/hierarchy-validation.txt
          if [ $failed -eq 0 ]; then
            echo 'result=pass' >> "$GITHUB_OUTPUT"
            echo 'HIERARCHY VALIDATION PASS' | tee -a hierarchy-validation.txt
          else
            echo 'result=fail' >> "$GITHUB_OUTPUT"
            echo 'HIERARCHY VALIDATION FAILED — no source commit was pushed' | tee -a hierarchy-validation.txt
          fi
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hierarchy-review-${{ github.sha }}
          path: review-artifacts/
          if-no-files-found: warn
          retention-days: 3
      - name: Report without failing the workflow
        if: always()
        run: echo "Hierarchy apply result — ${{ steps.apply.outputs.result || 'unknown' }}"
