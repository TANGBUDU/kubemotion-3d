name: Assistant Apply Mobile Traffic Pass
on:
  push:
    branches: [rebuild/world-state-engine]
    paths:
      - .github/assistant/mobile-traffic-pass.patch
      - .github/workflows/assistant-mobile-traffic-apply.yml
permissions:
  contents: write
concurrency:
  group: assistant-mobile-traffic-pass
  cancel-in-progress: true
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: rebuild/world-state-engine
          fetch-depth: 0
      - name: Apply patch and remove one-shot files
        run: |
          git apply --check .github/assistant/mobile-traffic-pass.patch
          git apply .github/assistant/mobile-traffic-pass.patch
          rm .github/assistant/mobile-traffic-pass.patch
          rm .github/workflows/assistant-mobile-traffic-apply.yml
      - uses: pnpm/action-setup@v4
        with: { version: 11.16.0 }
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: git diff --check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm exec vitest --run tests/renderer/labels.test.ts tests/renderer/traffic-layouts.test.ts
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test tests/e2e/batch03-traffic-composition.spec.ts --project=desktop-1280-chromium
      - run: pnpm format
      - run: git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-traffic-pass-review-${{ github.sha }}
          path: docs/review/evidence/batch03/
          if-no-files-found: error
          retention-days: 7
      - name: Commit validated pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: improve mobile traffic readability"
          git push origin HEAD:rebuild/world-state-engine
