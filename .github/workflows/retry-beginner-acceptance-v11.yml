name: Retry and close beginner acceptance matrix

on:
  push:
    branches: [rebuild/world-state-engine]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beginner-acceptance-retry-v11
  cancel-in-progress: true

jobs:
  retry:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: rebuild/world-state-engine
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Refresh from the serialized branch and remove the prior finalizer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin rebuild/world-state-engine
          git reset --hard origin/rebuild/world-state-engine
          rm -f .github/workflows/finalize-beginner-acceptance-v10.yml
          git add -A
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m 'chore: retire previous beginner finalizer'
            git push origin HEAD:rebuild/world-state-engine
          fi

      - run: pnpm install --frozen-lockfile

      - name: Reassert the semantic readiness step and compact mobile projection
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/course/beginnerProjection.ts')
          t=p.read_text(encoding='utf-8')
          t=t.replace("  const maximum = step.view.view === 'placement' ? 4 : step.view.view === 'control-flow' ? 4 : 5;",'  const maximum = 3;')
          t=t.replace("          labelMode: shouldLabel ? (onRoute || isFocus ? 'full' : 'short') : 'none',","          labelMode:\n            state.labelMode !== 'none' && shouldLabel\n              ? onRoute || isFocus\n                ? 'full'\n                : 'short'\n              : 'none',")
          p.write_text(t,encoding='utf-8')
          PY

          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import path from 'node:path'; import YAML from 'yaml';
          const root='content/courses/kubernetes-foundations/lessons'; let found=false;
          for(const file of fs.readdirSync(root).filter(n=>n.endsWith('.yaml'))){
            const target=path.join(root,file);const raw=fs.readFileSync(target,'utf8');if(!raw.includes('api-a remains listed but becomes NotReady'))continue;
            const lesson=YAML.parse(raw);const step=(lesson.steps??[]).find(s=>s?.title?.en==='api-a remains listed but becomes NotReady'||JSON.stringify(s).includes('api-a remains listed but becomes NotReady'));if(!step)continue;found=true;
            step.viewPatch??={};step.viewPatch.activeRoutes=[];
            if(step.evidence){step.evidence.mode='snapshot';delete step.evidence.routeId;delete step.evidence.routeIds;const ids=Array.isArray(step.evidence.entityIds)?step.evidence.entityIds:[];if(ids.length===0){const visible=(step.viewPatch.entityRules??[]).flatMap(r=>r?.selector?.byIds??[]);const preferred=visible.filter(id=>id.includes('EndpointSlice')||id.includes('Pod:api-a'));step.evidence.entityIds=preferred.length?preferred:visible.slice(0,2);}}
            if(step.transition?.cues)step.transition.cues=step.transition.cues.filter(c=>{const type=String(c?.type??'');return !('routeId'in c)&&!type.includes('route')&&!type.includes('token');});
            fs.writeFileSync(target,YAML.stringify(lesson,{lineWidth:100}),'utf8');
          }
          if(!found)throw new Error('Readiness-only Service step not found.');
          NODE
          pnpm format

      - name: Run the complete matrix with one retry for browser and visual gates
        run: |
          set +e
          mkdir -p docs/review /tmp/beginner-retry
          : > /tmp/beginner-retry/all.log
          failed=''
          run_gate(){ name="$1"; shift; echo "===== $name =====" | tee -a /tmp/beginner-retry/all.log; "$@" >>/tmp/beginner-retry/all.log 2>&1; code=$?; if [ "$code" -ne 0 ]; then failed="$name"; return "$code"; fi; return 0; }
          run_retry(){ name="$1"; shift; run_gate "$name-attempt-1" "$@" && return 0; sleep 15; failed=''; run_gate "$name-attempt-2" "$@"; }

          run_gate whitespace git diff --check || true
          [ -z "$failed" ] && run_gate lint pnpm lint || true
          [ -z "$failed" ] && run_gate typecheck pnpm typecheck || true
          [ -z "$failed" ] && run_gate content-validation pnpm content:validate || true
          [ -z "$failed" ] && run_gate content-accuracy pnpm content:accuracy || true
          [ -z "$failed" ] && run_gate unit-tests pnpm test:unit --run || true
          [ -z "$failed" ] && run_gate build pnpm build || true
          [ -z "$failed" ] && run_retry playwright-install pnpm exec playwright install --with-deps chromium || true
          [ -z "$failed" ] && run_retry beginner-all-viewports pnpm exec playwright test tests/e2e/beginner-teaching.spec.ts || true
          [ -z "$failed" ] && run_retry focused-browser pnpm exec playwright test tests/e2e/batch03-traffic-composition.spec.ts tests/e2e/explore-selection.spec.ts tests/e2e/golden-timeline.spec.ts tests/e2e/flow-story-player.spec.ts --project=desktop-1280-chromium || true
          if [ -z "$failed" ] && node -e "const p=require('./package.json');process.exit(p.scripts?.['visual:m8']?0:1)"; then run_retry visual-m8 pnpm visual:m8 || true; fi

          rm -f .github/workflows/retry-beginner-acceptance-v11.yml
          rm -f .github/workflows/finalize-beginner-acceptance-v10.yml

          if [ -z "$failed" ]; then
            rm -f docs/review/BEGINNER_ACCEPTANCE_DIAGNOSTIC.md
            cat > docs/review/BEGINNER_ACCEPTANCE_STATUS.md <<EOF
          # Beginner acceptance status

          PASS — verified at $(date -u +%Y-%m-%dT%H:%M:%SZ) on \
          \`rebuild/world-state-engine\`.

          Passed: formatting and whitespace, lint, type checking, content validation,
          content accuracy, full unit tests, production build, beginner browser coverage across
          every configured viewport, the focused teaching/traffic browser suite, and the M8 visual
          curriculum gate when defined.
          EOF
            message='fix: close final beginner acceptance matrix'
          else
            rm -f docs/review/BEGINNER_ACCEPTANCE_STATUS.md
            {
              echo '# Beginner acceptance diagnostic'
              echo
              echo "Failed gate after retry: **$failed**"
              echo
              echo '```text'
              tail -n 320 /tmp/beginner-retry/all.log
              echo '```'
            } > docs/review/BEGINNER_ACCEPTANCE_DIAGNOSTIC.md
            message='chore: update beginner acceptance diagnostic after retry'
          fi

          git add -A
          git diff --cached --check
          git commit -m "$message"
          git push origin HEAD:rebuild/world-state-engine
          if [ -n "$failed" ]; then exit 1; fi
