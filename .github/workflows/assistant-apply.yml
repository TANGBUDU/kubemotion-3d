name: Assistant Apply Visual Patch
on:
  push:
    branches: [rebuild/world-state-engine]
    paths:
      - .github/assistant/visual-polish.patch
      - .github/workflows/assistant-apply.yml
permissions:
  contents: write
concurrency:
  group: assistant-apply-visual
  cancel-in-progress: true
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: rebuild/world-state-engine
          fetch-depth: 0
      - name: Apply visual polish patch
        run: |
          git apply --check .github/assistant/visual-polish.patch
          git apply .github/assistant/visual-polish.patch
          rm .github/assistant/visual-polish.patch
          rm .github/workflows/assistant-apply.yml
      - uses: pnpm/action-setup@v4
        with: { version: 11.16.0 }
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: git diff --check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Capture focused traffic review
        run: >-
          pnpm exec playwright test
          tests/e2e/batch03-traffic-composition.spec.ts
          --project=desktop-1280-chromium
      - run: pnpm format
      - run: git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assistant-visual-review-${{ github.sha }}
          path: docs/review/evidence/batch03/
          if-no-files-found: error
          retention-days: 7
      - name: Commit and push validated visual polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: reduce traffic visual noise"
          git push origin HEAD:rebuild/world-state-engine
