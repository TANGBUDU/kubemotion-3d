name: Apply mobile timeline positioning fix

on:
  push:
    branches: [rebuild/world-state-engine]

permissions:
  contents: write

concurrency:
  group: apply-mobile-timeline-positioning-fix
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: rebuild/world-state-engine
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Position the active mobile step immediately
        run: |
          python - <<'PY'
          from pathlib import Path

          component_path = Path('src/ui/lesson/StepTimeline.tsx')
          component = component_path.read_text(encoding='utf-8')
          component = component.replace("import { useAppStore } from '../../state/appStore';\n", '', 1)
          old_state = '''  const t = lessonUi(locale);
            const reducedMotion = useAppStore((state) => state.reducedMotion);
            const reducedMotionRef = useRef(reducedMotion);
            const scrollRef = useRef<HTMLDivElement>(null);
            const activeStepRef = useRef<HTMLButtonElement>(null);

            useEffect(() => {
              reducedMotionRef.current = reducedMotion;
            }, [reducedMotion]);'''
          new_state = '''  const t = lessonUi(locale);
            const scrollRef = useRef<HTMLDivElement>(null);
            const activeStepRef = useRef<HTMLButtonElement>(null);'''
          if old_state not in component:
              raise SystemExit('StepTimeline state insertion point is missing')
          component = component.replace(old_state, new_state, 1)
          old_scroll = "container.scrollTo({ left, behavior: reducedMotionRef.current ? 'auto' : 'smooth' });"
          new_scroll = "container.scrollTo({ left, behavior: 'auto' });"
          if old_scroll not in component:
              raise SystemExit('StepTimeline scroll behavior insertion point is missing')
          component_path.write_text(component.replace(old_scroll, new_scroll, 1), encoding='utf-8')

          test_path = Path('tests/components/stepTimeline.test.tsx')
          tests = test_path.read_text(encoding='utf-8')
          tests = tests.replace(
              "import { act, render, screen } from '@testing-library/react';",
              "import { render, screen } from '@testing-library/react';",
              1,
          )
          tests = tests.replace("import { useAppStore } from '../../src/state/appStore';\n", '', 1)
          tests = tests.replace("    useAppStore.setState({ locale: 'en', reducedMotion: true });\n\n", '', 1)
          old_motion = '''    act(() => useAppStore.setState({ reducedMotion: false }));
              expect(scrollTo).toHaveBeenCalledTimes(callCount);

          '''
          if old_motion not in tests:
              raise SystemExit('StepTimeline reduced-motion test block is missing')
          tests = tests.replace(old_motion, '', 1)
          tests = tests.replace(
              "expect(scrollTo).toHaveBeenLastCalledWith({ left: 140, behavior: 'smooth' });",
              "expect(scrollTo).toHaveBeenLastCalledWith({ left: 140, behavior: 'auto' });",
          )
          tests = tests.replace(
              "it('positions only when the lesson or step changes without stealing focus', () => {",
              "it('positions immediately when the lesson or step changes without stealing focus', () => {",
              1,
          )
          test_path.write_text(tests, encoding='utf-8')

          e2e_path = Path('tests/e2e/beginner-teaching.spec.ts')
          e2e = e2e_path.read_text(encoding='utf-8')
          anchor = '''  await expect(page.getByTestId('teaching-plain-language')).toBeVisible();
            await page.evaluate(() => window.scrollTo(0, 0));
            await page.screenshot({ path: `${reviewDir}/15-mobile-first-screen.png`, fullPage: false });'''
          replacement = '''  await expect(page.getByTestId('teaching-plain-language')).toBeVisible();
            const activeTimelineStep = page.locator('.timeline-scroll button[aria-current="step"]');
            await expect(activeTimelineStep).toHaveText('1');
            const activeStepIsInsideScroller = await activeTimelineStep.evaluate((element) => {
              const scroller = element.closest('.timeline-scroll');
              if (!scroller) return false;
              const elementRect = element.getBoundingClientRect();
              const scrollerRect = scroller.getBoundingClientRect();
              return elementRect.left >= scrollerRect.left && elementRect.right <= scrollerRect.right;
            });
            expect(activeStepIsInsideScroller).toBe(true);
            await page.evaluate(() => window.scrollTo(0, 0));
            await page.screenshot({ path: `${reviewDir}/15-mobile-first-screen.png`, fullPage: false });'''
          if anchor not in e2e:
              raise SystemExit('Mobile timeline E2E insertion point is missing')
          e2e_path.write_text(e2e.replace(anchor, replacement, 1), encoding='utf-8')

          gate_path = Path('docs/review/BEGINNER_TEACHING_GATES.md')
          gates = gate_path.read_text(encoding='utf-8')
          gate_anchor = '- Provide a visible Home action on every lesson and story page.\n'
          gate_replacement = (
              '- Provide a visible Home action on every lesson and story page.\n'
              '- On mobile, the current step must be visible inside the timeline immediately after navigation.\n'
          )
          if gate_anchor not in gates:
              raise SystemExit('Timeline gate insertion point is missing')
          gate_path.write_text(gates.replace(gate_anchor, gate_replacement, 1), encoding='utf-8')
          PY
      - run: pnpm format
      - run: git diff --check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit --run tests/components/stepTimeline.test.tsx
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run mobile beginner browser acceptance
        run: >-
          pnpm exec playwright test
          tests/e2e/beginner-teaching.spec.ts
          --project=desktop-1280-chromium
      - run: rm -f .github/workflows/apply-mobile-timeline-fix.yml
      - name: Commit mobile timeline positioning fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: keep the active mobile step visible'
          git push origin HEAD:rebuild/world-state-engine
