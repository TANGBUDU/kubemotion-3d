name: Apply beginner teaching contract fixes

on:
  push:
    branches: [rebuild/world-state-engine]

permissions:
  contents: write

concurrency:
  group: apply-beginner-teaching-contract-fixes
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: rebuild/world-state-engine
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply beginner teaching contract fixes
        shell: bash
        run: |
          cat > /tmp/beginner-contract-fixes.patch.gz.b64 <<'PATCH_B64'

PATCH_B64
          base64 --decode /tmp/beginner-contract-fixes.patch.gz.b64 > /tmp/beginner-contract-fixes.patch.gz
          echo '2bd7b72fcfe5f252e95b06de811da4ae5ef7092b0a93ffbf8140a11cd574b63a  /tmp/beginner-contract-fixes.patch.gz' | sha256sum --check -
          gzip --decompress --stdout /tmp/beginner-contract-fixes.patch.gz > /tmp/beginner-contract-fixes.patch
          git apply --check /tmp/beginner-contract-fixes.patch
          git apply /tmp/beginner-contract-fixes.patch
          rm -f .github/workflows/apply-beginner-contract-fixes.yml
      - run: pnpm format
      - run: git diff --check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm content:validate
      - run: pnpm content:accuracy
      - run: pnpm test:unit --run
      - run: pnpm build
      - name: Commit verified beginner teaching fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: align beginner teaching contracts'
          git push origin HEAD:rebuild/world-state-engine
