name: Apply final persistent playground review

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  review:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python .assistant/finalize_persistent_playground.py
      - run: pnpm format
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm content:validate
      - run: pnpm content:accuracy
      - run: pnpm test:unit --run
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test tests/e2e/homePlayground.spec.ts
      - name: Upload final browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persistent-playground-final-qa
          path: |
            test-results
            playwright-report
          if-no-files-found: warn
          retention-days: 7
      - name: Clean one-shot review files
        if: success()
        run: |
          rm -f .assistant/finalize_persistent_playground.py
          rm -f .github/workflows/home-playground-qa.yml
          rm -f .github/workflows/finalize-persistent-playground.yml
          rm -f .github/workflows/apply-final-playground.yml
      - name: Commit reviewed final source
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Polish persistent Kubernetes homepage playground"
          git push origin HEAD:main
