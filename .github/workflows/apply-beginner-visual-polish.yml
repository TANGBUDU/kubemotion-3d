name: Apply beginner visual polish

on:
  push:
    branches: [rebuild/world-state-engine]

permissions:
  contents: write

concurrency:
  group: apply-beginner-visual-polish
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: rebuild/world-state-engine
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Name the scheduling decision and keep completion titles inside their card
        run: |
          python - <<'PY'
          from pathlib import Path

          lesson_path = Path('content/courses/kubernetes-foundations/lessons/why-kubernetes-exists.yaml')
          lesson = lesson_path.read_text(encoding='utf-8')
          old_label = '''                en: submit the selected Node
                          ja: 選択した Node を送信
                          zh-CN: 提交所选 Node'''
          new_label = '''                en: submit the worker-c choice
                          ja: worker-c の選択結果を送信
                          zh-CN: 提交 worker-c 选择结果'''
          if old_label not in lesson:
              raise SystemExit('Scheduler route label insertion point is missing')
          lesson_path.write_text(lesson.replace(old_label, new_label, 1), encoding='utf-8')

          css_path = Path('src/styles/lesson-completion.css')
          css = css_path.read_text(encoding='utf-8')
          old_heading = '''.lesson-completion-heading {
            display: flex;
            min-width: 0;
            align-items: center;
            gap: 10px;
          }

          .lesson-completion-heading > span {'''
          new_heading = '''.lesson-completion-heading {
            display: flex;
            min-width: 0;
            align-items: center;
            gap: 10px;
          }

          .lesson-completion-heading > div {
            min-width: 0;
          }

          .lesson-completion-heading > span {'''
          if old_heading not in css:
              raise SystemExit('Completion heading insertion point is missing')
          css = css.replace(old_heading, new_heading, 1)
          old_title = '''.lesson-completion-heading h2 {
            overflow: hidden;
            margin-top: 3px;
            color: var(--text-primary);
            font-size: 14px;
            line-height: 1.25;
            text-overflow: ellipsis;
            white-space: nowrap;
          }'''
          new_title = '''.lesson-completion-heading h2 {
            overflow: visible;
            max-width: 100%;
            margin-top: 3px;
            color: var(--text-primary);
            font-size: 14px;
            line-height: 1.25;
            overflow-wrap: anywhere;
            text-overflow: clip;
            white-space: normal;
          }'''
          if old_title not in css:
              raise SystemExit('Completion title style insertion point is missing')
          css_path.write_text(css.replace(old_title, new_title, 1), encoding='utf-8')

          e2e_path = Path('tests/e2e/beginner-teaching.spec.ts')
          e2e = e2e_path.read_text(encoding='utf-8')
          scheduler_anchor = '''  await expect(page.locator('.scene-legend')).toContainText(/control command/i);
            await expect(page.getByTestId('component-explanation')).toContainText(/choose|Node/i);'''
          scheduler_replacement = '''  await expect(page.locator('.scene-legend')).toContainText(/control command/i);
            await expect(page.locator('.scene-route-label:not([hidden])').first()).toContainText(/worker-c/i);
            await expect(page.getByTestId('component-explanation')).toContainText(/choose|Node/i);'''
          if scheduler_anchor not in e2e:
              raise SystemExit('English scheduler assertion insertion point is missing')
          e2e = e2e.replace(scheduler_anchor, scheduler_replacement, 1)

          completion_anchor = '''  await gotoBeginnerLesson(page, 'why-kubernetes-exists', 8);
            await expect(page.getByTestId('teaching-takeaway')).toContainText(/declare|reality/i);
            await page.screenshot({'''
          completion_replacement = '''  await gotoBeginnerLesson(page, 'why-kubernetes-exists', 8);
            await expect(page.getByTestId('teaching-takeaway')).toContainText(/declare|reality/i);
            const completionTitle = page.locator('#lesson-completion-title');
            await expect(completionTitle).toHaveText('Why Kubernetes? From one container to self-healing');
            const completionTitleClips = await completionTitle.evaluate((element) => {
              const card = element.closest('.lesson-completion-card');
              if (!card) return true;
              const titleRect = element.getBoundingClientRect();
              const cardRect = card.getBoundingClientRect();
              return (
                element.scrollWidth > element.clientWidth + 1 ||
                titleRect.right > cardRect.right + 1 ||
                titleRect.bottom > cardRect.bottom + 1
              );
            });
            expect(completionTitleClips).toBe(false);
            await page.screenshot({'''
          if completion_anchor not in e2e:
              raise SystemExit('Completion title assertion insertion point is missing')
          e2e = e2e.replace(completion_anchor, completion_replacement, 1)

          zh_anchor = '''  expect(diagnostics?.routeHandles).toBe(1);
            await expect(page.locator('.scene-legend li')).toHaveCount(1);
            await page.screenshot({
              path: `${reviewDir}/14-zh-scheduler-one-line.png`,'''
          zh_replacement = '''  expect(diagnostics?.routeHandles).toBe(1);
            await expect(page.locator('.scene-legend li')).toHaveCount(1);
            await expect(page.locator('.scene-route-label:not([hidden])').first()).toContainText(/worker-c/i);
            await page.screenshot({
              path: `${reviewDir}/14-zh-scheduler-one-line.png`,'''
          if zh_anchor not in e2e:
              raise SystemExit('Chinese scheduler assertion insertion point is missing')
          e2e_path.write_text(e2e.replace(zh_anchor, zh_replacement, 1), encoding='utf-8')

          gate_path = Path('docs/review/BEGINNER_TEACHING_GATES.md')
          gates = gate_path.read_text(encoding='utf-8')
          gate_anchor = '- A region boundary must never resemble an active route.\n'
          gate_addition = (
              '- A region boundary must never resemble an active route.\n'
              '- A scheduling decision must visibly name the selected Node before the next step shows physical placement.\n'
              '- Completion titles must wrap inside their card at every supported viewport.\n'
          )
          if gate_anchor not in gates:
              raise SystemExit('Beginner gate insertion point is missing')
          gate_path.write_text(gates.replace(gate_anchor, gate_addition, 1), encoding='utf-8')
          PY
      - run: pnpm format
      - run: git diff --check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm content:validate
      - run: pnpm content:accuracy
      - run: pnpm test:unit --run
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run beginner and golden browser acceptance
        run: >-
          pnpm exec playwright test
          tests/e2e/beginner-teaching.spec.ts
          tests/e2e/golden-timeline.spec.ts
          --project=desktop-1280-chromium
      - run: rm -f .github/workflows/apply-beginner-visual-polish.yml
      - name: Commit beginner visual polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: clarify scheduling and completion layout'
          git push origin HEAD:rebuild/world-state-engine
