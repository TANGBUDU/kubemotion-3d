name: Retry beginner teaching contract fixes

on:
  push:
    branches: [rebuild/world-state-engine]

permissions:
  contents: write

concurrency:
  group: retry-beginner-teaching-contract-fixes
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: rebuild/world-state-engine
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply verified patch and final mobile assertion
        shell: bash
        run: |
          PATCH_B64="$(awk '/PATCH_B64: >-/{getline; sub(/^[[:space:]]+/, ""); print; exit}' .github/workflows/apply-beginner-contract-fixes.yml)"
          printf '%s' "$PATCH_B64" | base64 --decode > /tmp/beginner-contract-fixes.patch.gz
          echo '2bd7b72fcfe5f252e95b06de811da4ae5ef7092b0a93ffbf8140a11cd574b63a  /tmp/beginner-contract-fixes.patch.gz' | sha256sum --check -
          gzip --decompress --stdout /tmp/beginner-contract-fixes.patch.gz > /tmp/beginner-contract-fixes.patch
          git apply --check /tmp/beginner-contract-fixes.patch
          git apply /tmp/beginner-contract-fixes.patch
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/components/learnPage.test.tsx')
          text = path.read_text(encoding='utf-8')
          old = """    expect(screen.getByRole('button', { name: 'Select focused Pod' })).toHaveAttribute(
              'data-visible-labels',
              '3',
            );
          """
          new = """    expect(screen.getByRole('button', { name: 'Select focused Pod' })).toHaveAttribute(
              'data-visible-labels',
              '2',
            );
          """
          if old not in text:
              raise SystemExit('Mobile label assertion insertion point is missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/apply-beginner-contract-fixes.yml
          rm -f .github/workflows/retry-beginner-contract-fixes.yml
      - run: pnpm format
      - run: git diff --check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm content:validate
      - run: pnpm content:accuracy
      - run: pnpm test:unit --run
      - run: pnpm build
      - name: Commit verified beginner teaching fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: align beginner teaching contracts'
          git push origin HEAD:rebuild/world-state-engine
