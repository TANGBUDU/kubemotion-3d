name: Assistant Format Story Player
on:
  push:
    branches: [rebuild/world-state-engine]
    paths:
      - .github/assistant/format-story.trigger
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: rebuild/world-state-engine
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with: { version: 11.16.0 }
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: |
          rm .github/assistant/format-story.trigger
          rm .github/workflows/assistant-format-story.yml
      - run: git diff --check
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: format flow story player"
          git push origin HEAD:rebuild/world-state-engine
