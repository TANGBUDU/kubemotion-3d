name: Format award patch

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - name: Upload formatted patch
        uses: actions/upload-artifact@v4
        with:
          name: formatted-award-patch
          path: |
            src/components/HomeShowcase.tsx
            src/pages/HomePage.tsx
            src/styles/award/01-shell.css
            src/styles/award/03-showcase.css
            src/styles/award/04-content.css
            src/styles/award/05-responsive.css
            tests/components/homePage.test.tsx
          if-no-files-found: error
          retention-days: 1
