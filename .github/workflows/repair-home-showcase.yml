name: Finalize and validate homepage showreel

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: finalize-home-showreel
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Repair showreel state machine and exact test scopes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          showreel = Path('src/components/HomeShowcase.tsx')
          text = showreel.read_text('utf-8')
          replacements = [
              (
                  "if (!authoredStory) throw new Error(`Home showcase story is missing: ${storyId}`);\n",
                  "if (!authoredStory) throw new Error(`Home showcase story is missing: ${storyId}`);\nconst showcaseStory = authoredStory;\n",
              ),
              (
                  "      flowStoryEngine.compileStory(\n        authoredStory,\n",
                  "      flowStoryEngine.compileStory(\n        showcaseStory,\n",
              ),
              (
                  "      readonly play: string;\n      readonly replay: string;\n",
                  "      readonly play: string;\n      readonly next: string;\n      readonly replay: string;\n",
              ),
              (
                  "    play: 'Resume sequence',\n    replay: 'Replay sequence',\n",
                  "    play: 'Resume sequence',\n    next: 'Advance sequence',\n    replay: 'Replay sequence',\n",
              ),
              (
                  "    play: 'シーケンスを再開',\n    replay: 'シーケンスを再生し直す',\n",
                  "    play: 'シーケンスを再開',\n    next: '次の Beat へ',\n    replay: 'シーケンスを再生し直す',\n",
              ),
              (
                  "    play: '继续序列',\n    replay: '重新播放序列',\n",
                  "    play: '继续序列',\n    next: '下一阶段',\n    replay: '重新播放序列',\n",
              ),
              ("  const previousViewportClass = useRef(viewportClass);\n", ""),
              (
                  "  useEffect(() => {\n    if (previousViewportClass.current === viewportClass) return;\n    previousViewportClass.current = viewportClass;\n    setPlaybackId((current) => current + 1);\n  }, [viewportClass]);\n\n",
                  "",
              ),
              (
                  "  useEffect(() => {\n    if (!reducedMotion) return;\n    setPaused(true);\n  }, [reducedMotion]);\n\n",
                  "",
              ),
              (
                  "    setPaused((current) => !current);\n  };\n",
                  "    if (reducedMotion) {\n      const next = Math.min(beatIndex + 1, total - 1);\n      setBeatIndex(next);\n      setPlaybackId((current) => current + 1);\n      setComplete(next === total - 1);\n      setPaused(true);\n      return;\n    }\n    setPaused((current) => !current);\n  };\n",
              ),
              (
                  "  const controlLabel = complete ? copy.replay : paused || reducedMotion ? copy.play : copy.pause;\n",
                  "  const controlLabel = complete\n    ? copy.replay\n    : reducedMotion\n      ? copy.next\n      : paused\n        ? copy.play\n        : copy.pause;\n",
              ),
              (
                  "              stepKey: `home-showcase:${compiled.story.id}:${beat.beat.id}`,\n",
                  "              stepKey: `home-showcase:${compiled.story.id}:${beat.beat.id}:${viewportClass}`,\n",
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Missing HomeShowcase source fragment:\n{old}')
              text = text.replace(old, new, 1)
          showreel.write_text(text, 'utf-8')

          test = Path('tests/components/homePage.test.tsx')
          text = test.read_text('utf-8')
          replacements = [
              (
                  "import { fireEvent, render, screen, waitFor } from '@testing-library/react';\n",
                  "import { fireEvent, render, screen, waitFor, within } from '@testing-library/react';\n",
              ),
              (
                  "    renderHome();\n\n    expect(screen.getByTestId('orientation-card')).toBeVisible();\n",
                  "    renderHome();\n    const showreel = within(document.querySelector('.home-showcase') as HTMLElement);\n\n    expect(screen.getByTestId('orientation-card')).toBeVisible();\n",
              ),
              (
                  "    expect(screen.getByRole('heading', { name: 'Manifest to running Pod' })).toBeVisible();\n    expect(screen.getByText('kubectl submits desired state to the API Server')).toBeVisible();\n",
                  "    expect(showreel.getByRole('heading', { name: 'Manifest to running Pod' })).toBeVisible();\n    expect(showreel.getByText('kubectl submits desired state to the API Server')).toBeVisible();\n",
              ),
              (
                  "    renderHome();\n\n    fireEvent.click(\n      screen.getByRole('button', {\n",
                  "    renderHome();\n    const showreel = within(document.querySelector('.home-showcase') as HTMLElement);\n\n    fireEvent.click(\n      showreel.getByRole('button', {\n",
              ),
              (
                  "    expect(screen.getByText('A controller reconciles the replica deficit')).toBeVisible();\n",
                  "    expect(showreel.getByText('A controller reconciles the replica deficit')).toBeVisible();\n",
              ),
              (
                  "    useAppStore.setState({ locale });\n    renderHome();\n\n    expect(screen.getByTestId('scene-preview')).toHaveAccessibleName(ariaLabel);\n    expect(screen.getByRole('heading', { name: title })).toBeVisible();\n    expect(screen.getByText(beatTitle)).toBeVisible();\n",
                  "    useAppStore.setState({ locale });\n    renderHome();\n    const showreel = within(document.querySelector('.home-showcase') as HTMLElement);\n\n    expect(screen.getByTestId('scene-preview')).toHaveAccessibleName(ariaLabel);\n    expect(showreel.getByRole('heading', { name: title })).toBeVisible();\n    expect(showreel.getByText(beatTitle)).toBeVisible();\n",
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Missing HomePage test fragment:\n{old}')
              text = text.replace(old, new, 1)
          test.write_text(text, 'utf-8')
          PY
      - run: pnpm format
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm content:validate
      - run: pnpm content:accuracy
      - run: pnpm test:unit --run
      - run: pnpm build
      - name: Remove temporary diagnostic workflows
        run: |
          rm -f .github/workflows/repair-home-showcase.yml
          rm -f .github/workflows/diagnose-service.yml
      - name: Commit the fully validated repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Finalize cinematic English-first homepage"
          git push origin HEAD:main
