name: Format beginner E2E fix

on:
  push:
    branches: [rebuild/world-state-engine]

permissions:
  contents: write

concurrency:
  group: format-beginner-e2e-fix
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: rebuild/world-state-engine
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write tests/e2e/beginner-teaching.spec.ts
      - run: pnpm format:check
      - run: rm -f .github/workflows/format-beginner-e2e.yml
      - name: Commit formatted E2E assertions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'style: format beginner browser assertions'
          git push origin HEAD:rebuild/world-state-engine
