name: Finalize persistent homepage Kubernetes playground

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: finalize-persistent-playground
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply final playground review fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Mobile Explain CTA keeps an accessible name even when its visual text is hidden.
          path = Path('src/components/HomeShowcase.tsx')
          text = path.read_text('utf-8')
          old = '''            <Link
              className="showcase-learn-link"
              to={`/stories/${preset.storyId}/${compiledBeatIndex}`}
'''
          new = '''            <Link
              className="showcase-learn-link"
              aria-label={copy.explain}
              title={copy.explain}
              to={`/stories/${preset.storyId}/${compiledBeatIndex}`}
'''
          if old not in text:
              raise SystemExit('Missing showcase learn link fragment')
          text = text.replace(old, new, 1)

          old = '''      data-play-state={complete ? 'complete' : playing ? 'playing' : 'paused'}
      data-preset={presetId}
'''
          new = '''      data-play-state={complete ? 'complete' : playing ? 'playing' : 'paused'}
      data-preset={presetId}
      data-beat-index={beatIndex}
'''
          if old not in text:
              raise SystemExit('Missing showcase state data fragment')
          text = text.replace(old, new, 1)
          path.write_text(text, 'utf-8')

          # The restart lesson exposes kubelet, so its visible Node parent must also remain explicit.
          path = Path('content/courses/kubernetes-foundations/lessons/container-restart-vs-pod-replacement.yaml')
          text = path.read_text('utf-8')
          start = text.index('  - id: container-restarted\n')
          end = text.index('  - id: kubectl-delete-pod\n', start)
          block = text[start:end]
          old = '''        - selector: { byIds: [runtime-component:node:worker-a:Kubelet:kubelet] }
          visible: true
          emphasis: normal
          labelMode: full
'''
          new = '''        - selector: { byIds: [infrastructure:cluster:global:Node:worker-a] }
          visible: true
          emphasis: normal
          labelMode: full
        - selector: { byIds: [runtime-component:node:worker-a:Kubelet:kubelet] }
          visible: true
          emphasis: normal
          labelMode: full
'''
          if old not in block:
              raise SystemExit('Missing container-restarted kubelet rule')
          block = block.replace(old, new, 1)
          text = text[:start] + block + text[end:]
          path.write_text(text, 'utf-8')

          # The 3D product demo should enter the first viewport immediately instead of centering
          # against the taller orientation copy.
          path = Path('src/styles/award/02-hero.css')
          text = path.read_text('utf-8')
          old = '''  gap: clamp(34px, 4.5vw, 82px);
  align-items: center;
  max-width: 1720px;
'''
          new = '''  gap: clamp(34px, 4.5vw, 82px);
  align-items: start;
  max-width: 1720px;
'''
          if old not in text:
              raise SystemExit('Missing hero alignment fragment')
          path.write_text(text.replace(old, new, 1), 'utf-8')

          path = Path('src/styles/award/03-showcase.css')
          text = path.read_text('utf-8')
          old = '''.home-showcase {
  position: relative;
  z-index: 2;
  min-width: 0;
  perspective: 1600px;
}
'''
          new = '''.home-showcase {
  position: sticky;
  z-index: 2;
  top: calc(var(--header-height) + 22px);
  align-self: start;
  min-width: 0;
  perspective: 1600px;
}
'''
          if old not in text:
              raise SystemExit('Missing home-showcase base block')
          path.write_text(text.replace(old, new, 1), 'utf-8')

          path = Path('src/styles/award/05-responsive.css')
          text = path.read_text('utf-8')
          old = '''  .home-showcase {
    order: -1;
  }
'''
          new = '''  .home-showcase {
    position: relative;
    top: auto;
    order: -1;
  }
'''
          if old not in text:
              raise SystemExit('Missing tablet home-showcase block')
          path.write_text(text.replace(old, new, 1), 'utf-8')

          # Browser QA explicitly exercises the formerly failing runtime beat and rejects page errors.
          path = Path('tests/e2e/homePlayground.spec.ts')
          text = path.read_text('utf-8')
          text = text.replace(
              "  const showcase = page.locator('.home-showcase');\n  const scenario = (name: string) => showcase.getByRole('button', { name, exact: true });\n",
              "  const pageErrors: string[] = [];\n  page.on('pageerror', (error) => pageErrors.push(error.message));\n  const showcase = page.locator('.home-showcase');\n  const scenario = (name: string) => showcase.getByRole('button', { name, exact: true });\n",
              1,
          )
          old = '''  await scenario('Kill container').click();
  await expect(scenario('Kill container')).toHaveAttribute('aria-pressed', 'true');
  await expect(showcase.getByText('Container restart versus Pod replacement', { exact: true })).toBeVisible();
  await expect(showcase.getByRole('link', { name: 'Explain this' })).toHaveAttribute(
    'href',
    '#/stories/container-restart-vs-pod-replacement/2',
  );

  await scenario('Delete Pod').click();
'''
          new = '''  await scenario('Kill container').click();
  await expect(scenario('Kill container')).toHaveAttribute('aria-pressed', 'true');
  await expect(showcase.getByText('Container restart versus Pod replacement', { exact: true })).toBeVisible();
  await expect(showcase.getByRole('link', { name: 'Explain this' })).toHaveAttribute(
    'href',
    '#/stories/container-restart-vs-pod-replacement/2',
  );
  await showcase.locator('.showcase-timeline button').nth(1).click();
  await expect(showcase).toHaveAttribute('data-beat-index', '1');
  await expect(showcase.getByText('kubelet restarts the Container in the same Pod', { exact: true })).toBeVisible();
  expect(pageErrors).toEqual([]);

  await scenario('Delete Pod').click();
'''
          if old not in text:
              raise SystemExit('Missing Kill container E2E block')
          text = text.replace(old, new, 1)
          old = '''  expect(hasPageOverflow).toBe(false);

  await page.screenshot({ path: testInfo.outputPath('homepage-playground.png'), fullPage: false });
});
'''
          new = '''  expect(hasPageOverflow).toBe(false);
  expect(pageErrors).toEqual([]);

  await page.screenshot({ path: testInfo.outputPath('homepage-playground.png'), fullPage: false });
});
'''
          if old not in text:
              raise SystemExit('Missing first E2E overflow block')
          text = text.replace(old, new, 1)

          # Reduced-motion path: assert component state instead of relying on a CSS-dependent locator.
          old = '''  const showcase = page.locator('.home-showcase');
  await showcase.getByRole('button', { name: 'Kill container', exact: true }).click();
  await expect(showcase.getByRole('button', { name: 'Advance sequence' })).toBeVisible();
  await expect(showcase.locator('.showcase-timeline button[aria-current="step"] span')).toHaveText('01');

  await showcase.getByRole('button', { name: 'Advance sequence' }).click();
  await expect(showcase.locator('.showcase-timeline button[aria-current="step"] span')).toHaveText('02');
'''
          new = '''  const pageErrors: string[] = [];
  page.on('pageerror', (error) => pageErrors.push(error.message));
  const showcase = page.locator('.home-showcase');
  await showcase.getByRole('button', { name: 'Kill container', exact: true }).click();
  await expect(showcase.getByRole('button', { name: 'Advance sequence' })).toBeVisible();
  await expect(showcase).toHaveAttribute('data-beat-index', '0');

  await showcase.getByRole('button', { name: 'Advance sequence' }).click();
  await expect(showcase).toHaveAttribute('data-beat-index', '1');
  await expect(showcase.getByText('kubelet restarts the Container in the same Pod', { exact: true })).toBeVisible();
  expect(pageErrors).toEqual([]);
'''
          if old not in text:
              raise SystemExit('Missing reduced-motion E2E block')
          text = text.replace(old, new, 1)
          path.write_text(text, 'utf-8')
          PY

      - run: pnpm prettier --write src/components/HomeShowcase.tsx src/styles/award/02-hero.css src/styles/award/03-showcase.css src/styles/award/05-responsive.css content/courses/kubernetes-foundations/lessons/container-restart-vs-pod-replacement.yaml tests/e2e/homePlayground.spec.ts
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm content:validate
      - run: pnpm content:accuracy
      - run: pnpm test:unit --run
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run strict persistent-playground browser matrix
        run: pnpm exec playwright test tests/e2e/homePlayground.spec.ts

      - name: Upload final browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persistent-playground-final-qa
          path: |
            test-results
            playwright-report
          if-no-files-found: warn
          retention-days: 7

      - name: Remove one-shot review workflows
        if: success()
        run: |
          rm -f .github/workflows/home-playground-qa.yml
          rm -f .github/workflows/finalize-persistent-playground.yml

      - name: Commit reviewed final source
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Polish persistent Kubernetes homepage playground"
          git push origin HEAD:main
