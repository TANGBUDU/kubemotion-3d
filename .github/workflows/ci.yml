name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  format-fix:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply staged Story Player lint fix
        run: |
          if [ -f .github/assistant/story-lint.patch ]; then
            python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/FlowStoryPage.tsx')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  "import { useEffect, useMemo, useState } from 'react';",
                  "import { useCallback, useEffect, useMemo, useState } from 'react';",
              ),
              (
                  "function routeSummary(beat: CompiledFlowStoryBeat, locale: Locale): string | undefined {",
                  "function routeSummary(beat: CompiledFlowStoryBeat): string | undefined {",
              ),
              (
                  "const route = beat ? routeSummary(beat, locale) : undefined;",
                  "const route = beat ? routeSummary(beat) : undefined;",
              ),
              (
                  """  const go = (index: number, replay = true) => {\n    if (!compiled) return;\n    const next = Math.max(0, Math.min(index, compiled.beats.length - 1));\n    navigate(`/stories/${compiled.story.id}/${next}`);\n    if (replay) setPlaybackId((value) => value + 1);\n  };""",
                  """  const go = useCallback(\n    (index: number, replay = true) => {\n      if (!compiled) return;\n      const next = Math.max(0, Math.min(index, compiled.beats.length - 1));\n      navigate(`/stories/${compiled.story.id}/${next}`);\n      if (replay) setPlaybackId((value) => value + 1);\n    },\n    [compiled, navigate],\n  );""",
              ),
              (
                  "}, [beatIndex, compiled, playbackId, playing, reducedMotion, step]);",
                  "}, [beatIndex, compiled, go, playbackId, playing, reducedMotion, step]);",
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Missing expected Story Player text: {old[:80]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
            rm .github/assistant/story-lint.patch
          fi
      - uses: pnpm/action-setup@v4
        with: { version: 11.16.0 }
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - name: Remove obsolete one-shot formatter files
        run: |
          rm -f .github/assistant/format-story.trigger
          rm -f .github/workflows/assistant-format-story.yml
      - name: Commit formatter changes when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No formatter changes to commit."
            exit 0
          fi
          git commit -m "fix: stabilize flow story playback hooks"
          git push origin HEAD:${{ github.head_ref }}
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 11.16.0 }
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm content:validate
      - run: pnpm test:unit --run
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run focused PR browser smoke tests
        run: >-
          pnpm exec playwright test
          tests/e2e/batch03-traffic-composition.spec.ts
          tests/e2e/explore-selection.spec.ts
          tests/e2e/golden-timeline.spec.ts
          tests/e2e/flow-story-player.spec.ts
          --project=desktop-1280-chromium
      - name: Pack assistant source snapshot
        run: >-
          tar -czf assistant-source.tar.gz
          src content tests
          package.json pnpm-lock.yaml
          tsconfig.json vite.config.ts playwright.config.ts
          .github
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assistant-source-${{ github.sha }}
          path: assistant-source.tar.gz
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-review-${{ github.sha }}
          path: docs/review/evidence/batch03/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
