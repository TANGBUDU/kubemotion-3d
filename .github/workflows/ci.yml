name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 11.16.0 }
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm content:validate
      - run: pnpm test:unit --run
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run focused PR browser smoke tests
        run: >-
          pnpm exec playwright test
          tests/e2e/batch03-traffic-composition.spec.ts
          tests/e2e/explore-selection.spec.ts
          tests/e2e/golden-timeline.spec.ts
          --project=desktop-1280-chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-review-${{ github.sha }}
          path: docs/review/evidence/batch03/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
