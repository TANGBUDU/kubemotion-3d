name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  apply-mobile-sheet-fix:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with: { version: 11.16.0 }
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Apply mobile teaching-sheet fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/LearnPage.tsx')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  "import { useCallback, useEffect, useMemo, useState } from 'react';",
                  "import { useCallback, useEffect, useMemo, useRef, useState } from 'react';",
              ),
              (
                  "  const [sheetExpanded, setSheetExpanded] = useState(() => !isMobile);\n  const t = lessonUi(locale);",
                  "  const [sheetExpanded, setSheetExpanded] = useState(() => !isMobile);\n  const previousIsMobile = useRef(isMobile);\n  const t = lessonUi(locale);",
              ),
              (
                  "  useEffect(() => {\n    if (valid && lesson) enterLesson(lesson.id, stepIndex);\n  }, [enterLesson, lesson, stepIndex, valid]);\n\n  useEffect(() => {\n    const onKey = (event: KeyboardEvent) => {",
                  "  useEffect(() => {\n    if (valid && lesson) enterLesson(lesson.id, stepIndex);\n  }, [enterLesson, lesson, stepIndex, valid]);\n\n  useEffect(() => {\n    if (previousIsMobile.current === isMobile) return;\n    previousIsMobile.current = isMobile;\n    setSheetExpanded(!isMobile);\n  }, [isMobile]);\n\n  useEffect(() => {\n    const onKey = (event: KeyboardEvent) => {",
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Missing expected LearnPage text: {old[:100]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm -f .github/assistant/mobile-sheet.patch
      - run: pnpm format
      - run: git diff --check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm exec vitest --run tests/components/learnPage.test.tsx
      - name: Commit mobile teaching-sheet fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: collapse teaching sheet when entering mobile"
          git push origin HEAD:${{ github.head_ref }}
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 11.16.0 }
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm content:validate
      - run: pnpm test:unit --run
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run focused PR browser smoke tests
        run: >-
          pnpm exec playwright test
          tests/e2e/beginner-teaching.spec.ts
          tests/e2e/batch03-traffic-composition.spec.ts
          tests/e2e/explore-selection.spec.ts
          tests/e2e/golden-timeline.spec.ts
          tests/e2e/flow-story-player.spec.ts
          --project=desktop-1280-chromium
      - name: Pack assistant source snapshot
        run: >-
          tar -czf assistant-source.tar.gz
          src content tests
          package.json pnpm-lock.yaml
          tsconfig.json vite.config.ts playwright.config.ts
          .github
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assistant-source-${{ github.sha }}
          path: assistant-source.tar.gz
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-review-${{ github.sha }}
          path: |
            docs/review/evidence/beginner/
            docs/review/evidence/batch03/
            docs/review/evidence/story-player/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
